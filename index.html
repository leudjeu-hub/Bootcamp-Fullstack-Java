uantite) {\n        trouver(nom).vendre(quantite);\n    }\n\n    public List<Produit> produitsEnAlerte() {\n        return produits.stream()\n                .filter(p -> p.getStock() < p.getSeuilMinimum())\n                .toList();\n    }\n\n    public double valeurTotaleDuStock() {\n        return produits.stream()\n                .mapToDouble(p -> p.getPrix() * p.getStock())\n                .sum();\n    }\n\n    private Produit trouver(String nom) {\n        return produits.stream()\n                .filter(p -> p.getNom().equalsIgnoreCase(nom))\n                .findFirst()\n                .orElseThrow(() -> new IllegalArgumentException(\"Produit inconnu : \" + nom));\n    }\n}", "lang": "java"}]}]}, {"id": "m2", "weeks": "Woche 3 & 4", "title": "Datenbanken", "icon": "🗄️", "color": "#00D1FF", "summary": "Daten dauerhaft speichern mit SQL und MySQL.", "deliverable": "Ein Skript <code>schema.sql<\/code> und ein Skript <code>data.sql<\/code>, die die LibraStock-Datenbank anlegen und befüllen (Kategorien, Produkte, Bewegungen), plus eine Datei <code>requetes.sql<\/code> mit 10 nützlichen Abfragen.", "lessons": [{"title": "Relationale Datenbanken", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Tabellen, Zeilen und Spalten verstehen<\/li><li>Primärschlüssel und Fremdschlüssel kennen<\/li><li>Die Daten von LibraStock modellieren<\/li><\/ul>"}, {"type": "text", "title": "Warum eine Datenbank?", "html": "\n<p>In Modul 1 verschwinden die Produkte, sobald das Programm endet: Sie liegen nur im Arbeitsspeicher.\nEine <b>Datenbank<\/b> speichert Daten <b>dauerhaft<\/b>, ermöglicht schnelles Suchen und das Teilen zwischen mehreren Benutzern.<\/p>\n<p>Eine <b>relationale<\/b> Datenbank (MySQL, PostgreSQL …) organisiert Daten in <b>Tabellen<\/b>, die miteinander verknüpft sind. Abgefragt wird sie mit der Sprache <b>SQL<\/b>.<\/p>\n<table class=\"tbl\"><tr><th>id<\/th><th>nom<\/th><th>prix<\/th><th>stock<\/th><th>categorie_id<\/th><\/tr>\n<tr><td>1<\/td><td>Cahier A4<\/td><td>2.50<\/td><td>140<\/td><td>2<\/td><\/tr>\n<tr><td>2<\/td><td>Le Petit Prince<\/td><td>7.90<\/td><td>12<\/td><td>1<\/td><\/tr><\/table>\n<p><small>Eine Tabelle = eine Objektart · eine Zeile = ein Datensatz · eine Spalte = ein Attribut<\/small><\/p>\n"}, {"type": "text", "title": "Schlüssel und Beziehungen", "html": "\n<ul>\n<li><b>Primärschlüssel (PRIMARY KEY)<\/b>: eindeutige Kennung jeder Zeile, oft eine automatisch hochgezählte <code>id<\/code>.<\/li>\n<li><b>Fremdschlüssel (FOREIGN KEY)<\/b>: eine Spalte, die auf den Primärschlüssel einer anderen Tabelle zeigt.<\/li>\n<\/ul>\n<p><b>Beziehungen in LibraStock:<\/b><\/p>\n<div class=\"flow\"><span>categorie<\/span><span class=\"arrow\">1 ── N<\/span><span>produit<\/span><span class=\"arrow\">1 ── N<\/span><span>mouvement_stock<\/span><\/div>\n<p>Eine Kategorie enthält mehrere Produkte; ein Produkt hat mehrere Bewegungen (Ein- und Ausgänge).\nDas zeichnet man in einem <b>Entity-Relationship-Diagramm<\/b>.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "Wofür ist ein Fremdschlüssel da?", "options": ["Um Daten zu verschlüsseln", "Um eine Zeile mit einer Zeile einer anderen Tabelle zu verknüpfen", "Um Ergebnisse zu sortieren", "Um den Webserver zu beschleunigen"], "answer": 1, "explain": "Der Fremdschlüssel <code>categorie_id<\/code> in <code>produit<\/code> gibt an, zu welcher Kategorie ein Produkt gehört."}, {"type": "exercise", "title": "Übung: zeichne dein Modell", "task": "\n<p>Zeichne auf Papier oder mit <a href=\"https://dbdiagram.io\" target=\"_blank\" rel=\"noopener\">dbdiagram.io<\/a> die Tabellen\n<code>categorie<\/code>, <code>produit<\/code>, <code>mouvement_stock<\/code> und <code>utilisateur<\/code> (Benutzer) mit Spalten, Primär- und Fremdschlüsseln.<\/p>\n", "solution": "categorie(id PK, nom)\nproduit(id PK, nom, prix, stock, seuil_minimum, categorie_id FK -> categorie.id)\nmouvement_stock(id PK, produit_id FK -> produit.id, type ENTREE/SORTIE, quantite, date_mouvement)\nutilisateur(id PK, email UNIQUE, mot_de_passe_hash, role VENDEUR/ADMIN)", "lang": "text"}]}, {"title": "SQL: Daten anlegen und bearbeiten", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Tabellen mit CREATE TABLE anlegen<\/li><li>CRUD: INSERT, SELECT, UPDATE, DELETE<\/li><li>Mit WHERE und ORDER BY filtern und sortieren<\/li><\/ul>"}, {"type": "code", "title": "Die Tabellen anlegen", "lang": "sql", "code": "CREATE DATABASE librastock;\nUSE librastock;\n\nCREATE TABLE categorie (\n    id  INT AUTO_INCREMENT PRIMARY KEY,\n    nom VARCHAR(100) NOT NULL UNIQUE\n);\n\nCREATE TABLE produit (\n    id            INT AUTO_INCREMENT PRIMARY KEY,\n    nom           VARCHAR(150) NOT NULL,\n    prix          DECIMAL(10,2) NOT NULL,\n    stock         INT NOT NULL DEFAULT 0,\n    seuil_minimum INT NOT NULL DEFAULT 5,\n    categorie_id  INT,\n    FOREIGN KEY (categorie_id) REFERENCES categorie(id)\n);", "note": ""}, {"type": "code", "title": "CRUD: Create, Read, Update, Delete", "lang": "sql", "code": "-- CREATE\nINSERT INTO categorie (nom) VALUES ('Livres'), ('Papeterie');\nINSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Cahier A4', 2.50, 140, 20, 2),\n       ('Stylo bleu', 0.80, 6, 30, 2),\n       ('Le Petit Prince', 7.90, 12, 5, 1);\n\n-- READ\nSELECT * FROM produit;\nSELECT nom, prix FROM produit WHERE prix < 5 ORDER BY prix DESC;\nSELECT nom FROM produit WHERE stock < seuil_minimum;   -- alertes !\n\n-- UPDATE (toujours avec un WHERE !)\nUPDATE produit SET stock = stock - 3 WHERE id = 1;\n\n-- DELETE (toujours avec un WHERE !)\nDELETE FROM produit WHERE id = 3;", "note": "⚠️ Ein <code>UPDATE<\/code> oder <code>DELETE<\/code> ohne <code>WHERE<\/code> ändert oder löscht <b>alle<\/b> Zeilen der Tabelle."}, {"type": "quiz", "title": "Quiz", "question": "Welche Abfrage zeigt die Produkte, deren Bestand unter der Schwelle liegt?", "options": ["SELECT * FROM produit ORDER BY stock", "SELECT nom FROM produit WHERE stock < seuil_minimum", "UPDATE produit SET stock = 0", "DELETE FROM produit WHERE stock < 5"], "answer": 1, "explain": "<code>WHERE<\/code> filtert Zeilen nach einer Bedingung."}, {"type": "exercise", "title": "Übung: CRUD-Abfragen", "task": "\n<ol><li>Füge 3 Produkte deiner Wahl hinzu.<\/li>\n<li>Zeige alle Produkte der Kategorie 2, sortiert nach Name.<\/li>\n<li>Erhöhe den Preis der Bücher (Kategorie 1) um 10 %.<\/li>\n<li>Zeige die 3 teuersten Produkte (Tipp: <code>LIMIT<\/code>).<\/li><\/ol>\n", "solution": "INSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Gomme', 0.50, 80, 20, 2), ('Règle 30 cm', 1.20, 40, 10, 2), ('L''Étranger', 6.50, 9, 5, 1);\n\nSELECT * FROM produit WHERE categorie_id = 2 ORDER BY nom;\n\nUPDATE produit SET prix = prix * 1.10 WHERE categorie_id = 1;\n\nSELECT nom, prix FROM produit ORDER BY prix DESC LIMIT 3;", "lang": "sql"}]}, {"title": "MySQL in der Praxis: Joins und Aggregate", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>MySQL installieren und starten<\/li><li>Tabellen mit JOIN kombinieren<\/li><li>Mit COUNT, SUM, GROUP BY rechnen<\/li><li>Die Skripte von Modul 2 abgeben<\/li><\/ul>"}, {"type": "code", "title": "MySQL starten (mit Docker, empfohlen)", "lang": "bash", "code": "docker run --name mysql-librastock \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  -e MYSQL_DATABASE=librastock \\\n  -p 3306:3306 -d mysql:8\n\n# Se connecter en ligne de commande\ndocker exec -it mysql-librastock mysql -u root -p", "note": "Ohne Docker: MySQL Community Server + <b>MySQL Workbench<\/b> (grafische Oberfläche) installieren. Auch DBeaver ist ein sehr gutes kostenloses Werkzeug, um die Datenbank zu erkunden."}, {"type": "code", "title": "JOIN: mehrere Tabellen kombinieren", "lang": "sql", "code": "-- Nom du produit + nom de sa catégorie\nSELECT p.nom AS produit, c.nom AS categorie, p.stock\nFROM produit p\nJOIN categorie c ON p.categorie_id = c.id;\n\n-- LEFT JOIN : garde aussi les catégories sans produit\nSELECT c.nom, p.nom\nFROM categorie c\nLEFT JOIN produit p ON p.categorie_id = c.id;", "note": ""}, {"type": "code", "title": "Aggregate: zählen und summieren", "lang": "sql", "code": "-- Nombre de produits et valeur du stock par catégorie\nSELECT c.nom              AS categorie,\n       COUNT(p.id)        AS nb_produits,\n       SUM(p.prix * p.stock) AS valeur_stock\nFROM categorie c\nJOIN produit p ON p.categorie_id = c.id\nGROUP BY c.nom\nHAVING valeur_stock > 50\nORDER BY valeur_stock DESC;", "note": "<code>WHERE<\/code> filtert Zeilen <i>vor<\/i> der Gruppierung, <code>HAVING<\/code> filtert Gruppen <i>danach<\/i>."}, {"type": "quiz", "title": "Quiz", "question": "Welche Klausel gruppiert Zeilen, um eine Summe pro Kategorie zu berechnen?", "options": ["ORDER BY", "GROUP BY", "LIMIT", "JOIN"], "answer": 1, "explain": "<code>GROUP BY<\/code> bildet eine Gruppe pro Wert; <code>SUM<\/code>, <code>COUNT<\/code>, <code>AVG<\/code> rechnen auf jeder Gruppe."}, {"type": "exercise", "title": "🎯 Ergebnis Modul 2", "task": "\n<p>Lege in deinem Repository einen Ordner <code>database/<\/code> an mit:<\/p>\n<ul><li><code>schema.sql<\/code>: die 4 Tabellen (categorie, produit, mouvement_stock, utilisateur);<\/li>\n<li><code>data.sql<\/code>: mindestens 3 Kategorien, 15 Produkte und 20 Bewegungen;<\/li>\n<li><code>requetes.sql<\/code>: 10 kommentierte Abfragen (Warnungen, Umsatz pro Monat, Top 5 Verkäufe …).<\/li><\/ul>\n", "solution": "CREATE TABLE mouvement_stock (\n    id             INT AUTO_INCREMENT PRIMARY KEY,\n    produit_id     INT NOT NULL,\n    type           ENUM('ENTREE','SORTIE') NOT NULL,\n    quantite       INT NOT NULL CHECK (quantite > 0),\n    date_mouvement DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (produit_id) REFERENCES produit(id)\n);\n\n-- Top 5 des produits les plus vendus\nSELECT p.nom, SUM(m.quantite) AS total_vendu\nFROM mouvement_stock m\nJOIN produit p ON p.id = m.produit_id\nWHERE m.type = 'SORTIE'\nGROUP BY p.nom\nORDER BY total_vendu DESC\nLIMIT 5;", "lang": "sql"}]}]}, {"id": "m3", "weeks": "Woche 5 bis 8", "title": "Frameworks: Spring", "icon": "🌱", "color": "#6DB33F", "summary": "Eine professionelle REST-API mit Spring Boot bauen, mit MySQL verbunden und abgesichert.", "deliverable": "Eine funktionierende Spring-Boot-REST-API (CRUD für Produkte, Lagerbewegungen, Warnungen), verbunden mit MySQL, mit Validierung, Fehlerbehandlung, Tests und JWT-Anmeldung.", "lessons": [{"title": "Einführung in Spring Boot", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Verstehen, was ein Framework ist<\/li><li>Dependency Injection verstehen<\/li><li>Ein Projekt mit Spring Initializr erzeugen<\/li><\/ul>"}, {"type": "text", "title": "Warum ein Framework?", "html": "\n<p>Ein <b>Framework<\/b> ist ein fertiges Grundgerüst: Es kümmert sich um die Technik im Hintergrund (Webserver, Datenbankverbindung, Sicherheit …),\ndamit du dich auf die <b>Geschäftslogik<\/b> konzentrierst.<\/p>\n<p><b>Spring<\/b> ist das meistgenutzte Java-Framework. <b>Spring Boot<\/b> macht den Einstieg einfach: automatische Konfiguration und eingebauter Webserver (Tomcat).<\/p>\n<p><b>Dependency Injection<\/b>: Statt überall <code>new ProduitService()<\/code> zu schreiben, erzeugt Spring die Objekte (die <b>Beans<\/b>) und „injiziert“ sie dort, wo du sie brauchst.<\/p>\n"}, {"type": "text", "title": "Das Projekt anlegen", "html": "\n<ol class=\"steps\">\n<li>Gehe auf <a href=\"https://start.spring.io\" target=\"_blank\" rel=\"noopener\">start.spring.io<\/a>.<\/li>\n<li>Project: <b>Maven<\/b> · Language: <b>Java<\/b> · Spring Boot: neueste stabile Version · Java: <b>21<\/b>.<\/li>\n<li>Group: <code>com.librastock<\/code> · Artifact: <code>api<\/code>.<\/li>\n<li>Abhängigkeiten: <b>Spring Web<\/b>, <b>Spring Data JPA<\/b>, <b>MySQL Driver<\/b>, <b>Validation<\/b>, <b>Lombok<\/b> (optional).<\/li>\n<li>Auf <b>Generate<\/b> klicken, entpacken, in IntelliJ öffnen.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Projektstruktur", "lang": "text", "code": "api/\n├── pom.xml                         ← dépendances Maven\n└── src/\n    ├── main/\n    │   ├── java/com/librastock/api/\n    │   │   ├── ApiApplication.java   ← point d'entrée\n    │   │   ├── controller/           ← reçoit les requêtes HTTP\n    │   │   ├── service/              ← logique métier\n    │   │   ├── repository/           ← accès à la base de données\n    │   │   ├── model/                ← entités (tables)\n    │   │   └── dto/                  ← objets échangés avec le client\n    │   └── resources/\n    │       └── application.properties\n    └── test/                         ← tests automatisés", "note": ""}, {"type": "code", "title": "Hallo Spring", "lang": "java", "code": "@RestController\npublic class HelloController {\n\n    @GetMapping(\"/hello\")\n    public String hello() {\n        return \"LibraStock API est en ligne !\";\n    }\n}\n// Lance l'application puis ouvre http://localhost:8080/hello", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Was macht Dependency Injection?", "options": ["Sie schleust SQL in die Datenbank ein", "Spring erzeugt Objekte und stellt sie den Klassen bereit, die sie brauchen", "Sie installiert Maven-Abhängigkeiten", "Sie verschlüsselt Passwörter"], "answer": 1, "explain": "Spring verwaltet den Lebenszyklus der <b>Beans<\/b> (@Service, @Repository, @RestController …) und injiziert sie über den Konstruktor."}]}, {"title": "Eine REST-API bauen", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Die REST-Prinzipien verstehen<\/li><li>Einen CRUD-Controller erstellen<\/li><li>Die richtigen HTTP-Codes verwenden<\/li><li>Mit Postman oder curl testen<\/li><\/ul>"}, {"type": "text", "title": "Die Routen von LibraStock", "html": "\n<table class=\"tbl\">\n<tr><th>Methode<\/th><th>URL<\/th><th>Aktion<\/th><th>Antwort<\/th><\/tr>\n<tr><td>GET<\/td><td>/api/produits<\/td><td>Auflisten<\/td><td>200<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/{id}<\/td><td>Details<\/td><td>200 / 404<\/td><\/tr>\n<tr><td>POST<\/td><td>/api/produits<\/td><td>Anlegen<\/td><td>201<\/td><\/tr>\n<tr><td>PUT<\/td><td>/api/produits/{id}<\/td><td>Ändern<\/td><td>200<\/td><\/tr>\n<tr><td>DELETE<\/td><td>/api/produits/{id}<\/td><td>Löschen<\/td><td>204<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/alertes<\/td><td>Niedriger Bestand<\/td><td>200<\/td><\/tr>\n<\/table>\n<p>REST: <b>Ressourcen<\/b> (Substantive im Plural) + <b>HTTP-Methoden<\/b>. Ausgetauscht wird <b>JSON<\/b>.<\/p>\n"}, {"type": "code", "title": "Der Controller", "lang": "java", "code": "@RestController\n@RequestMapping(\"/api/produits\")\npublic class ProduitController {\n\n    private final ProduitService service;\n\n    public ProduitController(ProduitService service) { // injection par constructeur\n        this.service = service;\n    }\n\n    @GetMapping\n    public List<ProduitDto> lister() {\n        return service.lister();\n    }\n\n    @GetMapping(\"/{id}\")\n    public ProduitDto detail(@PathVariable Long id) {\n        return service.trouver(id);\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public ProduitDto creer(@Valid @RequestBody ProduitDto dto) {\n        return service.creer(dto);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void supprimer(@PathVariable Long id) {\n        service.supprimer(id);\n    }\n}", "note": ""}, {"type": "code", "title": "Ein DTO mit Validierung", "lang": "java", "code": "public record ProduitDto(\n        Long id,\n        @NotBlank String nom,\n        @NotNull @Positive BigDecimal prix,\n        @PositiveOrZero int stock,\n        @PositiveOrZero int seuilMinimum,\n        Long categorieId\n) {}", "note": "Ein <b>DTO<\/b> (Data Transfer Object) legt fest, was die API empfängt und zurückgibt. Die Datenbank-Entitäten werden nicht direkt nach außen gegeben."}, {"type": "code", "title": "Die API testen", "lang": "bash", "code": "curl http://localhost:8080/api/produits\n\ncurl -X POST http://localhost:8080/api/produits \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"nom\":\"Classeur\",\"prix\":3.20,\"stock\":25,\"seuilMinimum\":5,\"categorieId\":2}'", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Welchen HTTP-Code gibt man nach dem erfolgreichen Anlegen eines Produkts zurück?", "options": ["200 OK", "201 Created", "204 No Content", "404 Not Found"], "answer": 1, "explain": "<b>201 Created<\/b> zeigt an, dass eine neue Ressource angelegt wurde."}]}, {"title": "Spring Data JPA und MySQL", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Die Verbindung zu MySQL konfigurieren<\/li><li>Eine Klasse mit @Entity zur Tabelle machen<\/li><li>Ein Repository ohne SQL nutzen<\/li><li>Beziehungen zwischen Entitäten abbilden<\/li><\/ul>"}, {"type": "code", "title": "application.properties", "lang": "properties", "code": "spring.datasource.url=jdbc:mysql://localhost:3306/librastock\nspring.datasource.username=root\nspring.datasource.password=${DB_PASSWORD}\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true", "note": "Schreibe nie ein echtes Passwort in den Code: Nutze eine Umgebungsvariable (<code>${DB_PASSWORD}<\/code>)."}, {"type": "code", "title": "Eine JPA-Entität", "lang": "java", "code": "@Entity\n@Table(name = \"produit\")\npublic class Produit {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false)\n    private String nom;\n\n    private BigDecimal prix;\n    private int stock;\n    private int seuilMinimum;\n\n    @ManyToOne\n    @JoinColumn(name = \"categorie_id\")\n    private Categorie categorie;\n\n    // constructeurs, getters, setters...\n}", "note": ""}, {"type": "code", "title": "Ein Repository", "lang": "java", "code": "public interface ProduitRepository extends JpaRepository<Produit, Long> {\n\n    // Spring génère le SQL à partir du nom de la méthode !\n    List<Produit> findByCategorieNom(String nom);\n\n    List<Produit> findByNomContainingIgnoreCase(String texte);\n\n    @Query(\"SELECT p FROM Produit p WHERE p.stock < p.seuilMinimum\")\n    List<Produit> findEnAlerte();\n}", "note": "<code>JpaRepository<\/code> liefert schon <code>findAll()<\/code>, <code>findById()<\/code>, <code>save()<\/code>, <code>deleteById()<\/code> …"}, {"type": "code", "title": "Der Service: die Geschäftslogik", "lang": "java", "code": "@Service\npublic class StockService {\n\n    private final ProduitRepository produits;\n    private final MouvementRepository mouvements;\n\n    public StockService(ProduitRepository produits, MouvementRepository mouvements) {\n        this.produits = produits;\n        this.mouvements = mouvements;\n    }\n\n    @Transactional\n    public void vendre(Long produitId, int quantite) {\n        Produit p = produits.findById(produitId)\n                .orElseThrow(() -> new RessourceIntrouvableException(\"Produit \" + produitId));\n        if (p.getStock() < quantite) {\n            throw new StockInsuffisantException(p.getNom());\n        }\n        p.setStock(p.getStock() - quantite);\n        mouvements.save(new MouvementStock(p, TypeMouvement.SORTIE, quantite));\n    }\n}", "note": "<code>@Transactional<\/code>: Entweder klappt alles (Bestand aktualisiert + Bewegung gespeichert) oder nichts wird gespeichert."}, {"type": "quiz", "title": "Quiz", "question": "Was bewirkt spring.jpa.hibernate.ddl-auto=update?", "options": ["Es löscht die Datenbank bei jedem Start", "Es passt das Tabellenschema an die Entitäten an", "Es aktualisiert Spring Boot", "Es sichert die Datenbank"], "answer": 1, "explain": "Praktisch in der Entwicklung. In Produktion nutzt man besser versionierte Migrationen mit <b>Flyway<\/b> oder <b>Liquibase<\/b>."}]}, {"title": "Qualität: Fehler, Tests und Sicherheit", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Saubere Fehlermeldungen zurückgeben<\/li><li>Tests mit JUnit und MockMvc schreiben<\/li><li>Anmeldung per JWT und Rollen verstehen<\/li><li>Die API von Modul 3 abgeben<\/li><\/ul>"}, {"type": "code", "title": "Zentrale Fehlerbehandlung", "lang": "java", "code": "@RestControllerAdvice\npublic class GestionErreurs {\n\n    @ExceptionHandler(RessourceIntrouvableException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public Map<String, String> introuvable(RessourceIntrouvableException e) {\n        return Map.of(\"erreur\", e.getMessage());\n    }\n\n    @ExceptionHandler(StockInsuffisantException.class)\n    @ResponseStatus(HttpStatus.CONFLICT)\n    public Map<String, String> stock(StockInsuffisantException e) {\n        return Map.of(\"erreur\", \"Stock insuffisant : \" + e.getMessage());\n    }\n}", "note": ""}, {"type": "code", "title": "Ein Integrationstest", "lang": "java", "code": "@SpringBootTest\n@AutoConfigureMockMvc\nclass ProduitControllerTest {\n\n    @Autowired MockMvc mvc;\n\n    @Test\n    void produitInexistantRenvoie404() throws Exception {\n        mvc.perform(get(\"/api/produits/9999\"))\n           .andExpect(status().isNotFound());\n    }\n\n    @Test\n    void creationSansNomRenvoie400() throws Exception {\n        mvc.perform(post(\"/api/produits\")\n                .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"prix\\\": 2.5}\"))\n           .andExpect(status().isBadRequest());\n    }\n}", "note": "Starte die Tests mit <code>./mvnw test<\/code>. Ab Woche 13 führt GitHub Actions sie bei jedem Push automatisch aus."}, {"type": "text", "title": "Sicherheit: JWT und Rollen", "html": "\n<ol class=\"steps\">\n<li>Der Benutzer schickt E-Mail + Passwort an <code>POST /api/auth/login<\/code>.<\/li>\n<li>Der Server prüft das Passwort (mit BCrypt <b>gehasht<\/b> gespeichert, nie im Klartext).<\/li>\n<li>Er gibt ein signiertes <b>JWT-Token<\/b> zurück, das Kennung und Rolle enthält.<\/li>\n<li>Der Client schickt dieses Token bei jeder Anfrage mit: <code>Authorization: Bearer &lt;token&gt;<\/code>.<\/li>\n<li><b>Spring Security<\/b> prüft Token und Rechte: Ein <code>VENDEUR<\/code> (Verkäufer) darf verkaufen, nur ein <code>ADMIN<\/code> darf ein Produkt löschen.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Zugriffsregeln mit Spring Security", "lang": "java", "code": "@Bean\nSecurityFilterChain securite(HttpSecurity http, JwtFilter jwtFilter) throws Exception {\n    return http\n        .csrf(csrf -> csrf.disable())\n        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n        .authorizeHttpRequests(auth -> auth\n            .requestMatchers(\"/api/auth/**\").permitAll()\n            .requestMatchers(HttpMethod.DELETE, \"/api/**\").hasRole(\"ADMIN\")\n            .anyRequest().authenticated())\n        .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)\n        .build();\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Wie sollten Passwörter gespeichert werden?", "options": ["Im Klartext in der Datenbank", "Mit einem Schlüssel im Code verschlüsselt", "Mit einem Verfahren wie BCrypt gehasht", "Im JWT-Token"], "answer": 2, "explain": "Ein Hash ist nicht umkehrbar: Selbst wenn die Datenbank abfließt, sind die Passwörter nicht direkt lesbar."}, {"type": "exercise", "title": "🎯 Ergebnis Modul 3", "task": "\n<p>Eine Spring-Boot-API <code>librastock-api<\/code> mit:<\/p>\n<ul><li>vollständigem CRUD für <b>Produkte<\/b> und <b>Kategorien<\/b>;<\/li>\n<li><code>POST /api/stock/entree<\/code> und <code>POST /api/stock/sortie<\/code> (mit gespeicherter Bewegung);<\/li>\n<li><code>GET /api/produits/alertes<\/code>;<\/li>\n<li>Validierung + saubere JSON-Fehler (400, 404, 409);<\/li>\n<li>mindestens 8 erfolgreichen Tests;<\/li>\n<li>JWT-Login mit den Rollen VENDEUR / ADMIN;<\/li>\n<li>einer README, die erklärt, wie man das Projekt startet.<\/li><\/ul>\n", "solution": "Checkliste zur Selbstkontrolle:\n[ ] ./mvnw test → BUILD SUCCESS\n[ ] Alle Routen in Postman getestet (Collection im Repo exportiert)\n[ ] Kein Passwort und kein Geheimnis im Code (Umgebungsvariablen)\n[ ] Ein VENDEUR bekommt 403 bei DELETE /api/produits/{id}\n[ ] Mehr verkaufen als vorhanden liefert 409 und ändert nichts", "lang": "text"}]}]}, {"id": "m4", "weeks": "Woche 9 bis 12", "title": "Das Frontend", "icon": "🎨", "color": "#61DAFB", "summary": "Die Oberfläche bauen, die Benutzer sehen: HTML, CSS und dann React, verbunden mit deiner API.", "deliverable": "Eine React-App LibraStock: Anmeldung, Produktliste mit Suche, Formular zum Anlegen, Verkauf erfassen und Übersicht der Warnungen, verbunden mit deiner Spring-API.", "lessons": [{"title": "HTML: die Struktur", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Die Rolle von HTML verstehen<\/li><li>Semantische Tags verwenden<\/li><li>Tabellen und Formulare erstellen<\/li><\/ul>"}, {"type": "text", "title": "Das Web-Trio", "html": "\n<ul>\n<li><b>HTML<\/b>: die <b>Struktur<\/b> und der Inhalt (Überschriften, Texte, Formulare …).<\/li>\n<li><b>CSS<\/b>: die <b>Darstellung<\/b> (Farben, Layout, Responsive Design).<\/li>\n<li><b>JavaScript<\/b>: das <b>Verhalten<\/b> (Klicks, API-Aufrufe …). React ist eine JavaScript-Bibliothek.<\/li>\n<\/ul>\n<p>Ein HTML-Dokument ist ein Baum aus <b>Tags<\/b>: <code>&lt;tag attribut=\"wert\"&gt;Inhalt&lt;/tag&gt;<\/code>.<\/p>\n"}, {"type": "code", "title": "Eine semantische Seite", "lang": "html", "code": "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>LibraStock<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <header>\n    <h1>LibraStock<\/h1>\n    <nav><a href=\"#produits\">Produits<\/a> <a href=\"#alertes\">Alertes<\/a><\/nav>\n  <\/header>\n  <main>\n    <section id=\"produits\">\n      <h2>Produits<\/h2>\n      <table>\n        <thead><tr><th>Nom<\/th><th>Prix<\/th><th>Stock<\/th><\/tr><\/thead>\n        <tbody><tr><td>Cahier A4<\/td><td>2,50 €<\/td><td>140<\/td><\/tr><\/tbody>\n      <\/table>\n    <\/section>\n  <\/main>\n  <footer>© 2026 LibraStock<\/footer>\n<\/body>\n<\/html>", "note": ""}, {"type": "code", "title": "Ein Formular", "lang": "html", "code": "<form>\n  <label for=\"nom\">Nom du produit<\/label>\n  <input id=\"nom\" name=\"nom\" type=\"text\" required>\n\n  <label for=\"prix\">Prix (€)<\/label>\n  <input id=\"prix\" name=\"prix\" type=\"number\" step=\"0.01\" min=\"0\" required>\n\n  <label for=\"categorie\">Catégorie<\/label>\n  <select id=\"categorie\" name=\"categorie\">\n    <option value=\"1\">Livres<\/option>\n    <option value=\"2\">Papeterie<\/option>\n  <\/select>\n\n  <button type=\"submit\">Ajouter<\/button>\n<\/form>", "note": "Verknüpfe jedes Feld mit einem <code>&lt;label&gt;<\/code>: Das ist für die Barrierefreiheit unverzichtbar."}, {"type": "quiz", "title": "Quiz", "question": "Welches Tag nimmst du für den Hauptinhalt einer Seite?", "options": ["<div>", "<main>", "<span>", "<b>"], "answer": 1, "explain": "<code>&lt;main&gt;<\/code> ist ein <b>semantisches<\/b> Tag: Es gibt der Struktur Bedeutung (wichtig für Barrierefreiheit und Suchmaschinen)."}]}, {"title": "CSS: die Gestaltung", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Elemente mit Selektoren ansprechen<\/li><li>Das Box-Modell verstehen<\/li><li>Mit Flexbox und Grid gestalten<\/li><li>Eine Seite responsive machen<\/li><\/ul>"}, {"type": "code", "title": "Selektoren und Box-Modell", "lang": "css", "code": "/* sélecteur de balise, de classe, d'id */\nbody { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; }\n.carte { background: white; border-radius: 12px; }\n#alertes { border-left: 4px solid crimson; }\n\n/* Modèle de boîte : contenu + padding + border + margin */\n.carte {\n  padding: 16px;          /* espace intérieur */\n  border: 1px solid #ddd; /* bordure */\n  margin: 8px;            /* espace extérieur */\n  box-sizing: border-box; /* width inclut padding et border */\n}", "note": ""}, {"type": "code", "title": "Flexbox und Grid", "lang": "css", "code": "/* Flexbox : aligner sur une ligne */\nheader {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 12px 24px;\n}\n\n/* Grid : une grille de cartes produits */\n.grille-produits {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 16px;\n}", "note": ""}, {"type": "code", "title": "Responsive", "lang": "css", "code": "/* Mobile d'abord, puis on adapte aux grands écrans */\nnav a { display: block; }\n\n@media (min-width: 768px) {\n  nav a { display: inline-block; margin-left: 16px; }\n}", "note": "Teste dein Design in den Entwicklertools des Browsers (Mobilgeräte-Ansicht)."}, {"type": "quiz", "title": "Quiz", "question": "Welche Eigenschaft macht aus einem Container ein Raster?", "options": ["display: flex", "display: grid", "position: absolute", "float: left"], "answer": 1, "explain": "<code>display: grid<\/code> + <code>grid-template-columns<\/code> legen die Spalten fest."}, {"type": "exercise", "title": "Übung: die Katalogseite", "task": "\n<p>Erstelle eine HTML- und CSS-Seite, die 6 Produkte als Karten anzeigt (Name, Kategorie, Preis, Bestand).\nKarten mit niedrigem Bestand bekommen einen roten Rahmen (Klasse <code>.alerte<\/code>). Auf dem Handy: 1 Spalte; am Computer: 3 Spalten.<\/p>\n", "solution": ".grille { display: grid; grid-template-columns: 1fr; gap: 16px; }\n@media (min-width: 900px) { .grille { grid-template-columns: repeat(3, 1fr); } }\n.carte { padding: 16px; border: 1px solid #ddd; border-radius: 12px; }\n.carte.alerte { border: 2px solid crimson; }", "lang": "css"}]}, {"title": "React: die Grundlagen", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Ein React-Projekt mit Vite anlegen<\/li><li>Komponenten schreiben und JSX nutzen<\/li><li>Daten mit Props weitergeben<\/li><li>Zustand mit useState verwalten<\/li><\/ul>"}, {"type": "code", "title": "Das Projekt anlegen", "lang": "bash", "code": "npm create vite@latest librastock-web -- --template react\ncd librastock-web\nnpm install\nnpm run dev        # ouvre http://localhost:5173", "note": "Voraussetzung: <b>Node.js LTS<\/b> ist installiert. Vite ist heute das empfohlene Startwerkzeug."}, {"type": "text", "title": "Komponenten und JSX", "html": "\n<p>Mit React wird die Oberfläche in <b>Komponenten<\/b> zerlegt: Funktionen, die <b>JSX<\/b> zurückgeben (HTML in JavaScript).<\/p>\n<div class=\"flow\"><span>App<\/span><span class=\"arrow\">→<\/span><span>BarreRecherche<\/span><span class=\"arrow\">+<\/span><span>ListeProduits<\/span><span class=\"arrow\">→<\/span><span>CarteProduit ×N<\/span><\/div>\n<p>Daten fließen über <b>Props<\/b> von der Eltern- zur Kindkomponente. Jede Komponente kann ihren eigenen <b>Zustand<\/b> haben (<code>useState<\/code>): Ändert sich der Zustand, aktualisiert React die Anzeige automatisch.<\/p>\n"}, {"type": "code", "title": "Props und Listen", "lang": "jsx", "code": "function CarteProduit({ produit }) {\n  const enAlerte = produit.stock < produit.seuilMinimum;\n  return (\n    <div className={enAlerte ? \"carte alerte\" : \"carte\"}>\n      <h3>{produit.nom}<\/h3>\n      <p>{produit.prix.toFixed(2)} € · stock : {produit.stock}<\/p>\n      {enAlerte && <strong>⚠ À commander<\/strong>}\n    <\/div>\n  );\n}\n\nfunction ListeProduits({ produits }) {\n  return (\n    <div className=\"grille\">\n      {produits.map(p => <CarteProduit key={p.id} produit={p} />)}\n    <\/div>\n  );\n}", "note": ""}, {"type": "code", "title": "Zustand mit useState", "lang": "jsx", "code": "import { useState } from \"react\";\n\nfunction Recherche({ produits }) {\n  const [texte, setTexte] = useState(\"\");\n\n  const filtres = produits.filter(p =>\n    p.nom.toLowerCase().includes(texte.toLowerCase())\n  );\n\n  return (\n    <>\n      <input\n        placeholder=\"Rechercher un produit…\"\n        value={texte}\n        onChange={e => setTexte(e.target.value)}\n      />\n      <ListeProduits produits={filtres} />\n    <\/>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Was passiert, wenn man setTexte(...) aufruft?", "options": ["Nichts, man muss die Seite neu laden", "React aktualisiert den Zustand und zeichnet die Komponente neu", "Der Wert wird an den Server geschickt", "Die Komponente wird entfernt"], "answer": 1, "explain": "Eine Zustandsänderung löst ein neues Rendern der Komponente aus."}]}, {"title": "React mit der API verbinden", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Daten mit useEffect und fetch laden<\/li><li>Ein Formular an die API senden<\/li><li>Mit React Router zwischen Seiten wechseln<\/li><li>Das Frontend von Modul 4 abgeben<\/li><\/ul>"}, {"type": "code", "title": "Die Produkte laden", "lang": "jsx", "code": "import { useEffect, useState } from \"react\";\n\nconst API = import.meta.env.VITE_API_URL; // ex. http://localhost:8080\n\nexport default function PageProduits() {\n  const [produits, setProduits] = useState([]);\n  const [chargement, setChargement] = useState(true);\n  const [erreur, setErreur] = useState(null);\n\n  useEffect(() => {\n    fetch(`${API}/api/produits`, {\n      headers: { Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n    })\n      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })\n      .then(setProduits)\n      .catch(e => setErreur(e.message))\n      .finally(() => setChargement(false));\n  }, []); // [] = une seule fois, au premier affichage\n\n  if (chargement) return <p>Chargement…<\/p>;\n  if (erreur) return <p>Erreur : {erreur}<\/p>;\n  return <ListeProduits produits={produits} />;\n}", "note": ""}, {"type": "code", "title": "Ein Formular absenden", "lang": "jsx", "code": "function FormulaireVente({ produitId, onSucces }) {\n  const [quantite, setQuantite] = useState(1);\n\n  async function envoyer(e) {\n    e.preventDefault();\n    const r = await fetch(`${API}/api/stock/sortie`, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\",\n                 Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n      body: JSON.stringify({ produitId, quantite }),\n    });\n    if (r.status === 409) return alert(\"Stock insuffisant\");\n    onSucces();\n  }\n\n  return (\n    <form onSubmit={envoyer}>\n      <input type=\"number\" min=\"1\" value={quantite}\n             onChange={e => setQuantite(Number(e.target.value))} />\n      <button>Enregistrer la vente<\/button>\n    <\/form>\n  );\n}", "note": "Erlaube auf der Spring-Seite die Herkunft des Frontends (CORS): <code>@CrossOrigin(\"http://localhost:5173\")<\/code> oder eine globale Konfiguration."}, {"type": "code", "title": "Mehrere Seiten mit React Router", "lang": "jsx", "code": "// npm install react-router-dom\nimport { BrowserRouter, Routes, Route, Link } from \"react-router-dom\";\n\nexport default function App() {\n  return (\n    <BrowserRouter>\n      <nav>\n        <Link to=\"/\">Produits<\/Link> · <Link to=\"/alertes\">Alertes<\/Link>\n      <\/nav>\n      <Routes>\n        <Route path=\"/\" element={<PageProduits />} />\n        <Route path=\"/alertes\" element={<PageAlertes />} />\n        <Route path=\"/login\" element={<PageLogin />} />\n      <\/Routes>\n    <\/BrowserRouter>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Warum übergibt man [] als zweites Argument von useEffect?", "options": ["Damit der Effekt nie läuft", "Damit der Effekt nur einmal beim ersten Anzeigen läuft", "Um den Zustand zu leeren", "Um fetch abzubrechen"], "answer": 1, "explain": "Ein leeres Abhängigkeits-Array bedeutet: Effekt nur nach dem ersten Rendern ausführen."}, {"type": "exercise", "title": "🎯 Ergebnis Modul 4", "task": "\n<p>Die App <code>librastock-web<\/code> braucht:<\/p>\n<ul><li>eine Seite <b>Anmeldung<\/b>, die das JWT-Token speichert;<\/li>\n<li>eine Seite <b>Produkte<\/b> mit Suche und Anlegen (ADMIN);<\/li>\n<li>das Erfassen eines <b>Verkaufs<\/b> und eines <b>Wareneingangs<\/b>;<\/li>\n<li>eine Seite <b>Warnungen<\/b>;<\/li>\n<li>eine saubere Darstellung auf dem Handy;<\/li>\n<li>Anzeige von Ladezustand und Fehlern.<\/li><\/ul>\n", "solution": "Checkliste zur Selbstkontrolle:\n[ ] npm run build läuft ohne Fehler\n[ ] Die API-URL kommt aus einer Umgebungsvariable (VITE_API_URL)\n[ ] Ein nicht angemeldeter Benutzer wird auf /login umgeleitet\n[ ] Nach einem Verkauf aktualisiert sich die Liste ohne Neuladen\n[ ] Auf einem Handy-Bildschirm getestet", "lang": "text"}]}]}, {"id": "m5", "weeks": "Woche 13 bis 16", "title": "Die Automatisierung", "icon": "⚙️", "color": "#2088FF", "summary": "Tests, Build und Deployment mit GitHub Actions automatisieren und das Abschlussprojekt abgeben.", "deliverable": "Eine GitHub-Actions-Pipeline, die API und Frontend bei jedem Push testet und baut, eine online laufende Anwendung und ein gepflegtes Portfolio-Repository (README, Screenshots, Architekturdiagramm).", "lessons": [{"title": "CI/CD und GitHub Actions", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Continuous Integration und Deployment verstehen<\/li><li>Die Begriffe kennen: Workflow, Job, Step, Runner<\/li><li>Einen ersten Workflow schreiben<\/li><\/ul>"}, {"type": "text", "title": "Warum automatisieren?", "html": "\n<ul>\n<li><b>CI – Continuous Integration<\/b>: Bei jedem <code>push<\/code> oder <i>Pull Request<\/i> wird der Code automatisch kompiliert und getestet. Ein Fehler fällt nach Minuten auf, nicht erst in Produktion.<\/li>\n<li><b>CD – Continuous Deployment<\/b>: Wenn alles grün ist, wird die Anwendung automatisch gebaut und veröffentlicht.<\/li>\n<\/ul>\n<div class=\"flow\"><span>git push<\/span><span class=\"arrow\">→<\/span><span>✅ Tests<\/span><span class=\"arrow\">→<\/span><span>📦 Build<\/span><span class=\"arrow\">→<\/span><span>🚀 Deployment<\/span><\/div>\n"}, {"type": "text", "title": "Die Begriffe von GitHub Actions", "html": "\n<table class=\"tbl\">\n<tr><th>Begriff<\/th><th>Bedeutung<\/th><\/tr>\n<tr><td><b>Workflow<\/b><\/td><td>Eine YAML-Datei in <code>.github/workflows/<\/code><\/td><\/tr>\n<tr><td><b>Event<\/b> (<code>on<\/code>)<\/td><td>Was den Workflow auslöst: push, pull_request, Zeitplan …<\/td><\/tr>\n<tr><td><b>Job<\/b><\/td><td>Eine Gruppe von Schritten auf einer Maschine<\/td><\/tr>\n<tr><td><b>Runner<\/b><\/td><td>Die virtuelle Maschine (z. B. <code>ubuntu-latest<\/code>)<\/td><\/tr>\n<tr><td><b>Step<\/b><\/td><td>Ein Befehl (<code>run<\/code>) oder eine wiederverwendbare Action (<code>uses<\/code>)<\/td><\/tr>\n<\/table>\n"}, {"type": "code", "title": ".github/workflows/hello.yml", "lang": "yaml", "code": "name: Hello CI\n\non:\n  push:\n    branches: [main]\n\njobs:\n  bonjour:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Dire bonjour\n        run: echo \"Bonjour depuis GitHub Actions 👋\"\n      - name: Lister les fichiers\n        run: ls -la", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Wo muss eine Workflow-Datei für GitHub Actions liegen?", "options": [".github/workflows/", "src/main/resources/", "workflows/ im Hauptordner", "node_modules/"], "answer": 0, "explain": "GitHub erkennt YAML-Dateien in <code>.github/workflows/<\/code> automatisch."}]}, {"title": "Pipeline für Java und React", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Die Spring-API automatisch testen und bauen<\/li><li>Das React-Frontend automatisch bauen<\/li><li>Eine MySQL-Datenbank in der CI nutzen<\/li><li>Geheimnisse (Secrets) verwalten<\/li><\/ul>"}, {"type": "code", "title": ".github/workflows/ci.yml", "lang": "yaml", "code": "name: CI LibraStock\n\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  api:\n    runs-on: ubuntu-latest\n    services:\n      mysql:\n        image: mysql:8\n        env:\n          MYSQL_ROOT_PASSWORD: test\n          MYSQL_DATABASE: librastock\n        ports: [\"3306:3306\"]\n        options: --health-cmd=\"mysqladmin ping\" --health-interval=10s --health-retries=5\n    defaults:\n      run:\n        working-directory: api\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: \"21\"\n          cache: maven\n      - name: Tests et build\n        run: ./mvnw -B verify\n        env:\n          DB_PASSWORD: test\n\n  web:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: web\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: web/package-lock.json\n      - run: npm ci\n      - run: npm run build", "note": ""}, {"type": "text", "title": "Secrets", "html": "\n<p>Ein Passwort, ein JWT-Signaturschlüssel oder ein Deployment-Token gehören <b>nie<\/b> in den Code.<\/p>\n<ol class=\"steps\">\n<li>Auf GitHub: <b>Settings → Secrets and variables → Actions → New repository secret<\/b>.<\/li>\n<li>Lege z. B. <code>JWT_SECRET<\/code> oder <code>DEPLOY_TOKEN<\/code> an.<\/li>\n<li>Nutze es im Workflow: <code>${{ secrets.JWT_SECRET }}<\/code>. GitHub blendet es in den Logs aus.<\/li>\n<\/ol>\n<p>Bonus: Aktiviere den <b>Schutz des Branches main<\/b>, damit nicht zusammengeführt werden kann, solange die CI nicht grün ist.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "Wie nutzt man ein Secret namens DEPLOY_TOKEN in einem Workflow?", "options": ["$DEPLOY_TOKEN", "${{ secrets.DEPLOY_TOKEN }}", "{{ DEPLOY_TOKEN }}", "process.env.DEPLOY_TOKEN"], "answer": 1, "explain": "Die Ausdruckssyntax von GitHub Actions ist <code>${{ ... }}<\/code>, und Secrets liegen im Kontext <code>secrets<\/code>."}, {"type": "exercise", "title": "Übung: die CI absichtlich kaputt machen", "task": "\n<ol><li>Füge den Workflow <code>ci.yml<\/code> deinem Projekt hinzu und pushe auf main: Prüfe im Tab <b>Actions<\/b>, dass alles grün ist.<\/li>\n<li>Erstelle einen Branch, ändere einen Test so, dass er fehlschlägt, und öffne einen <i>Pull Request<\/i>.<\/li>\n<li>Schau dir das rote ❌ am PR an und finde in den Logs den fehlgeschlagenen Test.<\/li>\n<li>Korrigiere, pushe erneut und sieh das ✅.<\/li><\/ol>\n", "solution": "Was du dir merken solltest:\n- Jeder Push auf den PR startet die CI automatisch neu.\n- Die Logs des Schritts \"Tests et build\" zeigen den Namen des fehlgeschlagenen Tests und die Zeile.\n- Mit Branch-Schutz bleibt der Button \"Merge\" gesperrt, solange die CI rot ist.", "lang": "text"}]}, {"title": "Deployment und Abschlussprojekt", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Die Anwendung mit Docker in Container packen<\/li><li>Automatisch deployen<\/li><li>Portfolio und Lebenslauf vorbereiten<\/li><li>Das Abschlussprojekt abgeben<\/li><\/ul>"}, {"type": "code", "title": "Dockerfile der API", "lang": "dockerfile", "code": "# Étape 1 : construire le .jar\nFROM maven:3.9-eclipse-temurin-21 AS build\nWORKDIR /app\nCOPY . .\nRUN mvn -B package -DskipTests\n\n# Étape 2 : image légère pour l'exécution\nFROM eclipse-temurin:21-jre\nWORKDIR /app\nCOPY --from=build /app/target/*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]", "note": ""}, {"type": "code", "title": "docker-compose.yml: alles mit einem Befehl starten", "lang": "yaml", "code": "services:\n  db:\n    image: mysql:8\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: librastock\n    volumes: [db-data:/var/lib/mysql]\n  api:\n    build: ./api\n    environment:\n      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/librastock\n      DB_PASSWORD: ${DB_PASSWORD}\n      JWT_SECRET: ${JWT_SECRET}\n    ports: [\"8080:8080\"]\n    depends_on: [db]\nvolumes:\n  db-data:", "note": "<code>docker compose up -d<\/code> startet Datenbank und API. Das gebaute React-Frontend (<code>npm run build<\/code>) kann von <b>Nginx<\/b> ausgeliefert oder bei einem Static-Hosting-Dienst gehostet werden."}, {"type": "text", "title": "Wo deployen?", "html": "\n<table class=\"tbl\">\n<tr><th>Teil<\/th><th>Einfache Optionen für den Anfang<\/th><\/tr>\n<tr><td>React-Frontend<\/td><td>GitHub Pages, Netlify, Vercel<\/td><\/tr>\n<tr><td>Spring-API (Docker)<\/td><td>Render, Railway, Fly.io oder ein kleiner VPS mit Nginx<\/td><\/tr>\n<tr><td>MySQL<\/td><td>Verwaltete Datenbank beim selben Anbieter oder Container auf dem VPS<\/td><\/tr>\n<\/table>\n<p>Kostenlose Angebote ändern sich oft: Prüfe die aktuellen Bedingungen, bevor du dich entscheidest.\nDie meisten dieser Dienste können bei jedem Push auf <code>main<\/code> automatisch deployen, oder über einen Deployment-Schritt in deinem Workflow.<\/p>\n"}, {"type": "text", "title": "Dein Portfolio", "html": "\n<p>Ein Recruiter schaut sich dein Repository etwa eine Minute an. Nutze sie:<\/p>\n<ul>\n<li><b>README<\/b>: ein Satz, der das Projekt erklärt, ein Screenshot, der Link zur Live-Demo.<\/li>\n<li><b>Architekturdiagramm<\/b>: React → Spring-API → MySQL, mit der CI/CD-Pipeline.<\/li>\n<li><b>Tech-Stack<\/b> und <b>wie man das Projekt startet<\/b> in 3 Befehlen.<\/li>\n<li>Ein grünes <b>CI-Badge<\/b> oben in der README.<\/li>\n<li>Im Lebenslauf: „Entwicklung einer Fullstack-Anwendung (Java 21, Spring Boot, MySQL, React, Docker, GitHub Actions)“ + Link.<\/li>\n<\/ul>\n"}, {"type": "quiz", "title": "Quiz", "question": "Was bringt ein Dockerfile in zwei Stufen (Multi-Stage)?", "options": ["Zweimal kompilieren, um sicherzugehen", "Ein kleineres Endabbild ohne Build-Werkzeuge", "Zwei Anwendungen starten", "GitHub Actions ersetzen"], "answer": 1, "explain": "Die erste Stufe enthält Maven zum Kompilieren, die zweite nur die JRE und die .jar: Das Abbild ist kleiner und sicherer."}, {"type": "exercise", "title": "🏁 Abschlussprojekt", "task": "\n<p>Dein Repository <code>librastock<\/code> enthält:<\/p>\n<ul><li><code>api/<\/code> (Spring Boot), <code>web/<\/code> (React), <code>database/<\/code> (SQL-Skripte);<\/li>\n<li><code>docker-compose.yml<\/code>, um alles lokal zu starten;<\/li>\n<li>eine grüne CI-Pipeline (Tests + Build) und ein Online-Deployment;<\/li>\n<li>eine Portfolio-README mit Screenshot, Diagramm und Demo-Link.<\/li><\/ul>\n<p>Stelle dein Projekt in 3 Minuten vor wie im Vorstellungsgespräch: das Problem, deine Lösung, der Stack, eine Schwierigkeit und wie du sie gelöst hast.<\/p>\n", "solution": "Abschluss-Checkliste:\n[ ] git clone + docker compose up → die Anwendung läuft\n[ ] Grünes CI-Badge in der README\n[ ] Live-Demo erreichbar\n[ ] Kein Geheimnis in der Git-Historie\n[ ] Du kannst jede Schicht erklären: React → REST/JSON → Spring → JPA → MySQL\n[ ] Du kannst die Pipeline erklären: push → Tests → Build → Deployment", "lang": "text"}]}]}], "project": "\n<p>Während des gesamten Bootcamps baust du <b>eine einzige Anwendung<\/b> von Anfang bis Ende:\n<b>LibraStock<\/b>, eine Lagerverwaltung für eine Buch- und Schreibwarenhandlung.<\/p>\n<ul>\n<li><b>Produkte<\/b>: Bücher, Hefte, Stifte … mit Preis, Lagerbestand und Kategorie.<\/li>\n<li><b>Lagerbewegungen<\/b>: Eingänge (Lieferung) und Ausgänge (Verkauf).<\/li>\n<li><b>Warnungen<\/b>: Liste der Produkte unter dem Mindestbestand.<\/li>\n<li><b>Benutzer<\/b>: Rolle <code>VENDEUR<\/code> (Verkäufer) und Rolle <code>ADMIN<\/code>.<\/li>\n<\/ul>\n<p>Jedes Modul fügt einen Baustein hinzu: die Datenbank, dann die Java/Spring-API, dann die React-Oberfläche,\ndann die automatische Pipeline. Am Ende hast du ein echtes Projekt für dein Portfolio.<\/p>\n<p><small>Hinweis: Die Codebeispiele verwenden französische Namen (z. B. <code>Produit<\/code> = Produkt, <code>vendre<\/code> = verkaufen), damit der Code in allen drei Sprachen identisch ist.<\/small><\/p>\n"}};

iz", "exercise": "Übung", "reveal": "👀 Lösung anzeigen", "revealNote": "Probier es immer erst selbst, bevor du nachschaust: Wer hängen bleibt, lernt am meisten.", "copy": "Kopieren", "copied": "Kopiert ✓", "ok": "✅ <b>Richtig!<\/b> ", "ko": "❌ <b>Nicht ganz.<\/b> ", "doneTitle": "Glückwunsch, du hast das Bootcamp abgeschlossen!", "doneText": "Prüfe, ob dein LibraStock-Projekt online ist, deine CI grün ist und deine README für Recruiter bereit ist.", "doneBtn": "Zurück zum Programm", "menu": "Lektionsmenü", "goals": "Lernziele"}};
let LANG = "fr", MODULES = COURSE.fr.modules;
const t = k => I18N[LANG][k];

/* ---------- état & stockage ---------- */
const KEY = "bootcamp-fullstack-java-v1";
let store = { done: {}, last: null, quiz: {}, lang: null };
try { const s = localStorage.getItem(KEY); if (s) store = Object.assign(store, JSON.parse(s)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const flat = [];
MODULES.forEach((m, mi) => m.lessons.forEach((l, li) => flat.push({ mi, li, id: m.id + "-" + li })));
let cur = { mi: 0, li: 0, si: 0 };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- coloration très légère ---------- */
function highlight(code, lang){
  let h = esc(code);
  const commentRe = (lang === "sql") ? /(--[^\n]*)/g
    : (["bash","yaml","properties","text","dockerfile"].includes(lang)) ? /(^|\s)(#[^\n]*)/gm
    : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g;
  if (lang === "html") return h.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="tok-c">$1</span>');
  if (["bash","yaml","properties","text","dockerfile"].includes(lang)) {
    return h.replace(commentRe, '$1<span class="tok-c">$2</span>');
  }
  h = h.replace(commentRe, '<span class="tok-c">$1</span>');
  if (["java","jsx","sql"].includes(lang)) {
    const kw = lang === "sql"
      ? /\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DATABASE|USE|PRIMARY|KEY|FOREIGN|REFERENCES|JOIN|LEFT|ON|GROUP|BY|ORDER|HAVING|LIMIT|AS|AND|NOT|NULL|DEFAULT|DESC|INT|VARCHAR|DECIMAL|DATETIME|ENUM|UNIQUE|AUTO_INCREMENT|CHECK|COUNT|SUM)\b/g
      : /\b(public|private|static|final|class|interface|record|extends|implements|return|new|if|else|for|while|void|int|double|boolean|throw|throws|import|export|default|function|const|let|async|await|try|catch)\b/g;
    h = h.split(/(<span class="tok-c">[\s\S]*?<\/span>)/).map(part =>
      part.startsWith('<span') ? part : part.replace(kw, '<span class="tok-k">$1</span>')).join("");
  }
  return h;
}

/* ---------- accueil ---------- */
function ring(p){
  const r = 22, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#232c6e" stroke-width="5"/>
  <circle cx="26" cy="26" r="${r}" fill="none" stroke="#7CFC00" stroke-width="5" stroke-linecap="round"
  stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 26 26)"/>
  <text x="26" y="30" text-anchor="middle" fill="#eef1ff" font-size="12" font-weight="700">${Math.round(p*100)}%</text></svg>`;
}
function renderHome(){
  $("techChips").innerHTML = ["Git","Java 21","SQL","MySQL","Spring Boot","JPA","JWT","HTML","CSS","React","GitHub Actions","Docker"]
    .map(t => `<span class="chip">${t}</span>`).join("");
  $("timeline").innerHTML = MODULES.map((m, mi) => {
    const d = m.lessons.filter((_, li) => store.done[m.id + "-" + li]).length;
    return `<div class="mod" data-mi="${mi}">
      <div><div class="weeks">${m.weeks}</div><div class="ico">${m.icon}</div></div>
      <div><h3>${m.title}</h3><p>${m.summary}</p><p style="margin-top:8px"><b style="color:var(--accent)">🎯 ${t("deliverable")}</b> ${m.deliverable}</p></div>
      <div class="count">${ring(d / m.lessons.length)}<div>${m.lessons.length} ${t("lessons")}</div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".mod").forEach(el => el.onclick = () => openLesson(+el.dataset.mi, 0, 0));
  const started = Object.keys(store.done).length > 0 || store.last;
  $("startBtn").textContent = started ? t("resume") : t("start");
  updateProgress();
}
function updateProgress(){
  const p = Math.round(100 * Object.keys(store.done).length / flat.length);
  $("progressLabel").textContent = p + " %";
  $("progressBar").style.width = p + "%";
}

/* ---------- lecteur ---------- */
function renderSide(){
  $("side").innerHTML = MODULES.map((m, mi) =>
    `<div class="mtitle">${m.icon} ${m.weeks} · ${m.title}</div>` +
    m.lessons.map((l, li) => {
      const id = m.id + "-" + li, act = (mi === cur.mi && li === cur.li);
      return `<button class="${store.done[id] ? "done" : ""} ${act ? "active" : ""}" data-mi="${mi}" data-li="${li}">
        <span class="dot">${store.done[id] ? "✓" : ""}</span><span>${l.title}</span></button>`;
    }).join("")
  ).join("");
  $("side").querySelectorAll("button").forEach(b => b.onclick = () => { openLesson(+b.dataset.mi, +b.dataset.li, 0); $("side").classList.remove("open"); });
}

function renderSlide(){
  const m = MODULES[cur.mi], l = m.lessons[cur.li], s = l.slides[cur.si];
  $("crumb").innerHTML = `<b>${m.weeks}</b> · ${m.title}`;
  $("lessonTitle").textContent = l.title;
  $("dots").innerHTML = l.slides.map((_, i) => `<span class="${i === cur.si ? "on" : (i < cur.si ? "seen" : "")}" data-i="${i}" title="Slide ${i+1}"></span>`).join("");
  $("dots").querySelectorAll("span").forEach(d => d.onclick = () => { cur.si = +d.dataset.i; renderSlide(); });

  let html = "";
  if (s.type === "text") {
    html = `<h3>${s.title}</h3>${s.html}`;
  } else if (s.type === "code") {
    html = `<h3>${s.title}</h3>${codeBlock(s.code, s.lang)}${s.note ? `<div class="note">💡 ${s.note}</div>` : ""}`;
  } else if (s.type === "quiz") {
    const qid = `${m.id}-${cur.li}-${cur.si}`;
    html = `<span class="badge q">${t("quiz")}</span><div class="quiz-q">${s.question}</div>` +
      s.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("") +
      `<div class="explain hidden" id="explain"></div>`;
    setTimeout(() => {
      const btns = [...document.querySelectorAll(".opt")];
      const show = (choice) => {
        btns.forEach((b, i) => { b.disabled = true; if (i === s.answer) b.classList.add("ok"); else if (i === choice) b.classList.add("ko"); });
        const ok = choice === s.answer;
        $("explain").innerHTML = (ok ? t("ok") : t("ko")) + s.explain;
        $("explain").classList.remove("hidden");
      };
      if (store.quiz[qid] !== undefined) show(store.quiz[qid]);
      btns.forEach((b, i) => b.onclick = () => { store.quiz[qid] = i; save(); show(i); });
    });
  } else if (s.type === "exercise") {
    html = `<span class="badge e">${t("exercise")}</span><h3>${s.title}</h3>${s.task}
      <button class="reveal" id="revealBtn">${t("reveal")}</button>
      <div class="hidden" id="solution">${codeBlock(s.solution, s.lang)}<div class="note">${t("revealNote")}</div></div>`;
    setTimeout(() => $("revealBtn").onclick = () => { $("solution").classList.toggle("hidden"); });
  }
  $("slide").innerHTML = html;
  $("slide").style.animation = "none"; void $("slide").offsetWidth; $("slide").style.animation = "";
  $("slide").querySelectorAll(".copy").forEach(b => b.onclick = () => {
    const txt = b.parentElement.querySelector("code").innerText;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { b.textContent = t("copied"); setTimeout(() => b.textContent = t("copy"), 1500); }).catch(() => {});
  });

  const idx = flat.findIndex(f => f.mi === cur.mi && f.li === cur.li);
  const lastSlide = cur.si === l.slides.length - 1;
  $("prevBtn").disabled = (idx === 0 && cur.si === 0);
  $("nextBtn").textContent = lastSlide ? (idx === flat.length - 1 ? t("finish") : t("nextLesson")) : t("next");
  store.last = { mi: cur.mi, li: cur.li, si: cur.si }; save();
  window.scrollTo({ top: 0 });
}
function codeBlock(code, lang){
  return `<pre><span class="lang">${lang}</span><button class="copy">${t("copy")}</button><code>${highlight(code, lang)}</code></pre>`;
}

function openLesson(mi, li, si){
  cur = { mi, li, si };
  $("home").classList.add("hidden"); $("player").classList.remove("hidden"); $("menuBtn").classList.remove("hidden");
  renderSide(); renderSlide();
  history.replaceState(null, "", `#${MODULES[mi].id}-${li}`);
}
function goHome(){
  $("player").classList.add("hidden"); $("home").classList.remove("hidden"); $("menuBtn").classList.add("hidden");
  history.replaceState(null, "", location.pathname);
  renderHome(); window.scrollTo({ top: 0 });
}
function next(){
  const l = MODULES[cur.mi].lessons[cur.li];
  if (cur.si < l.slides.length - 1) { cur.si++; renderSlide(); return; }
  store.done[MODULES[cur.mi].id + "-" + cur.li] = true; save(); updateProgress();
  const idx = flat.findIndex(f => f.mi === cur.mi && f.li === cur.li);
  if (idx < flat.length - 1) { const n = flat[idx + 1]; openLesson(n.mi, n.li, 0); }
  else finish();
}
function prev(){
  if (cur.si > 0) { cur.si--; renderSlide(); return; }
  const idx = flat.findIndex(f => f.mi === cur.mi && f.li === cur.li);
  if (idx > 0) { const p = flat[idx - 1]; openLesson(p.mi, p.li, MODULES[p.mi].lessons[p.li].slides.length - 1); }
}
function finish(){
  renderSide();
  $("slide").innerHTML = `<div class="done-box"><div class="big">🎉</div><h3>${t("doneTitle")}</h3>
  <p>${t("doneText")}</p>
  <button class="cta" onclick="goHome()">${t("doneBtn")}</button></div>`;
}

/* ---------- langue ---------- */
function setLang(l, initial){
  LANG = l; MODULES = COURSE[l].modules; store.lang = l; save();
  document.documentElement.lang = l;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));
  $("projectBox").innerHTML = COURSE[l].project;
  $("prevBtn").textContent = t("prev");
  $("menuBtn").setAttribute("aria-label", t("menu"));
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  if (initial || $("player").classList.contains("hidden")) renderHome();
  else { renderSide(); renderSlide(); }
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* ---------- événements ---------- */
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("homeLink").onclick = goHome;
$("menuBtn").onclick = () => $("side").classList.toggle("open");
$("startBtn").onclick = () => {
  if (store.last) openLesson(store.last.mi, store.last.li, store.last.si);
  else openLesson(0, 0, 0);
};
document.addEventListener("keydown", e => {
  if ($("player").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});

setLang(store.lang || ((navigator.language || "fr").slice(0,2) in I18N ? (navigator.language || "fr").slice(0,2) : "fr"), true);
const h = location.hash.match(/^#(m\d)-(\d+)$/);
if (h) { const mi = MODULES.findIndex(m => m.id === h[1]); if (mi >= 0 && MODULES[mi].lessons[+h[2]]) openLesson(mi, +h[2], 0); }
</script>
</body>
</html>
