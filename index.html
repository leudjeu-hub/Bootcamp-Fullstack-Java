 and server", "html": "\n<p>When you open a website, two programs talk to each other:<\/p>\n<div class=\"flow\"><span>🧑‍💻 Client<br><small>browser, mobile app<\/small><\/span><span class=\"arrow\">→ request →<\/span><span>🖥️ Server<br><small>program that listens<\/small><\/span><\/div>\n<div class=\"flow\"><span>🧑‍💻 Client<\/span><span class=\"arrow\">← response ←<\/span><span>🖥️ Server<\/span><\/div>\n<p>A <b>server<\/b> is not necessarily a special machine: first of all it is a <b>program<\/b> that waits for requests\non a <b>port<\/b> and sends back responses. This program runs on a computer (physical or in the cloud).<\/p>\n<p>In our project: the browser displays the <b>React<\/b> interface (client), which calls the <b>Spring Boot<\/b> API (server), which reads and writes to <b>MySQL<\/b> (database server).<\/p>\n"}, {"type": "text", "title": "The journey of a request", "html": "\n<ol class=\"steps\">\n<li><b>You type<\/b> <code>https://librastock.com/produits<\/code>.<\/li>\n<li><b>DNS<\/b>: the Internet's phone book translates <code>librastock.com<\/code> into an <b>IP<\/b> address (e.g. <code>51.15.20.4<\/code>).<\/li>\n<li><b>Connection<\/b>: the browser contacts this IP on <b>port 443<\/b> (HTTPS). Port 80 = HTTP, 3306 = MySQL, 8080 = usually Spring Boot locally.<\/li>\n<li><b>HTTP request<\/b>: <code>GET /produits<\/code>.<\/li>\n<li><b>Processing<\/b>: the server runs code and queries the database.<\/li>\n<li><b>HTTP response<\/b>: a <b>status code<\/b> (200, 404…) and content (HTML, JSON…).<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Anatomy of an HTTP request and response", "lang": "http", "code": "GET /api/produits/12 HTTP/1.1\nHost: librastock.com\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{ \"id\": 12, \"nom\": \"Cahier A4 96 pages\", \"prix\": 2.50, \"stock\": 140 }", "note": "HTTP verbs to know: <b>GET<\/b> (read), <b>POST<\/b> (create), <b>PUT<\/b> (update), <b>DELETE<\/b> (delete). Codes: <b>2xx<\/b> success, <b>4xx<\/b> client error, <b>5xx<\/b> server error."}, {"type": "code", "title": "The terminal: your first commands", "lang": "bash", "code": "pwd                 # où suis-je ?\nls -la              # lister les fichiers (même cachés)\ncd projets          # entrer dans un dossier\ncd ..               # remonter d'un niveau\nmkdir librastock    # créer un dossier\ntouch notes.txt     # créer un fichier vide\ncat notes.txt       # afficher un fichier\nrm notes.txt        # supprimer un fichier (attention, pas de corbeille !)\ncurl https://api.github.com   # envoyer une requête HTTP depuis le terminal", "note": "Developers spend a lot of time in the terminal. On Mac: the <b>Terminal<\/b> app. On Windows: <b>Git Bash<\/b> or <b>WSL<\/b>."}, {"type": "quiz", "title": "Quiz", "question": "What does HTTP status code 404 mean?", "options": ["The server crashed", "The requested resource does not exist", "The request succeeded", "You need to log in"], "answer": 1, "explain": "404 = <i>Not Found<\/i>. A 5xx error indicates a server-side problem, 401/403 an authentication or permission problem."}, {"type": "quiz", "title": "Quiz", "question": "What is the role of DNS?", "options": ["Encrypting the connection", "Storing web pages", "Translating a domain name into an IP address", "Running Java code"], "answer": 2, "explain": "DNS is the Internet's phone book: it turns <code>librastock.com<\/code> into an IP address."}, {"type": "exercise", "title": "Exercise: observe a real request", "task": "\n<ol><li>Open your browser, then the developer tools (<kbd>F12<\/kbd> or <kbd>Cmd+Option+I<\/kbd>), <b>Network<\/b> tab.<\/li>\n<li>Reload any web page.<\/li>\n<li>Click the first request and note: the method, the status code, the response <code>Content-Type<\/code>.<\/li>\n<li>In the terminal, run <code>curl -i https://api.github.com/users/octocat<\/code> and find the same information.<\/li><\/ol>\n", "solution": "Method: GET\nStatus code: 200 OK\nContent-Type: text/html (web page) or application/json (API)\nWith curl -i, the headers are shown before the JSON body.", "lang": "text"}]}, {"title": "What is Git?", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand why we version code<\/li><li>Master the add → commit → push cycle<\/li><li>Work with branches<\/li><li>Publish a project on GitHub<\/li><\/ul>"}, {"type": "text", "title": "Why Git?", "html": "\n<p><b>Git<\/b> is a <b>version control<\/b> system. It records the history of your code as\n<b>commits<\/b> (\"snapshots\" of your project at a given moment).<\/p>\n<ul>\n<li>Go back in time if you break something.<\/li>\n<li>Work as a team without overwriting each other's work.<\/li>\n<li>Try an idea in a <b>branch<\/b> without touching the stable version.<\/li>\n<\/ul>\n<p><b>GitHub<\/b> is not Git: it is a <b>website<\/b> that hosts Git repositories online (and also offers GitHub Actions, which you'll see in week 13).<\/p>\n"}, {"type": "text", "title": "The 3 areas of Git", "html": "\n<div class=\"flow\"><span>📁 Working directory<br><small>your modified files<\/small><\/span><span class=\"arrow\">git add →<\/span><span>📋 Staging area<br><small>staging<\/small><\/span><span class=\"arrow\">git commit →<\/span><span>🗄️ Local repository<br><small>history<\/small><\/span><\/div>\n<div class=\"flow\"><span>🗄️ Local repository<\/span><span class=\"arrow\">git push →<\/span><span>☁️ GitHub<br><small>remote repository<\/small><\/span><\/div>\n"}, {"type": "code", "title": "The basic cycle", "lang": "bash", "code": "git config --global user.name \"Ton Nom\"\ngit config --global user.email \"toi@email.com\"\n\ngit init                     # transformer un dossier en dépôt Git\ngit status                   # voir ce qui a changé\ngit add Main.java            # préparer un fichier (ou: git add .)\ngit commit -m \"Ajoute la classe Main\"\ngit log --oneline            # voir l'historique\n\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main      # envoyer sur GitHub\ngit pull                     # récupérer les changements distants", "note": ""}, {"type": "code", "title": "Branches", "lang": "bash", "code": "git switch -c feature/alertes-stock   # créer une branche et y aller\n# ... modifier du code, add, commit ...\ngit switch main                       # revenir sur main\ngit merge feature/alertes-stock       # fusionner la branche\ngit branch -d feature/alertes-stock   # supprimer la branche fusionnée", "note": "Good practice: <b>one branch per feature<\/b>, and clear commit messages in the imperative: \"Add…\", \"Fix…\"."}, {"type": "code", "title": "The .gitignore file", "lang": "text", "code": "# Ne jamais versionner :\ntarget/          # fichiers compilés Java (Maven)\nnode_modules/    # dépendances JavaScript\n.env             # mots de passe et secrets !\n.idea/\n.DS_Store", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Which command sends your local commits to GitHub?", "options": ["git commit", "git add", "git push", "git pull"], "answer": 2, "explain": "<code>git commit<\/code> records locally, <code>git push<\/code> sends to the remote repository."}, {"type": "quiz", "title": "Quiz", "question": "What is a branch for?", "options": ["Deleting history", "Developing a feature without touching the main version", "Compiling the code", "Logging in to GitHub"], "answer": 1, "explain": "A branch is a parallel line of development. You merge it when the work is ready."}, {"type": "exercise", "title": "Exercise: your first repository", "task": "\n<ol><li>Create a <code>librastock<\/code> folder and initialise a Git repository.<\/li>\n<li>Create a <code>README.md<\/code> file with the project title and commit it.<\/li>\n<li>Create a <code>docs/description<\/code> branch, add a project description to the README, commit.<\/li>\n<li>Merge the branch into <code>main<\/code>, then publish the repository on GitHub.<\/li><\/ol>\n", "solution": "mkdir librastock && cd librastock\ngit init\necho \"# LibraStock\" > README.md\ngit add README.md\ngit commit -m \"Ajoute le README\"\ngit switch -c docs/description\necho \"Application de gestion de stock pour une librairie-papeterie.\" >> README.md\ngit commit -am \"Décrit le projet\"\ngit switch main\ngit merge docs/description\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main", "lang": "bash"}]}, {"title": "What is Java?", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand JDK, JVM and compilation<\/li><li>Write variables, conditions, loops and methods<\/li><li>Run a first Java program<\/li><\/ul>"}, {"type": "text", "title": "Java in one slide", "html": "\n<p><b>Java<\/b> is an <b>object-oriented<\/b>, <b>statically typed<\/b> language widely used in companies (banks, insurers, public administrations…). Spring Boot, the framework you'll use in week 5, is written in Java.<\/p>\n<div class=\"flow\"><span>📄 Main.java<br><small>source code<\/small><\/span><span class=\"arrow\">javac →<\/span><span>⚙️ Main.class<br><small>bytecode<\/small><\/span><span class=\"arrow\">java →<\/span><span>☕ JVM<br><small>runs everywhere<\/small><\/span><\/div>\n<ul>\n<li><b>JDK<\/b>: the development kit (compiler + tools). Install an LTS version: <b>Java 21<\/b>.<\/li>\n<li><b>JVM<\/b>: the virtual machine that runs the bytecode on Windows, Mac or Linux.<\/li>\n<li>Recommended <b>IDE<\/b>: IntelliJ IDEA Community (free) or VS Code + Java extension.<\/li>\n<\/ul>\n"}, {"type": "code", "title": "Variables and types", "lang": "java", "code": "public class Main {\n    public static void main(String[] args) {\n        String nom = \"Cahier A4\";      // texte\n        int stock = 140;               // nombre entier\n        double prix = 2.50;            // nombre décimal\n        boolean disponible = stock > 0; // vrai / faux\n\n        System.out.println(nom + \" coûte \" + prix + \" €\");\n        System.out.println(\"Disponible : \" + disponible);\n    }\n}", "note": ""}, {"type": "code", "title": "Conditions and loops", "lang": "java", "code": "int stock = 8;\nint seuilMinimum = 10;\n\nif (stock == 0) {\n    System.out.println(\"Rupture de stock !\");\n} else if (stock < seuilMinimum) {\n    System.out.println(\"Stock faible, commander bientôt.\");\n} else {\n    System.out.println(\"Stock OK\");\n}\n\n// Boucle for : afficher 5 étiquettes\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(\"Étiquette n°\" + i);\n}\n\n// Boucle while : vendre jusqu'à épuisement\nwhile (stock > 0) {\n    stock--;\n}", "note": ""}, {"type": "code", "title": "Methods", "lang": "java", "code": "public class Caisse {\n\n    // Une méthode reçoit des paramètres et renvoie un résultat\n    static double calculerTotal(double prixUnitaire, int quantite) {\n        return prixUnitaire * quantite;\n    }\n\n    static double appliquerRemise(double total, double pourcentage) {\n        return total - total * pourcentage / 100;\n    }\n\n    public static void main(String[] args) {\n        double total = calculerTotal(2.50, 12);\n        double aPayer = appliquerRemise(total, 10);\n        System.out.println(\"À payer : \" + aPayer + \" €\"); // 27.0 €\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "What does the JVM do?", "options": ["It compiles the source code", "It runs Java bytecode", "It hosts code on the Internet", "It manages the database"], "answer": 1, "explain": "<code>javac<\/code> compiles to bytecode, the <b>JVM<\/b> runs that bytecode on any system."}, {"type": "quiz", "title": "Quiz", "question": "Which type should store a price like 2.50?", "options": ["int", "boolean", "String", "double"], "answer": 3, "explain": "<code>double<\/code> stores decimal numbers. In production, <code>BigDecimal<\/code> is preferred for money to avoid rounding errors."}, {"type": "exercise", "title": "Exercise: restock calculator", "task": "\n<p>Write a method <code>quantiteACommander(int stock, int seuil, int stockCible)<\/code> that returns\nthe quantity to order: 0 if the stock is greater than or equal to the threshold, otherwise <code>stockCible - stock<\/code>.\nTest it with (8, 10, 50) and (25, 10, 50).<\/p>\n", "solution": "static int quantiteACommander(int stock, int seuil, int stockCible) {\n    if (stock >= seuil) {\n        return 0;\n    }\n    return stockCible - stock;\n}\n\n// quantiteACommander(8, 10, 50)  -> 42\n// quantiteACommander(25, 10, 50) -> 0", "lang": "java"}]}, {"title": "Object-oriented Java", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Create classes and objects<\/li><li>Use encapsulation (private + getters)<\/li><li>Work with lists using ArrayList<\/li><li>Deliver the module 1 program<\/li><\/ul>"}, {"type": "text", "title": "Class and object", "html": "\n<p>A <b>class<\/b> is a blueprint (the mould). An <b>object<\/b> is a concrete instance created from that blueprint.<\/p>\n<p>Class <code>Produit<\/code> → objects: \"Cahier A4\", \"Stylo bleu\", \"Le Petit Prince\"…<\/p>\n<p>The 4 ideas of object-oriented programming: <b>encapsulation<\/b> (protecting data), <b>inheritance<\/b>, <b>polymorphism<\/b>, <b>abstraction<\/b>.\nFor Spring Boot, encapsulation and interfaces matter most.<\/p>\n"}, {"type": "code", "title": "The Produit (product) class", "lang": "java", "code": "public class Produit {\n    private String nom;     // private = protégé, accessible seulement ici\n    private double prix;\n    private int stock;\n\n    public Produit(String nom, double prix, int stock) {  // constructeur\n        this.nom = nom;\n        this.prix = prix;\n        this.stock = stock;\n    }\n\n    public void vendre(int quantite) {\n        if (quantite > stock) {\n            throw new IllegalArgumentException(\"Stock insuffisant pour \" + nom);\n        }\n        stock -= quantite;\n    }\n\n    public void reapprovisionner(int quantite) { stock += quantite; }\n\n    public String getNom() { return nom; }\n    public double getPrix() { return prix; }\n    public int getStock() { return stock; }\n}", "note": ""}, {"type": "code", "title": "Lists of objects", "lang": "java", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Produit> catalogue = new ArrayList<>();\n        catalogue.add(new Produit(\"Cahier A4\", 2.50, 140));\n        catalogue.add(new Produit(\"Stylo bleu\", 0.80, 6));\n\n        catalogue.get(0).vendre(10);\n\n        for (Produit p : catalogue) {\n            if (p.getStock() < 10) {\n                System.out.println(\"⚠ Stock faible : \" + p.getNom());\n            }\n        }\n\n        // Version moderne avec les streams\n        catalogue.stream()\n                 .filter(p -> p.getStock() < 10)\n                 .forEach(p -> System.out.println(p.getNom()));\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Why declare attributes as private?", "options": ["To make the program faster", "To prevent the object's state from being changed arbitrarily", "Because Java requires it", "To hide them on GitHub"], "answer": 1, "explain": "This is <b>encapsulation<\/b>: changes go through methods (like <code>vendre()<\/code>) that enforce the rules, e.g. never selling more than the stock."}, {"type": "exercise", "title": "🎯 Module 1 deliverable", "task": "\n<p>Create a command-line Java program <b>LibraStock v0<\/b>:<\/p>\n<ul><li>a <code>Produit<\/code> class (name, price, stock, minimum level);<\/li>\n<li>an <code>Inventaire<\/code> class with a <code>List&lt;Produit&gt;<\/code> and the methods\n<code>ajouter<\/code> (add), <code>vendre(nom, quantite)<\/code> (sell), <code>produitsEnAlerte()<\/code> (products on alert), <code>valeurTotaleDuStock()<\/code> (total stock value);<\/li>\n<li>a <code>main<\/code> that demonstrates all the methods.<\/li><\/ul>\n<p>Publish it on GitHub with at least 5 clear commits.<\/p>\n", "solution": "public class Inventaire {\n    private final List<Produit> produits = new ArrayList<>();\n\n    public void ajouter(Produit p) { produits.add(p); }\n\n    public void vendre(String nom, int quantite) {\n        trouver(nom).vendre(quantite);\n    }\n\n    public List<Produit> produitsEnAlerte() {\n        return produits.stream()\n                .filter(p -> p.getStock() < p.getSeuilMinimum())\n                .toList();\n    }\n\n    public double valeurTotaleDuStock() {\n        return produits.stream()\n                .mapToDouble(p -> p.getPrix() * p.getStock())\n                .sum();\n    }\n\n    private Produit trouver(String nom) {\n        return produits.stream()\n                .filter(p -> p.getNom().equalsIgnoreCase(nom))\n                .findFirst()\n                .orElseThrow(() -> new IllegalArgumentException(\"Produit inconnu : \" + nom));\n    }\n}", "lang": "java"}]}]}, {"id": "m2", "weeks": "Weeks 3 & 4", "title": "Databases", "icon": "🗄️", "color": "#00D1FF", "summary": "Store data durably with SQL and MySQL.", "deliverable": "A <code>schema.sql<\/code> script and a <code>data.sql<\/code> script that create and fill the LibraStock database (categories, products, movements), plus a <code>requetes.sql<\/code> file with 10 useful queries.", "lessons": [{"title": "Relational databases", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand tables, rows and columns<\/li><li>Know primary keys and foreign keys<\/li><li>Model the LibraStock data<\/li><\/ul>"}, {"type": "text", "title": "Why a database?", "html": "\n<p>In module 1, products disappear when the program stops: they only live in memory.\nA <b>database<\/b> stores data <b>durably<\/b>, lets you search it quickly and share it between several users.<\/p>\n<p>A <b>relational<\/b> database (MySQL, PostgreSQL…) organises data in <b>tables<\/b> linked to each other. You query it with the <b>SQL<\/b> language.<\/p>\n<table class=\"tbl\"><tr><th>id<\/th><th>nom<\/th><th>prix<\/th><th>stock<\/th><th>categorie_id<\/th><\/tr>\n<tr><td>1<\/td><td>Cahier A4<\/td><td>2.50<\/td><td>140<\/td><td>2<\/td><\/tr>\n<tr><td>2<\/td><td>Le Petit Prince<\/td><td>7.90<\/td><td>12<\/td><td>1<\/td><\/tr><\/table>\n<p><small>A table = one type of object · a row = one record · a column = one attribute<\/small><\/p>\n"}, {"type": "text", "title": "Keys and relationships", "html": "\n<ul>\n<li><b>Primary key (PRIMARY KEY)<\/b>: unique identifier of each row, often an auto-incremented <code>id<\/code>.<\/li>\n<li><b>Foreign key (FOREIGN KEY)<\/b>: a column that points to the primary key of another table.<\/li>\n<\/ul>\n<p><b>Relationships in LibraStock:<\/b><\/p>\n<div class=\"flow\"><span>categorie<\/span><span class=\"arrow\">1 ── N<\/span><span>produit<\/span><span class=\"arrow\">1 ── N<\/span><span>mouvement_stock<\/span><\/div>\n<p>A category contains several products; a product has several movements (in / out).\nThis is what an <b>entity-relationship diagram<\/b> shows.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "What is a foreign key for?", "options": ["Encrypting data", "Linking a row to a row of another table", "Sorting results", "Speeding up the web server"], "answer": 1, "explain": "The foreign key <code>categorie_id<\/code> in <code>produit<\/code> indicates which category each product belongs to."}, {"type": "exercise", "title": "Exercise: draw your model", "task": "\n<p>On paper or with <a href=\"https://dbdiagram.io\" target=\"_blank\" rel=\"noopener\">dbdiagram.io<\/a>, draw the tables\n<code>categorie<\/code>, <code>produit<\/code>, <code>mouvement_stock<\/code> and <code>utilisateur<\/code> (user) with their columns, primary keys and foreign keys.<\/p>\n", "solution": "categorie(id PK, nom)\nproduit(id PK, nom, prix, stock, seuil_minimum, categorie_id FK -> categorie.id)\nmouvement_stock(id PK, produit_id FK -> produit.id, type ENTREE/SORTIE, quantite, date_mouvement)\nutilisateur(id PK, email UNIQUE, mot_de_passe_hash, role VENDEUR/ADMIN)", "lang": "text"}]}, {"title": "SQL: creating and handling data", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Create tables with CREATE TABLE<\/li><li>Do CRUD: INSERT, SELECT, UPDATE, DELETE<\/li><li>Filter and sort with WHERE and ORDER BY<\/li><\/ul>"}, {"type": "code", "title": "Creating the tables", "lang": "sql", "code": "CREATE DATABASE librastock;\nUSE librastock;\n\nCREATE TABLE categorie (\n    id  INT AUTO_INCREMENT PRIMARY KEY,\n    nom VARCHAR(100) NOT NULL UNIQUE\n);\n\nCREATE TABLE produit (\n    id            INT AUTO_INCREMENT PRIMARY KEY,\n    nom           VARCHAR(150) NOT NULL,\n    prix          DECIMAL(10,2) NOT NULL,\n    stock         INT NOT NULL DEFAULT 0,\n    seuil_minimum INT NOT NULL DEFAULT 5,\n    categorie_id  INT,\n    FOREIGN KEY (categorie_id) REFERENCES categorie(id)\n);", "note": ""}, {"type": "code", "title": "CRUD: Create, Read, Update, Delete", "lang": "sql", "code": "-- CREATE\nINSERT INTO categorie (nom) VALUES ('Livres'), ('Papeterie');\nINSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Cahier A4', 2.50, 140, 20, 2),\n       ('Stylo bleu', 0.80, 6, 30, 2),\n       ('Le Petit Prince', 7.90, 12, 5, 1);\n\n-- READ\nSELECT * FROM produit;\nSELECT nom, prix FROM produit WHERE prix < 5 ORDER BY prix DESC;\nSELECT nom FROM produit WHERE stock < seuil_minimum;   -- alertes !\n\n-- UPDATE (toujours avec un WHERE !)\nUPDATE produit SET stock = stock - 3 WHERE id = 1;\n\n-- DELETE (toujours avec un WHERE !)\nDELETE FROM produit WHERE id = 3;", "note": "⚠️ An <code>UPDATE<\/code> or <code>DELETE<\/code> without <code>WHERE<\/code> changes or deletes <b>every<\/b> row of the table."}, {"type": "quiz", "title": "Quiz", "question": "Which query shows the products whose stock is below the threshold?", "options": ["SELECT * FROM produit ORDER BY stock", "SELECT nom FROM produit WHERE stock < seuil_minimum", "UPDATE produit SET stock = 0", "DELETE FROM produit WHERE stock < 5"], "answer": 1, "explain": "<code>WHERE<\/code> filters rows according to a condition."}, {"type": "exercise", "title": "Exercise: CRUD queries", "task": "\n<ol><li>Add 3 products of your choice.<\/li>\n<li>Show all products of category 2 sorted by name.<\/li>\n<li>Increase the price of books (category 1) by 10%.<\/li>\n<li>Show the 3 most expensive products (hint: <code>LIMIT<\/code>).<\/li><\/ol>\n", "solution": "INSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Gomme', 0.50, 80, 20, 2), ('Règle 30 cm', 1.20, 40, 10, 2), ('L''Étranger', 6.50, 9, 5, 1);\n\nSELECT * FROM produit WHERE categorie_id = 2 ORDER BY nom;\n\nUPDATE produit SET prix = prix * 1.10 WHERE categorie_id = 1;\n\nSELECT nom, prix FROM produit ORDER BY prix DESC LIMIT 3;", "lang": "sql"}]}, {"title": "MySQL in practice: joins and aggregates", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Install and start MySQL<\/li><li>Combine tables with JOIN<\/li><li>Calculate with COUNT, SUM, GROUP BY<\/li><li>Deliver the module 2 scripts<\/li><\/ul>"}, {"type": "code", "title": "Start MySQL (with Docker, recommended)", "lang": "bash", "code": "docker run --name mysql-librastock \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  -e MYSQL_DATABASE=librastock \\\n  -p 3306:3306 -d mysql:8\n\n# Se connecter en ligne de commande\ndocker exec -it mysql-librastock mysql -u root -p", "note": "Without Docker: install MySQL Community Server + <b>MySQL Workbench<\/b> (graphical interface). DBeaver is also an excellent free tool for exploring the database."}, {"type": "code", "title": "JOIN: combining several tables", "lang": "sql", "code": "-- Nom du produit + nom de sa catégorie\nSELECT p.nom AS produit, c.nom AS categorie, p.stock\nFROM produit p\nJOIN categorie c ON p.categorie_id = c.id;\n\n-- LEFT JOIN : garde aussi les catégories sans produit\nSELECT c.nom, p.nom\nFROM categorie c\nLEFT JOIN produit p ON p.categorie_id = c.id;", "note": ""}, {"type": "code", "title": "Aggregates: counting and summing", "lang": "sql", "code": "-- Nombre de produits et valeur du stock par catégorie\nSELECT c.nom              AS categorie,\n       COUNT(p.id)        AS nb_produits,\n       SUM(p.prix * p.stock) AS valeur_stock\nFROM categorie c\nJOIN produit p ON p.categorie_id = c.id\nGROUP BY c.nom\nHAVING valeur_stock > 50\nORDER BY valeur_stock DESC;", "note": "<code>WHERE<\/code> filters rows <i>before<\/i> grouping, <code>HAVING<\/code> filters groups <i>after<\/i>."}, {"type": "quiz", "title": "Quiz", "question": "Which clause groups rows to compute a total per category?", "options": ["ORDER BY", "GROUP BY", "LIMIT", "JOIN"], "answer": 1, "explain": "<code>GROUP BY<\/code> creates one group per value; <code>SUM<\/code>, <code>COUNT<\/code>, <code>AVG<\/code> compute on each group."}, {"type": "exercise", "title": "🎯 Module 2 deliverable", "task": "\n<p>In your repository, create a <code>database/<\/code> folder with:<\/p>\n<ul><li><code>schema.sql<\/code>: the 4 tables (categorie, produit, mouvement_stock, utilisateur);<\/li>\n<li><code>data.sql<\/code>: at least 3 categories, 15 products and 20 movements;<\/li>\n<li><code>requetes.sql<\/code>: 10 commented queries (alerts, revenue per month, top 5 sales…).<\/li><\/ul>\n", "solution": "CREATE TABLE mouvement_stock (\n    id             INT AUTO_INCREMENT PRIMARY KEY,\n    produit_id     INT NOT NULL,\n    type           ENUM('ENTREE','SORTIE') NOT NULL,\n    quantite       INT NOT NULL CHECK (quantite > 0),\n    date_mouvement DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (produit_id) REFERENCES produit(id)\n);\n\n-- Top 5 des produits les plus vendus\nSELECT p.nom, SUM(m.quantite) AS total_vendu\nFROM mouvement_stock m\nJOIN produit p ON p.id = m.produit_id\nWHERE m.type = 'SORTIE'\nGROUP BY p.nom\nORDER BY total_vendu DESC\nLIMIT 5;", "lang": "sql"}]}]}, {"id": "m3", "weeks": "Weeks 5 to 8", "title": "Frameworks: Spring", "icon": "🌱", "color": "#6DB33F", "summary": "Build a professional REST API with Spring Boot, connected to MySQL and secured.", "deliverable": "A working Spring Boot REST API (product CRUD, stock movements, alerts) connected to MySQL, with validation, error handling, tests and JWT authentication.", "lessons": [{"title": "Introduction to Spring Boot", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand what a framework is<\/li><li>Understand dependency injection<\/li><li>Generate a project with Spring Initializr<\/li><\/ul>"}, {"type": "text", "title": "Why a framework?", "html": "\n<p>A <b>framework<\/b> is a ready-made structure: it handles the plumbing (web server, database connection, security…)\nso you can focus on the <b>business logic<\/b>.<\/p>\n<p><b>Spring<\/b> is the most widely used Java framework. <b>Spring Boot<\/b> makes it easy to start: auto-configuration and a built-in web server (Tomcat).<\/p>\n<p><b>Dependency injection<\/b>: instead of writing <code>new ProduitService()<\/code> everywhere, Spring creates the objects (the <b>beans<\/b>) and \"injects\" them wherever you need them.<\/p>\n"}, {"type": "text", "title": "Create the project", "html": "\n<ol class=\"steps\">\n<li>Go to <a href=\"https://start.spring.io\" target=\"_blank\" rel=\"noopener\">start.spring.io<\/a>.<\/li>\n<li>Project: <b>Maven<\/b> · Language: <b>Java<\/b> · Spring Boot: latest stable version · Java: <b>21<\/b>.<\/li>\n<li>Group: <code>com.librastock<\/code> · Artifact: <code>api<\/code>.<\/li>\n<li>Dependencies: <b>Spring Web<\/b>, <b>Spring Data JPA<\/b>, <b>MySQL Driver<\/b>, <b>Validation<\/b>, <b>Lombok<\/b> (optional).<\/li>\n<li>Click <b>Generate<\/b>, unzip, open in IntelliJ.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Project structure", "lang": "text", "code": "api/\n├── pom.xml                         ← dépendances Maven\n└── src/\n    ├── main/\n    │   ├── java/com/librastock/api/\n    │   │   ├── ApiApplication.java   ← point d'entrée\n    │   │   ├── controller/           ← reçoit les requêtes HTTP\n    │   │   ├── service/              ← logique métier\n    │   │   ├── repository/           ← accès à la base de données\n    │   │   ├── model/                ← entités (tables)\n    │   │   └── dto/                  ← objets échangés avec le client\n    │   └── resources/\n    │       └── application.properties\n    └── test/                         ← tests automatisés", "note": ""}, {"type": "code", "title": "Hello Spring", "lang": "java", "code": "@RestController\npublic class HelloController {\n\n    @GetMapping(\"/hello\")\n    public String hello() {\n        return \"LibraStock API est en ligne !\";\n    }\n}\n// Lance l'application puis ouvre http://localhost:8080/hello", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "What does dependency injection do?", "options": ["It injects SQL into the database", "Spring creates objects and provides them to the classes that need them", "It installs Maven dependencies", "It encrypts passwords"], "answer": 1, "explain": "Spring manages the lifecycle of <b>beans<\/b> (@Service, @Repository, @RestController…) and injects them via the constructor."}]}, {"title": "Building a REST API", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand REST principles<\/li><li>Create a CRUD controller<\/li><li>Use the right HTTP codes<\/li><li>Test with Postman or curl<\/li><\/ul>"}, {"type": "text", "title": "LibraStock routes", "html": "\n<table class=\"tbl\">\n<tr><th>Verb<\/th><th>URL<\/th><th>Action<\/th><th>Response<\/th><\/tr>\n<tr><td>GET<\/td><td>/api/produits<\/td><td>List<\/td><td>200<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/{id}<\/td><td>Detail<\/td><td>200 / 404<\/td><\/tr>\n<tr><td>POST<\/td><td>/api/produits<\/td><td>Create<\/td><td>201<\/td><\/tr>\n<tr><td>PUT<\/td><td>/api/produits/{id}<\/td><td>Update<\/td><td>200<\/td><\/tr>\n<tr><td>DELETE<\/td><td>/api/produits/{id}<\/td><td>Delete<\/td><td>204<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/alertes<\/td><td>Low stock<\/td><td>200<\/td><\/tr>\n<\/table>\n<p>REST: <b>resources<\/b> (plural nouns) + <b>HTTP verbs<\/b>. Data is exchanged as <b>JSON<\/b>.<\/p>\n"}, {"type": "code", "title": "The controller", "lang": "java", "code": "@RestController\n@RequestMapping(\"/api/produits\")\npublic class ProduitController {\n\n    private final ProduitService service;\n\n    public ProduitController(ProduitService service) { // injection par constructeur\n        this.service = service;\n    }\n\n    @GetMapping\n    public List<ProduitDto> lister() {\n        return service.lister();\n    }\n\n    @GetMapping(\"/{id}\")\n    public ProduitDto detail(@PathVariable Long id) {\n        return service.trouver(id);\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public ProduitDto creer(@Valid @RequestBody ProduitDto dto) {\n        return service.creer(dto);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void supprimer(@PathVariable Long id) {\n        service.supprimer(id);\n    }\n}", "note": ""}, {"type": "code", "title": "A DTO with validation", "lang": "java", "code": "public record ProduitDto(\n        Long id,\n        @NotBlank String nom,\n        @NotNull @Positive BigDecimal prix,\n        @PositiveOrZero int stock,\n        @PositiveOrZero int seuilMinimum,\n        Long categorieId\n) {}", "note": "A <b>DTO<\/b> (Data Transfer Object) defines what the API receives and returns. Database entities are not exposed directly."}, {"type": "code", "title": "Testing the API", "lang": "bash", "code": "curl http://localhost:8080/api/produits\n\ncurl -X POST http://localhost:8080/api/produits \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"nom\":\"Classeur\",\"prix\":3.20,\"stock\":25,\"seuilMinimum\":5,\"categorieId\":2}'", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Which HTTP code should be returned after successfully creating a product?", "options": ["200 OK", "201 Created", "204 No Content", "404 Not Found"], "answer": 1, "explain": "<b>201 Created<\/b> indicates that a new resource was created."}]}, {"title": "Spring Data JPA and MySQL", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Configure the MySQL connection<\/li><li>Turn a class into a table with @Entity<\/li><li>Use a repository without writing SQL<\/li><li>Handle relationships between entities<\/li><\/ul>"}, {"type": "code", "title": "application.properties", "lang": "properties", "code": "spring.datasource.url=jdbc:mysql://localhost:3306/librastock\nspring.datasource.username=root\nspring.datasource.password=${DB_PASSWORD}\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true", "note": "Never put a real password in the code: use an environment variable (<code>${DB_PASSWORD}<\/code>)."}, {"type": "code", "title": "A JPA entity", "lang": "java", "code": "@Entity\n@Table(name = \"produit\")\npublic class Produit {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false)\n    private String nom;\n\n    private BigDecimal prix;\n    private int stock;\n    private int seuilMinimum;\n\n    @ManyToOne\n    @JoinColumn(name = \"categorie_id\")\n    private Categorie categorie;\n\n    // constructeurs, getters, setters...\n}", "note": ""}, {"type": "code", "title": "A repository", "lang": "java", "code": "public interface ProduitRepository extends JpaRepository<Produit, Long> {\n\n    // Spring génère le SQL à partir du nom de la méthode !\n    List<Produit> findByCategorieNom(String nom);\n\n    List<Produit> findByNomContainingIgnoreCase(String texte);\n\n    @Query(\"SELECT p FROM Produit p WHERE p.stock < p.seuilMinimum\")\n    List<Produit> findEnAlerte();\n}", "note": "<code>JpaRepository<\/code> already provides <code>findAll()<\/code>, <code>findById()<\/code>, <code>save()<\/code>, <code>deleteById()<\/code>…"}, {"type": "code", "title": "The service: business logic", "lang": "java", "code": "@Service\npublic class StockService {\n\n    private final ProduitRepository produits;\n    private final MouvementRepository mouvements;\n\n    public StockService(ProduitRepository produits, MouvementRepository mouvements) {\n        this.produits = produits;\n        this.mouvements = mouvements;\n    }\n\n    @Transactional\n    public void vendre(Long produitId, int quantite) {\n        Produit p = produits.findById(produitId)\n                .orElseThrow(() -> new RessourceIntrouvableException(\"Produit \" + produitId));\n        if (p.getStock() < quantite) {\n            throw new StockInsuffisantException(p.getNom());\n        }\n        p.setStock(p.getStock() - quantite);\n        mouvements.save(new MouvementStock(p, TypeMouvement.SORTIE, quantite));\n    }\n}", "note": "<code>@Transactional<\/code>: either everything succeeds (stock updated + movement saved), or nothing is saved."}, {"type": "quiz", "title": "Quiz", "question": "What does spring.jpa.hibernate.ddl-auto=update do?", "options": ["It deletes the database on every start", "It updates the table schema to match the entities", "It updates Spring Boot", "It backs up the database"], "answer": 1, "explain": "Handy in development. In production, versioned migrations with <b>Flyway<\/b> or <b>Liquibase<\/b> are preferred."}]}, {"title": "Quality: errors, tests and security", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Return clean errors<\/li><li>Write tests with JUnit and MockMvc<\/li><li>Understand JWT authentication and roles<\/li><li>Deliver the module 3 API<\/li><\/ul>"}, {"type": "code", "title": "Global error handling", "lang": "java", "code": "@RestControllerAdvice\npublic class GestionErreurs {\n\n    @ExceptionHandler(RessourceIntrouvableException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public Map<String, String> introuvable(RessourceIntrouvableException e) {\n        return Map.of(\"erreur\", e.getMessage());\n    }\n\n    @ExceptionHandler(StockInsuffisantException.class)\n    @ResponseStatus(HttpStatus.CONFLICT)\n    public Map<String, String> stock(StockInsuffisantException e) {\n        return Map.of(\"erreur\", \"Stock insuffisant : \" + e.getMessage());\n    }\n}", "note": ""}, {"type": "code", "title": "An integration test", "lang": "java", "code": "@SpringBootTest\n@AutoConfigureMockMvc\nclass ProduitControllerTest {\n\n    @Autowired MockMvc mvc;\n\n    @Test\n    void produitInexistantRenvoie404() throws Exception {\n        mvc.perform(get(\"/api/produits/9999\"))\n           .andExpect(status().isNotFound());\n    }\n\n    @Test\n    void creationSansNomRenvoie400() throws Exception {\n        mvc.perform(post(\"/api/produits\")\n                .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"prix\\\": 2.5}\"))\n           .andExpect(status().isBadRequest());\n    }\n}", "note": "Run the tests with <code>./mvnw test<\/code>. In week 13, GitHub Actions will run them automatically on every push."}, {"type": "text", "title": "Security: JWT and roles", "html": "\n<ol class=\"steps\">\n<li>The user sends email + password to <code>POST /api/auth/login<\/code>.<\/li>\n<li>The server checks the password (stored <b>hashed<\/b> with BCrypt, never in plain text).<\/li>\n<li>It returns a signed <b>JWT token<\/b> containing the identifier and the role.<\/li>\n<li>The client sends this token with every request: <code>Authorization: Bearer &lt;token&gt;<\/code>.<\/li>\n<li><b>Spring Security<\/b> checks the token and permissions: a <code>VENDEUR<\/code> (seller) can sell, only an <code>ADMIN<\/code> can delete a product.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Access rules with Spring Security", "lang": "java", "code": "@Bean\nSecurityFilterChain securite(HttpSecurity http, JwtFilter jwtFilter) throws Exception {\n    return http\n        .csrf(csrf -> csrf.disable())\n        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n        .authorizeHttpRequests(auth -> auth\n            .requestMatchers(\"/api/auth/**\").permitAll()\n            .requestMatchers(HttpMethod.DELETE, \"/api/**\").hasRole(\"ADMIN\")\n            .anyRequest().authenticated())\n        .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)\n        .build();\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "How should passwords be stored?", "options": ["In plain text in the database", "Encrypted with a key in the code", "Hashed with an algorithm like BCrypt", "In the JWT token"], "answer": 2, "explain": "A hash is irreversible: even if the database leaks, passwords are not directly readable."}, {"type": "exercise", "title": "🎯 Module 3 deliverable", "task": "\n<p>A Spring Boot API <code>librastock-api<\/code> with:<\/p>\n<ul><li>full CRUD for <b>products<\/b> and <b>categories<\/b>;<\/li>\n<li><code>POST /api/stock/entree<\/code> and <code>POST /api/stock/sortie<\/code> (with a recorded movement);<\/li>\n<li><code>GET /api/produits/alertes<\/code>;<\/li>\n<li>validation + clean JSON errors (400, 404, 409);<\/li>\n<li>at least 8 passing tests;<\/li>\n<li>JWT login with VENDEUR / ADMIN roles;<\/li>\n<li>a README explaining how to run the project.<\/li><\/ul>\n", "solution": "Self-assessment checklist:\n[ ] ./mvnw test → BUILD SUCCESS\n[ ] All routes tested in Postman (collection exported to the repo)\n[ ] No password or secret in the code (environment variables)\n[ ] A VENDEUR gets 403 on DELETE /api/produits/{id}\n[ ] Selling more than the stock returns 409 and changes nothing", "lang": "text"}]}]}, {"id": "m4", "weeks": "Weeks 9 to 12", "title": "The front end", "icon": "🎨", "color": "#61DAFB", "summary": "Build the interface users see: HTML, CSS, then React connected to your API.", "deliverable": "A LibraStock React app: login, product list with search, add form, recording a sale and an alerts dashboard, connected to your Spring API.", "lessons": [{"title": "HTML: the structure", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand the role of HTML<\/li><li>Use semantic tags<\/li><li>Create tables and forms<\/li><\/ul>"}, {"type": "text", "title": "The web trio", "html": "\n<ul>\n<li><b>HTML<\/b>: the <b>structure<\/b> and content (headings, text, forms…).<\/li>\n<li><b>CSS<\/b>: the <b>presentation<\/b> (colours, layout, responsive design).<\/li>\n<li><b>JavaScript<\/b>: the <b>behaviour<\/b> (clicks, API calls…). React is a JavaScript library.<\/li>\n<\/ul>\n<p>An HTML document is a tree of <b>tags<\/b>: <code>&lt;tag attribute=\"value\"&gt;content&lt;/tag&gt;<\/code>.<\/p>\n"}, {"type": "code", "title": "A semantic page", "lang": "html", "code": "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>LibraStock<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <header>\n    <h1>LibraStock<\/h1>\n    <nav><a href=\"#produits\">Produits<\/a> <a href=\"#alertes\">Alertes<\/a><\/nav>\n  <\/header>\n  <main>\n    <section id=\"produits\">\n      <h2>Produits<\/h2>\n      <table>\n        <thead><tr><th>Nom<\/th><th>Prix<\/th><th>Stock<\/th><\/tr><\/thead>\n        <tbody><tr><td>Cahier A4<\/td><td>2,50 €<\/td><td>140<\/td><\/tr><\/tbody>\n      <\/table>\n    <\/section>\n  <\/main>\n  <footer>© 2026 LibraStock<\/footer>\n<\/body>\n<\/html>", "note": ""}, {"type": "code", "title": "A form", "lang": "html", "code": "<form>\n  <label for=\"nom\">Nom du produit<\/label>\n  <input id=\"nom\" name=\"nom\" type=\"text\" required>\n\n  <label for=\"prix\">Prix (€)<\/label>\n  <input id=\"prix\" name=\"prix\" type=\"number\" step=\"0.01\" min=\"0\" required>\n\n  <label for=\"categorie\">Catégorie<\/label>\n  <select id=\"categorie\" name=\"categorie\">\n    <option value=\"1\">Livres<\/option>\n    <option value=\"2\">Papeterie<\/option>\n  <\/select>\n\n  <button type=\"submit\">Ajouter<\/button>\n<\/form>", "note": "Always associate a <code>&lt;label&gt;<\/code> with each field: it is essential for accessibility."}, {"type": "quiz", "title": "Quiz", "question": "Which tag should hold the main content of a page?", "options": ["<div>", "<main>", "<span>", "<b>"], "answer": 1, "explain": "<code>&lt;main&gt;<\/code> is a <b>semantic<\/b> tag: it gives meaning to the structure (useful for accessibility and SEO)."}]}, {"title": "CSS: styling", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Target elements with selectors<\/li><li>Understand the box model<\/li><li>Lay out with Flexbox and Grid<\/li><li>Make a page responsive<\/li><\/ul>"}, {"type": "code", "title": "Selectors and box model", "lang": "css", "code": "/* sélecteur de balise, de classe, d'id */\nbody { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; }\n.carte { background: white; border-radius: 12px; }\n#alertes { border-left: 4px solid crimson; }\n\n/* Modèle de boîte : contenu + padding + border + margin */\n.carte {\n  padding: 16px;          /* espace intérieur */\n  border: 1px solid #ddd; /* bordure */\n  margin: 8px;            /* espace extérieur */\n  box-sizing: border-box; /* width inclut padding et border */\n}", "note": ""}, {"type": "code", "title": "Flexbox and Grid", "lang": "css", "code": "/* Flexbox : aligner sur une ligne */\nheader {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 12px 24px;\n}\n\n/* Grid : une grille de cartes produits */\n.grille-produits {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 16px;\n}", "note": ""}, {"type": "code", "title": "Responsive", "lang": "css", "code": "/* Mobile d'abord, puis on adapte aux grands écrans */\nnav a { display: block; }\n\n@media (min-width: 768px) {\n  nav a { display: inline-block; margin-left: 16px; }\n}", "note": "Test your design in the browser developer tools (mobile device mode)."}, {"type": "quiz", "title": "Quiz", "question": "Which property turns a container into a grid?", "options": ["display: flex", "display: grid", "position: absolute", "float: left"], "answer": 1, "explain": "<code>display: grid<\/code> + <code>grid-template-columns<\/code> define the columns."}, {"type": "exercise", "title": "Exercise: the catalogue page", "task": "\n<p>Create an HTML + CSS page that displays 6 products as cards (name, category, price, stock).\nCards with low stock get a red border (class <code>.alerte<\/code>). On mobile: 1 column; on desktop: 3 columns.<\/p>\n", "solution": ".grille { display: grid; grid-template-columns: 1fr; gap: 16px; }\n@media (min-width: 900px) { .grille { grid-template-columns: repeat(3, 1fr); } }\n.carte { padding: 16px; border: 1px solid #ddd; border-radius: 12px; }\n.carte.alerte { border: 2px solid crimson; }", "lang": "css"}]}, {"title": "React: the basics", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Create a React project with Vite<\/li><li>Write components and use JSX<\/li><li>Pass data with props<\/li><li>Manage state with useState<\/li><\/ul>"}, {"type": "code", "title": "Create the project", "lang": "bash", "code": "npm create vite@latest librastock-web -- --template react\ncd librastock-web\nnpm install\nnpm run dev        # ouvre http://localhost:5173", "note": "Prerequisite: <b>Node.js LTS<\/b> installed. Vite is today's recommended starter tool."}, {"type": "text", "title": "Components and JSX", "html": "\n<p>With React, the interface is split into <b>components<\/b>: functions that return <b>JSX<\/b> (HTML inside JavaScript).<\/p>\n<div class=\"flow\"><span>App<\/span><span class=\"arrow\">→<\/span><span>BarreRecherche<\/span><span class=\"arrow\">+<\/span><span>ListeProduits<\/span><span class=\"arrow\">→<\/span><span>CarteProduit ×N<\/span><\/div>\n<p>Data flows down from parent to child via <b>props<\/b>. Each component can have its own <b>state<\/b> (<code>useState<\/code>): when the state changes, React updates the display automatically.<\/p>\n"}, {"type": "code", "title": "Props and lists", "lang": "jsx", "code": "function CarteProduit({ produit }) {\n  const enAlerte = produit.stock < produit.seuilMinimum;\n  return (\n    <div className={enAlerte ? \"carte alerte\" : \"carte\"}>\n      <h3>{produit.nom}<\/h3>\n      <p>{produit.prix.toFixed(2)} € · stock : {produit.stock}<\/p>\n      {enAlerte && <strong>⚠ À commander<\/strong>}\n    <\/div>\n  );\n}\n\nfunction ListeProduits({ produits }) {\n  return (\n    <div className=\"grille\">\n      {produits.map(p => <CarteProduit key={p.id} produit={p} />)}\n    <\/div>\n  );\n}", "note": ""}, {"type": "code", "title": "State with useState", "lang": "jsx", "code": "import { useState } from \"react\";\n\nfunction Recherche({ produits }) {\n  const [texte, setTexte] = useState(\"\");\n\n  const filtres = produits.filter(p =>\n    p.nom.toLowerCase().includes(texte.toLowerCase())\n  );\n\n  return (\n    <>\n      <input\n        placeholder=\"Rechercher un produit…\"\n        value={texte}\n        onChange={e => setTexte(e.target.value)}\n      />\n      <ListeProduits produits={filtres} />\n    <\/>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "What happens when you call setTexte(...)?", "options": ["Nothing, you must reload the page", "React updates the state and re-renders the component", "The value is sent to the server", "The component is removed"], "answer": 1, "explain": "Changing state triggers a new render of the component."}]}, {"title": "React connected to the API", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Load data with useEffect and fetch<\/li><li>Send a form to the API<\/li><li>Navigate between pages with React Router<\/li><li>Deliver the module 4 front end<\/li><\/ul>"}, {"type": "code", "title": "Loading the products", "lang": "jsx", "code": "import { useEffect, useState } from \"react\";\n\nconst API = import.meta.env.VITE_API_URL; // ex. http://localhost:8080\n\nexport default function PageProduits() {\n  const [produits, setProduits] = useState([]);\n  const [chargement, setChargement] = useState(true);\n  const [erreur, setErreur] = useState(null);\n\n  useEffect(() => {\n    fetch(`${API}/api/produits`, {\n      headers: { Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n    })\n      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })\n      .then(setProduits)\n      .catch(e => setErreur(e.message))\n      .finally(() => setChargement(false));\n  }, []); // [] = une seule fois, au premier affichage\n\n  if (chargement) return <p>Chargement…<\/p>;\n  if (erreur) return <p>Erreur : {erreur}<\/p>;\n  return <ListeProduits produits={produits} />;\n}", "note": ""}, {"type": "code", "title": "Submitting a form", "lang": "jsx", "code": "function FormulaireVente({ produitId, onSucces }) {\n  const [quantite, setQuantite] = useState(1);\n\n  async function envoyer(e) {\n    e.preventDefault();\n    const r = await fetch(`${API}/api/stock/sortie`, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\",\n                 Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n      body: JSON.stringify({ produitId, quantite }),\n    });\n    if (r.status === 409) return alert(\"Stock insuffisant\");\n    onSucces();\n  }\n\n  return (\n    <form onSubmit={envoyer}>\n      <input type=\"number\" min=\"1\" value={quantite}\n             onChange={e => setQuantite(Number(e.target.value))} />\n      <button>Enregistrer la vente<\/button>\n    <\/form>\n  );\n}", "note": "On the Spring side, allow the front-end origin (CORS): <code>@CrossOrigin(\"http://localhost:5173\")<\/code> or a global configuration."}, {"type": "code", "title": "Several pages with React Router", "lang": "jsx", "code": "// npm install react-router-dom\nimport { BrowserRouter, Routes, Route, Link } from \"react-router-dom\";\n\nexport default function App() {\n  return (\n    <BrowserRouter>\n      <nav>\n        <Link to=\"/\">Produits<\/Link> · <Link to=\"/alertes\">Alertes<\/Link>\n      <\/nav>\n      <Routes>\n        <Route path=\"/\" element={<PageProduits />} />\n        <Route path=\"/alertes\" element={<PageAlertes />} />\n        <Route path=\"/login\" element={<PageLogin />} />\n      <\/Routes>\n    <\/BrowserRouter>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Why pass [] as the second argument of useEffect?", "options": ["To never run the effect", "To run the effect only once on first render", "To clear the state", "To cancel fetch"], "answer": 1, "explain": "An empty dependency array means: run the effect after the first render only."}, {"type": "exercise", "title": "🎯 Module 4 deliverable", "task": "\n<p>The <code>librastock-web<\/code> app must have:<\/p>\n<ul><li>a <b>Login<\/b> page that stores the JWT token;<\/li>\n<li>a <b>Products<\/b> page with search and add (ADMIN);<\/li>\n<li>recording a <b>sale<\/b> and a stock <b>delivery<\/b>;<\/li>\n<li>an <b>Alerts<\/b> page;<\/li>\n<li>a clean display on mobile;<\/li>\n<li>loading and error handling.<\/li><\/ul>\n", "solution": "Self-assessment checklist:\n[ ] npm run build runs without errors\n[ ] The API URL comes from an environment variable (VITE_API_URL)\n[ ] A logged-out user is redirected to /login\n[ ] After a sale, the list updates without reloading the page\n[ ] Tested on a phone screen", "lang": "text"}]}]}, {"id": "m5", "weeks": "Weeks 13 to 16", "title": "Automation", "icon": "⚙️", "color": "#2088FF", "summary": "Automate tests, builds and deployment with GitHub Actions, then deliver the final project.", "deliverable": "A GitHub Actions pipeline that tests and builds the API and the front end on every push, an application deployed online and a polished portfolio repository (README, screenshots, architecture diagram).", "lessons": [{"title": "CI/CD and GitHub Actions", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Understand continuous integration and deployment<\/li><li>Know the vocabulary: workflow, job, step, runner<\/li><li>Write a first workflow<\/li><\/ul>"}, {"type": "text", "title": "Why automate?", "html": "\n<ul>\n<li><b>CI – Continuous Integration<\/b>: on every <code>push<\/code> or <i>pull request<\/i>, the code is automatically compiled and tested. A bug is caught within minutes, not in production.<\/li>\n<li><b>CD – Continuous Deployment<\/b>: if everything is green, the application is automatically built and released.<\/li>\n<\/ul>\n<div class=\"flow\"><span>git push<\/span><span class=\"arrow\">→<\/span><span>✅ Tests<\/span><span class=\"arrow\">→<\/span><span>📦 Build<\/span><span class=\"arrow\">→<\/span><span>🚀 Deploy<\/span><\/div>\n"}, {"type": "text", "title": "GitHub Actions vocabulary", "html": "\n<table class=\"tbl\">\n<tr><th>Term<\/th><th>Meaning<\/th><\/tr>\n<tr><td><b>Workflow<\/b><\/td><td>A YAML file in <code>.github/workflows/<\/code><\/td><\/tr>\n<tr><td><b>Event<\/b> (<code>on<\/code>)<\/td><td>What triggers the workflow: push, pull_request, schedule…<\/td><\/tr>\n<tr><td><b>Job<\/b><\/td><td>A group of steps run on one machine<\/td><\/tr>\n<tr><td><b>Runner<\/b><\/td><td>The virtual machine (e.g. <code>ubuntu-latest<\/code>)<\/td><\/tr>\n<tr><td><b>Step<\/b><\/td><td>A command (<code>run<\/code>) or a reusable action (<code>uses<\/code>)<\/td><\/tr>\n<\/table>\n"}, {"type": "code", "title": ".github/workflows/hello.yml", "lang": "yaml", "code": "name: Hello CI\n\non:\n  push:\n    branches: [main]\n\njobs:\n  bonjour:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Dire bonjour\n        run: echo \"Bonjour depuis GitHub Actions 👋\"\n      - name: Lister les fichiers\n        run: ls -la", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Where must a GitHub Actions workflow file be located?", "options": [".github/workflows/", "src/main/resources/", "workflows/ at the root", "node_modules/"], "answer": 0, "explain": "GitHub automatically detects YAML files placed in <code>.github/workflows/<\/code>."}]}, {"title": "A pipeline for Java and React", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Test and build the Spring API automatically<\/li><li>Build the React front end automatically<\/li><li>Use a MySQL database in CI<\/li><li>Manage secrets<\/li><\/ul>"}, {"type": "code", "title": ".github/workflows/ci.yml", "lang": "yaml", "code": "name: CI LibraStock\n\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  api:\n    runs-on: ubuntu-latest\n    services:\n      mysql:\n        image: mysql:8\n        env:\n          MYSQL_ROOT_PASSWORD: test\n          MYSQL_DATABASE: librastock\n        ports: [\"3306:3306\"]\n        options: --health-cmd=\"mysqladmin ping\" --health-interval=10s --health-retries=5\n    defaults:\n      run:\n        working-directory: api\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: \"21\"\n          cache: maven\n      - name: Tests et build\n        run: ./mvnw -B verify\n        env:\n          DB_PASSWORD: test\n\n  web:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: web\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: web/package-lock.json\n      - run: npm ci\n      - run: npm run build", "note": ""}, {"type": "text", "title": "Secrets", "html": "\n<p>A password, a JWT signing key or a deployment token must <b>never<\/b> be written in the code.<\/p>\n<ol class=\"steps\">\n<li>On GitHub: <b>Settings → Secrets and variables → Actions → New repository secret<\/b>.<\/li>\n<li>Create e.g. <code>JWT_SECRET<\/code> or <code>DEPLOY_TOKEN<\/code>.<\/li>\n<li>Use it in a workflow: <code>${{ secrets.JWT_SECRET }}<\/code>. GitHub masks it in the logs.<\/li>\n<\/ol>\n<p>Bonus: enable <b>branch protection on main<\/b> to block merging while CI is not green.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "How do you use a secret named DEPLOY_TOKEN in a workflow?", "options": ["$DEPLOY_TOKEN", "${{ secrets.DEPLOY_TOKEN }}", "{{ DEPLOY_TOKEN }}", "process.env.DEPLOY_TOKEN"], "answer": 1, "explain": "The GitHub Actions expression syntax is <code>${{ ... }}<\/code>, and secrets live in the <code>secrets<\/code> context."}, {"type": "exercise", "title": "Exercise: break the CI on purpose", "task": "\n<ol><li>Add the <code>ci.yml<\/code> workflow to your project and push to main: check that everything is green in the <b>Actions<\/b> tab.<\/li>\n<li>Create a branch, change a test so it fails, open a <i>pull request<\/i>.<\/li>\n<li>Look at the red ❌ on the PR, read the logs to find the failing test.<\/li>\n<li>Fix it, push again, see the ✅.<\/li><\/ol>\n", "solution": "What to remember:\n- Every push to the PR re-runs CI automatically.\n- The logs of the \"Tests et build\" step show the name of the failing test and the line.\n- With branch protection, the \"Merge\" button stays blocked while CI is red.", "lang": "text"}]}, {"title": "Deployment and final project", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Containerise the application with Docker<\/li><li>Deploy automatically<\/li><li>Prepare your portfolio and CV<\/li><li>Deliver the final project<\/li><\/ul>"}, {"type": "code", "title": "API Dockerfile", "lang": "dockerfile", "code": "# Étape 1 : construire le .jar\nFROM maven:3.9-eclipse-temurin-21 AS build\nWORKDIR /app\nCOPY . .\nRUN mvn -B package -DskipTests\n\n# Étape 2 : image légère pour l'exécution\nFROM eclipse-temurin:21-jre\nWORKDIR /app\nCOPY --from=build /app/target/*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]", "note": ""}, {"type": "code", "title": "docker-compose.yml: start everything with one command", "lang": "yaml", "code": "services:\n  db:\n    image: mysql:8\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: librastock\n    volumes: [db-data:/var/lib/mysql]\n  api:\n    build: ./api\n    environment:\n      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/librastock\n      DB_PASSWORD: ${DB_PASSWORD}\n      JWT_SECRET: ${JWT_SECRET}\n    ports: [\"8080:8080\"]\n    depends_on: [db]\nvolumes:\n  db-data:", "note": "<code>docker compose up -d<\/code> starts the database and the API. The built React front end (<code>npm run build<\/code>) can be served by <b>Nginx<\/b> or hosted on a static hosting service."}, {"type": "text", "title": "Where to deploy?", "html": "\n<table class=\"tbl\">\n<tr><th>Part<\/th><th>Simple options to start with<\/th><\/tr>\n<tr><td>React front end<\/td><td>GitHub Pages, Netlify, Vercel<\/td><\/tr>\n<tr><td>Spring API (Docker)<\/td><td>Render, Railway, Fly.io, or a small VPS with Nginx<\/td><\/tr>\n<tr><td>MySQL<\/td><td>Managed database from the same host, or a container on the VPS<\/td><\/tr>\n<\/table>\n<p>Free tiers change often: check the current terms before choosing.\nMost of these services can deploy automatically on every push to <code>main<\/code>, or via a deployment step in your workflow.<\/p>\n"}, {"type": "text", "title": "Your portfolio", "html": "\n<p>A recruiter spends about one minute on your repository. Make it count:<\/p>\n<ul>\n<li><b>README<\/b>: one sentence explaining the project, a screenshot, the link to the live demo.<\/li>\n<li><b>Architecture diagram<\/b>: React → Spring API → MySQL, with the CI/CD pipeline.<\/li>\n<li><b>Tech stack<\/b> and <b>how to run the project<\/b> in 3 commands.<\/li>\n<li>A green <b>CI badge<\/b> at the top of the README.<\/li>\n<li>On your CV: \"Built a fullstack application (Java 21, Spring Boot, MySQL, React, Docker, GitHub Actions)\" + link.<\/li>\n<\/ul>\n"}, {"type": "quiz", "title": "Quiz", "question": "What is the benefit of a two-stage (multi-stage) Dockerfile?", "options": ["Compiling twice to be safe", "Getting a lighter final image without the build tools", "Running two applications", "Replacing GitHub Actions"], "answer": 1, "explain": "The first stage contains Maven to compile, the second only the JRE and the .jar: the image is smaller and safer."}, {"type": "exercise", "title": "🏁 Final project", "task": "\n<p>Your <code>librastock<\/code> repository contains:<\/p>\n<ul><li><code>api/<\/code> (Spring Boot), <code>web/<\/code> (React), <code>database/<\/code> (SQL scripts);<\/li>\n<li><code>docker-compose.yml<\/code> to run everything locally;<\/li>\n<li>a green CI pipeline (tests + build) and an online deployment;<\/li>\n<li>a portfolio README with screenshot, diagram and demo link.<\/li><\/ul>\n<p>Present your project in 3 minutes as in a job interview: the problem, your solution, the stack, one difficulty you met and how you solved it.<\/p>\n", "solution": "Final checklist:\n[ ] git clone + docker compose up → the application works\n[ ] Green CI badge in the README\n[ ] Live demo accessible\n[ ] No secret in the Git history\n[ ] You can explain each layer: React → REST/JSON → Spring → JPA → MySQL\n[ ] You can explain the pipeline: push → tests → build → deploy", "lang": "text"}]}]}], "project": "\n<p>Throughout the bootcamp you build <b>one single application<\/b>, end to end:\n<b>LibraStock<\/b>, a stock management app for a bookshop and stationery store.<\/p>\n<ul>\n<li><b>Products<\/b>: books, notebooks, pens… with price, stock quantity and category.<\/li>\n<li><b>Stock movements<\/b>: incoming (supplier delivery) and outgoing (sale).<\/li>\n<li><b>Alerts<\/b>: list of products below their minimum level.<\/li>\n<li><b>Users<\/b>: <code>VENDEUR<\/code> (seller) role and <code>ADMIN<\/code> role.<\/li>\n<\/ul>\n<p>Each module adds a building block: the database, then the Java/Spring API, then the React interface,\nthen the automated pipeline. At the end you have a real project to show in your portfolio.<\/p>\n<p><small>Note: code examples keep French names (e.g. <code>Produit<\/code> = product, <code>vendre<\/code> = sell) so the code is identical in all three languages.<\/small><\/p>\n"}, "de": {"modules": [{"id": "m1", "weeks": "Woche 1 & 2", "title": "Grundlagen der Informatik", "icon": "🖥️", "color": "#7CFC00", "summary": "Verstehen, was hinter einer Webanwendung passiert: der Server, Git und die Programmiersprache Java.", "deliverable": "Ein öffentliches GitHub-Repository mit einem kleinen Java-Kommandozeilenprogramm (Produktliste im Arbeitsspeicher) und mindestens 5 sauberen Commits.", "lessons": [{"title": "Wie ein Server funktioniert", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Das Client-Server-Modell erklären<\/li><li>HTTP-Anfrage und -Antwort verstehen<\/li><li>Die Rolle von DNS, IP-Adressen und Ports kennen<\/li><li>Die wichtigsten Terminal-Befehle nutzen<\/li><\/ul>"}, {"type": "text", "title": "Client und Server", "html": "\n<p>Wenn du eine Website öffnest, unterhalten sich zwei Programme:<\/p>\n<div class=\"flow\"><span>🧑‍💻 Client<br><small>Browser, Handy-App<\/small><\/span><span class=\"arrow\">→ Anfrage →<\/span><span>🖥️ Server<br><small>Programm, das wartet<\/small><\/span><\/div>\n<div class=\"flow\"><span>🧑‍💻 Client<\/span><span class=\"arrow\">← Antwort ←<\/span><span>🖥️ Server<\/span><\/div>\n<p>Ein <b>Server<\/b> ist nicht unbedingt eine besondere Maschine: Er ist zuerst ein <b>Programm<\/b>, das auf einem <b>Port<\/b>\nauf Anfragen wartet und Antworten zurückschickt. Dieses Programm läuft auf einem Computer (physisch oder in der Cloud).<\/p>\n<p>In unserem Projekt: Der Browser zeigt die <b>React<\/b>-Oberfläche (Client), die die <b>Spring-Boot<\/b>-API (Server) aufruft, die in <b>MySQL<\/b> (Datenbankserver) liest und schreibt.<\/p>\n"}, {"type": "text", "title": "Die Reise einer Anfrage", "html": "\n<ol class=\"steps\">\n<li><b>Du tippst<\/b> <code>https://librastock.com/produits<\/code> ein.<\/li>\n<li><b>DNS<\/b>: Das Telefonbuch des Internets übersetzt <code>librastock.com<\/code> in eine <b>IP<\/b>-Adresse (z. B. <code>51.15.20.4<\/code>).<\/li>\n<li><b>Verbindung<\/b>: Der Browser kontaktiert diese IP auf <b>Port 443<\/b> (HTTPS). Port 80 = HTTP, 3306 = MySQL, 8080 = lokal meist Spring Boot.<\/li>\n<li><b>HTTP-Anfrage<\/b>: <code>GET /produits<\/code>.<\/li>\n<li><b>Verarbeitung<\/b>: Der Server führt Code aus und fragt die Datenbank ab.<\/li>\n<li><b>HTTP-Antwort<\/b>: ein <b>Statuscode<\/b> (200, 404 …) und ein Inhalt (HTML, JSON …).<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Aufbau einer HTTP-Anfrage und -Antwort", "lang": "http", "code": "GET /api/produits/12 HTTP/1.1\nHost: librastock.com\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{ \"id\": 12, \"nom\": \"Cahier A4 96 pages\", \"prix\": 2.50, \"stock\": 140 }", "note": "Wichtige HTTP-Methoden: <b>GET<\/b> (lesen), <b>POST<\/b> (anlegen), <b>PUT<\/b> (ändern), <b>DELETE<\/b> (löschen). Codes: <b>2xx<\/b> Erfolg, <b>4xx<\/b> Fehler des Clients, <b>5xx<\/b> Fehler des Servers."}, {"type": "code", "title": "Das Terminal: deine ersten Befehle", "lang": "bash", "code": "pwd                 # où suis-je ?\nls -la              # lister les fichiers (même cachés)\ncd projets          # entrer dans un dossier\ncd ..               # remonter d'un niveau\nmkdir librastock    # créer un dossier\ntouch notes.txt     # créer un fichier vide\ncat notes.txt       # afficher un fichier\nrm notes.txt        # supprimer un fichier (attention, pas de corbeille !)\ncurl https://api.github.com   # envoyer une requête HTTP depuis le terminal", "note": "Entwickler verbringen viel Zeit im Terminal. Auf dem Mac: die App <b>Terminal<\/b>. Unter Windows: <b>Git Bash<\/b> oder <b>WSL<\/b>."}, {"type": "quiz", "title": "Quiz", "question": "Was bedeutet der HTTP-Statuscode 404?", "options": ["Der Server ist abgestürzt", "Die angefragte Ressource existiert nicht", "Die Anfrage war erfolgreich", "Man muss sich anmelden"], "answer": 1, "explain": "404 = <i>Not Found<\/i>. Ein 5xx-Fehler zeigt ein Problem auf dem Server, 401/403 ein Problem mit Anmeldung oder Rechten."}, {"type": "quiz", "title": "Quiz", "question": "Welche Aufgabe hat das DNS?", "options": ["Die Verbindung verschlüsseln", "Webseiten speichern", "Einen Domainnamen in eine IP-Adresse übersetzen", "Java-Code ausführen"], "answer": 2, "explain": "Das DNS ist das Telefonbuch des Internets: Es macht aus <code>librastock.com<\/code> eine IP-Adresse."}, {"type": "exercise", "title": "Übung: eine echte Anfrage beobachten", "task": "\n<ol><li>Öffne deinen Browser und die Entwicklertools (<kbd>F12<\/kbd> oder <kbd>Cmd+Option+I<\/kbd>), Tab <b>Netzwerk / Network<\/b>.<\/li>\n<li>Lade eine beliebige Webseite neu.<\/li>\n<li>Klicke auf die erste Anfrage und notiere: die Methode, den Statuscode, den <code>Content-Type<\/code> der Antwort.<\/li>\n<li>Führe im Terminal <code>curl -i https://api.github.com/users/octocat<\/code> aus und finde dieselben Informationen.<\/li><\/ol>\n", "solution": "Methode: GET\nStatuscode: 200 OK\nContent-Type: text/html (Webseite) oder application/json (API)\nMit curl -i werden die Header vor dem JSON-Inhalt angezeigt.", "lang": "text"}]}, {"title": "Was ist Git?", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Verstehen, warum man Code versioniert<\/li><li>Den Ablauf add → commit → push beherrschen<\/li><li>Mit Branches arbeiten<\/li><li>Ein Projekt auf GitHub veröffentlichen<\/li><\/ul>"}, {"type": "text", "title": "Warum Git?", "html": "\n<p><b>Git<\/b> ist ein <b>Versionsverwaltungssystem<\/b>. Es speichert die Geschichte deines Codes als\n<b>Commits<\/b> („Fotos“ deines Projekts zu einem bestimmten Zeitpunkt).<\/p>\n<ul>\n<li>Zurückgehen, wenn du etwas kaputt gemacht hast.<\/li>\n<li>Im Team arbeiten, ohne die Arbeit anderer zu überschreiben.<\/li>\n<li>Eine Idee in einem <b>Branch<\/b> ausprobieren, ohne die stabile Version anzufassen.<\/li>\n<\/ul>\n<p><b>GitHub<\/b> ist nicht Git: Es ist eine <b>Website<\/b>, die Git-Repositories online speichert (und außerdem GitHub Actions anbietet, das du in Woche 13 kennenlernst).<\/p>\n"}, {"type": "text", "title": "Die 3 Bereiche von Git", "html": "\n<div class=\"flow\"><span>📁 Arbeitsverzeichnis<br><small>deine geänderten Dateien<\/small><\/span><span class=\"arrow\">git add →<\/span><span>📋 Staging-Bereich<br><small>vorgemerkt<\/small><\/span><span class=\"arrow\">git commit →<\/span><span>🗄️ Lokales Repository<br><small>Historie<\/small><\/span><\/div>\n<div class=\"flow\"><span>🗄️ Lokales Repository<\/span><span class=\"arrow\">git push →<\/span><span>☁️ GitHub<br><small>entferntes Repository<\/small><\/span><\/div>\n"}, {"type": "code", "title": "Der Grundablauf", "lang": "bash", "code": "git config --global user.name \"Ton Nom\"\ngit config --global user.email \"toi@email.com\"\n\ngit init                     # transformer un dossier en dépôt Git\ngit status                   # voir ce qui a changé\ngit add Main.java            # préparer un fichier (ou: git add .)\ngit commit -m \"Ajoute la classe Main\"\ngit log --oneline            # voir l'historique\n\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main      # envoyer sur GitHub\ngit pull                     # récupérer les changements distants", "note": ""}, {"type": "code", "title": "Branches", "lang": "bash", "code": "git switch -c feature/alertes-stock   # créer une branche et y aller\n# ... modifier du code, add, commit ...\ngit switch main                       # revenir sur main\ngit merge feature/alertes-stock       # fusionner la branche\ngit branch -d feature/alertes-stock   # supprimer la branche fusionnée", "note": "Gute Praxis: <b>ein Branch pro Funktion<\/b> und klare Commit-Nachrichten im Imperativ: „Füge … hinzu“, „Behebe …“."}, {"type": "code", "title": "Die Datei .gitignore", "lang": "text", "code": "# Ne jamais versionner :\ntarget/          # fichiers compilés Java (Maven)\nnode_modules/    # dépendances JavaScript\n.env             # mots de passe et secrets !\n.idea/\n.DS_Store", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Welcher Befehl schickt deine lokalen Commits zu GitHub?", "options": ["git commit", "git add", "git push", "git pull"], "answer": 2, "explain": "<code>git commit<\/code> speichert lokal, <code>git push<\/code> sendet an das entfernte Repository."}, {"type": "quiz", "title": "Quiz", "question": "Wofür ist ein Branch da?", "options": ["Um die Historie zu löschen", "Um eine Funktion zu entwickeln, ohne die Hauptversion anzufassen", "Um den Code zu kompilieren", "Um sich bei GitHub anzumelden"], "answer": 1, "explain": "Ein Branch ist eine parallele Entwicklungslinie. Man führt ihn zusammen (merge), wenn die Arbeit fertig ist."}, {"type": "exercise", "title": "Übung: dein erstes Repository", "task": "\n<ol><li>Erstelle einen Ordner <code>librastock<\/code> und initialisiere ein Git-Repository.<\/li>\n<li>Erstelle eine Datei <code>README.md<\/code> mit dem Projekttitel und committe sie.<\/li>\n<li>Erstelle einen Branch <code>docs/description<\/code>, ergänze eine Projektbeschreibung in der README, committe.<\/li>\n<li>Führe den Branch in <code>main<\/code> zusammen und veröffentliche das Repository auf GitHub.<\/li><\/ol>\n", "solution": "mkdir librastock && cd librastock\ngit init\necho \"# LibraStock\" > README.md\ngit add README.md\ngit commit -m \"Ajoute le README\"\ngit switch -c docs/description\necho \"Application de gestion de stock pour une librairie-papeterie.\" >> README.md\ngit commit -am \"Décrit le projet\"\ngit switch main\ngit merge docs/description\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main", "lang": "bash"}]}, {"title": "Was ist Java?", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>JDK, JVM und Kompilierung verstehen<\/li><li>Variablen, Bedingungen, Schleifen und Methoden schreiben<\/li><li>Ein erstes Java-Programm ausführen<\/li><\/ul>"}, {"type": "text", "title": "Java auf einer Folie", "html": "\n<p><b>Java<\/b> ist eine <b>objektorientierte<\/b>, <b>statisch typisierte<\/b> Sprache, die in Unternehmen sehr verbreitet ist (Banken, Versicherungen, Behörden …). Spring Boot, das Framework aus Woche 5, ist in Java geschrieben.<\/p>\n<div class=\"flow\"><span>📄 Main.java<br><small>Quellcode<\/small><\/span><span class=\"arrow\">javac →<\/span><span>⚙️ Main.class<br><small>Bytecode<\/small><\/span><span class=\"arrow\">java →<\/span><span>☕ JVM<br><small>läuft überall<\/small><\/span><\/div>\n<ul>\n<li><b>JDK<\/b>: das Entwicklungspaket (Compiler + Werkzeuge). Installiere eine LTS-Version: <b>Java 21<\/b>.<\/li>\n<li><b>JVM<\/b>: die virtuelle Maschine, die den Bytecode unter Windows, Mac oder Linux ausführt.<\/li>\n<li>Empfohlene <b>IDE<\/b>: IntelliJ IDEA Community (kostenlos) oder VS Code + Java-Erweiterung.<\/li>\n<\/ul>\n"}, {"type": "code", "title": "Variablen und Datentypen", "lang": "java", "code": "public class Main {\n    public static void main(String[] args) {\n        String nom = \"Cahier A4\";      // texte\n        int stock = 140;               // nombre entier\n        double prix = 2.50;            // nombre décimal\n        boolean disponible = stock > 0; // vrai / faux\n\n        System.out.println(nom + \" coûte \" + prix + \" €\");\n        System.out.println(\"Disponible : \" + disponible);\n    }\n}", "note": ""}, {"type": "code", "title": "Bedingungen und Schleifen", "lang": "java", "code": "int stock = 8;\nint seuilMinimum = 10;\n\nif (stock == 0) {\n    System.out.println(\"Rupture de stock !\");\n} else if (stock < seuilMinimum) {\n    System.out.println(\"Stock faible, commander bientôt.\");\n} else {\n    System.out.println(\"Stock OK\");\n}\n\n// Boucle for : afficher 5 étiquettes\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(\"Étiquette n°\" + i);\n}\n\n// Boucle while : vendre jusqu'à épuisement\nwhile (stock > 0) {\n    stock--;\n}", "note": ""}, {"type": "code", "title": "Methoden", "lang": "java", "code": "public class Caisse {\n\n    // Une méthode reçoit des paramètres et renvoie un résultat\n    static double calculerTotal(double prixUnitaire, int quantite) {\n        return prixUnitaire * quantite;\n    }\n\n    static double appliquerRemise(double total, double pourcentage) {\n        return total - total * pourcentage / 100;\n    }\n\n    public static void main(String[] args) {\n        double total = calculerTotal(2.50, 12);\n        double aPayer = appliquerRemise(total, 10);\n        System.out.println(\"À payer : \" + aPayer + \" €\"); // 27.0 €\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Was macht die JVM?", "options": ["Sie kompiliert den Quellcode", "Sie führt Java-Bytecode aus", "Sie hostet Code im Internet", "Sie verwaltet die Datenbank"], "answer": 1, "explain": "<code>javac<\/code> kompiliert in Bytecode, die <b>JVM<\/b> führt diesen Bytecode auf jedem System aus."}, {"type": "quiz", "title": "Quiz", "question": "Welchen Datentyp nimmst du für einen Preis wie 2.50?", "options": ["int", "boolean", "String", "double"], "answer": 3, "explain": "<code>double<\/code> speichert Dezimalzahlen. In der Praxis nimmt man für Geld eher <code>BigDecimal<\/code>, um Rundungsfehler zu vermeiden."}, {"type": "exercise", "title": "Übung: Nachbestell-Rechner", "task": "\n<p>Schreibe eine Methode <code>quantiteACommander(int stock, int seuil, int stockCible)<\/code>, die\ndie Bestellmenge zurückgibt: 0, wenn der Bestand größer oder gleich der Schwelle ist, sonst <code>stockCible - stock<\/code>.\nTeste sie mit (8, 10, 50) und (25, 10, 50).<\/p>\n", "solution": "static int quantiteACommander(int stock, int seuil, int stockCible) {\n    if (stock >= seuil) {\n        return 0;\n    }\n    return stockCible - stock;\n}\n\n// quantiteACommander(8, 10, 50)  -> 42\n// quantiteACommander(25, 10, 50) -> 0", "lang": "java"}]}, {"title": "Objektorientiertes Java", "slides": [{"type": "text", "title": "Lernziele", "html": "<ul class='goals'><li>Klassen und Objekte erstellen<\/li><li>Kapselung nutzen (private + Getter)<\/li><li>Mit Listen (ArrayList) arbeiten<\/li><li>Das Ergebnis von Modul 1 abgeben<\/li><\/ul>"}, {"type": "text", "title": "Klasse und Objekt", "html": "\n<p>Eine <b>Klasse<\/b> ist ein Bauplan (die Form). Ein <b>Objekt<\/b> ist eine konkrete Instanz, die aus diesem Bauplan entsteht.<\/p>\n<p>Klasse <code>Produit<\/code> → Objekte: „Cahier A4“, „Stylo bleu“, „Le Petit Prince“ …<\/p>\n<p>Die 4 Ideen der objektorientierten Programmierung: <b>Kapselung<\/b> (Daten schützen), <b>Vererbung<\/b>, <b>Polymorphie<\/b>, <b>Abstraktion<\/b>.\nFür Spring Boot sind Kapselung und Interfaces am wichtigsten.<\/p>\n"}, {"type": "code", "title": "Die Klasse Produit (Produkt)", "lang": "java", "code": "public class Produit {\n    private String nom;     // private = protégé, accessible seulement ici\n    private double prix;\n    private int stock;\n\n    public Produit(String nom, double prix, int stock) {  // constructeur\n        this.nom = nom;\n        this.prix = prix;\n        this.stock = stock;\n    }\n\n    public void vendre(int quantite) {\n        if (quantite > stock) {\n            throw new IllegalArgumentException(\"Stock insuffisant pour \" + nom);\n        }\n        stock -= quantite;\n    }\n\n    public void reapprovisionner(int quantite) { stock += quantite; }\n\n    public String getNom() { return nom; }\n    public double getPrix() { return prix; }\n    public int getStock() { return stock; }\n}", "note": ""}, {"type": "code", "title": "Listen von Objekten", "lang": "java", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Produit> catalogue = new ArrayList<>();\n        catalogue.add(new Produit(\"Cahier A4\", 2.50, 140));\n        catalogue.add(new Produit(\"Stylo bleu\", 0.80, 6));\n\n        catalogue.get(0).vendre(10);\n\n        for (Produit p : catalogue) {\n            if (p.getStock() < 10) {\n                System.out.println(\"⚠ Stock faible : \" + p.getNom());\n            }\n        }\n\n        // Version moderne avec les streams\n        catalogue.stream()\n                 .filter(p -> p.getStock() < 10)\n                 .forEach(p -> System.out.println(p.getNom()));\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Warum deklariert man Attribute als private?", "options": ["Damit das Programm schneller läuft", "Damit der Zustand des Objekts nicht beliebig verändert werden kann", "Weil Java es vorschreibt", "Um sie auf GitHub zu verstecken"], "answer": 1, "explain": "Das ist <b>Kapselung<\/b>: Änderungen laufen über Methoden (wie <code>vendre()<\/code>), die die Regeln prüfen, z. B. nicht mehr verkaufen als vorhanden."}, {"type": "exercise", "title": "🎯 Ergebnis Modul 1", "task": "\n<p>Erstelle ein Java-Kommandozeilenprogramm <b>LibraStock v0<\/b>:<\/p>\n<ul><li>eine Klasse <code>Produit<\/code> (Name, Preis, Bestand, Mindestbestand);<\/li>\n<li>eine Klasse <code>Inventaire<\/code> (Inventar) mit einer <code>List&lt;Produit&gt;<\/code> und den Methoden\n<code>ajouter<\/code> (hinzufügen), <code>vendre(nom, quantite)<\/code> (verkaufen), <code>produitsEnAlerte()<\/code> (Produkte mit Warnung), <code>valeurTotaleDuStock()<\/code> (Gesamtwert des Lagers);<\/li>\n<li>eine <code>main<\/code>-Methode, die alle Methoden vorführt.<\/li><\/ul>\n<p>Veröffentliche es auf GitHub mit mindestens 5 klaren Commits.<\/p>\n", "solution": "public class Inventaire {\n    private final List<Produit> produits = new ArrayList<>();\n\n    public void ajouter(Produit p) { produits.add(p); }\n\n    public void vendre(String nom, int q
