<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootcamp Fullstack Java – 16 semaines</title>
<meta name="description" content="Cours interactif et gratuit pour apprendre le développement Fullstack Java en 16 semaines : Git, Java, SQL/MySQL, Spring Boot, React, GitHub Actions.">
<style>
:root{
  --bg:#05082a; --bg2:#0b1040; --card:#111850; --line:#232c6e;
  --text:#eef1ff; --muted:#9aa3d6; --accent:#7CFC00; --accent2:#00D1FF;
  --ok:#3ddc84; --ko:#ff5c7a; --code:#070b30;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
a{color:var(--accent2)}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--code);padding:.1em .4em;border-radius:6px;border:1px solid var(--line)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:rgba(5,8,42,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand span{color:var(--accent)}
.global-progress{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}

.right{display:flex;align-items:center;gap:14px}
.langs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.langs button{background:none;border:none;color:var(--muted);padding:6px 10px;font-size:.8rem;font-weight:700}
.langs button.on{background:var(--accent);color:#05082a}
/* ---------- Home ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hero{padding:64px 0 40px;text-align:center}
.kicker{display:inline-block;text-transform:uppercase;letter-spacing:2px;font-size:.78rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:99px;padding:4px 14px;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:0 0 14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:680px;margin:0 auto 26px;font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:28px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem}
.cta{background:var(--accent);color:#05082a;border:none;border-radius:12px;padding:13px 26px;font-weight:800;font-size:1rem;box-shadow:0 0 24px rgba(124,252,0,.25)}
.cta.secondary{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.section{padding:36px 0}
.section h2{font-size:1.7rem;margin:0 0 6px}
.section .sub{color:var(--muted);margin:0 0 22px}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.method div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.method b{display:block;font-size:1.05rem;margin-bottom:4px;color:var(--accent)}
.timeline{display:grid;gap:14px}
.mod{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:var(--accent)}
.mod .weeks{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.mod .ico{font-size:2rem}
.mod h3{margin:0 0 4px;font-size:1.2rem}
.mod p{margin:0;color:var(--muted);font-size:.95rem}
.mod .count{font-size:.85rem;color:var(--muted);text-align:right;white-space:nowrap}
.ring{width:52px;height:52px}
.project{background:linear-gradient(135deg,var(--card),var(--bg2));border:1.5px solid var(--accent);border-radius:var(--radius);padding:24px}
.project ul{padding-left:20px}
footer{color:var(--muted);text-align:center;font-size:.85rem;padding:40px 20px 60px;border-top:1px solid var(--line);margin-top:30px}

/* ---------- Course player ---------- */
.player{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 57px)}
.side{border-right:1px solid var(--line);background:var(--bg2);padding:18px 14px;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.side .mtitle{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:18px 8px 6px}
.side .mtitle:first-child{margin-top:0}
.side button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:10px;font-size:.93rem}
.side button:hover{background:var(--card)}
.side button.active{background:var(--card);outline:1.5px solid var(--accent)}
.side .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:11px}
.side .done .dot{background:var(--ok);border-color:var(--ok);color:#05082a}
.stage{padding:26px clamp(16px,4vw,56px) 40px;display:flex;flex-direction:column;min-width:0}
.crumb{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.crumb b{color:var(--accent)}
.stage h2{margin:0 0 14px;font-size:clamp(1.4rem,3vw,2rem)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.dots span{width:26px;height:6px;border-radius:99px;background:var(--line);cursor:pointer}
.dots span.on{background:var(--accent)}
.dots span.seen{background:#4c5bb5}
.slide{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,3vw,32px);flex:1;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide h3{margin:0 0 14px;font-size:1.35rem}
.slide p,.slide li{font-size:1.02rem}
.goals{list-style:none;padding:0}
.goals li{padding:10px 14px;margin:8px 0;background:var(--bg2);border-left:4px solid var(--accent);border-radius:8px}
.goals li::before{content:"✓ ";color:var(--accent);font-weight:800}
.steps li{margin:8px 0}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}
.flow span{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center}
.flow span small{color:var(--muted)}
.flow .arrow{background:none;border:none;color:var(--accent);font-weight:700;padding:0}
.tbl{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem;display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.tbl th{background:var(--bg2);color:var(--accent)}
pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;font-size:.88rem;line-height:1.5;margin:10px 0}
pre code{background:none;border:none;padding:0;font-size:inherit;white-space:pre}
.lang{position:absolute;top:8px;right:72px;font-size:.7rem;text-transform:uppercase;color:var(--muted)}
.copy{position:absolute;top:6px;right:8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.75rem}
.tok-c{color:#6f7bb8;font-style:italic}.tok-s{color:#a5e88b}.tok-k{color:#7fd3ff}
.note{background:rgba(0,209,255,.08);border:1px solid rgba(0,209,255,.35);border-radius:10px;padding:12px 14px;font-size:.95rem}
.quiz-q{font-size:1.12rem;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.ok{border-color:var(--ok);background:rgba(61,220,132,.12)}
.opt.ko{border-color:var(--ko);background:rgba(255,92,122,.12)}
.explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg2)}
.badge{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.badge.q{background:rgba(0,209,255,.15);color:var(--accent2)}
.badge.e{background:rgba(124,252,0,.15);color:var(--accent)}
.reveal{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:8px 14px;margin-top:10px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.nav button{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:11px 20px;font-weight:600}
.nav button.primary{background:var(--accent);color:#05082a;border-color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .hint{color:var(--muted);font-size:.8rem}
.menu-btn{display:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.done-box{text-align:center;padding:30px 10px}
.done-box .big{font-size:3rem}

@media (max-width:860px){
  .player{grid-template-columns:1fr}
  .side{position:fixed;inset:57px 0 0 0;max-height:none;z-index:15;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .mod{grid-template-columns:1fr;gap:8px}
  .mod .count{text-align:left}
  .bar{display:none}
  .topbar{padding:10px 12px;gap:8px}
  .brand{font-size:.85rem;gap:6px}
  .right{gap:8px}
  .langs button{padding:6px 8px}
  .global-progress{white-space:nowrap;gap:6px}
  .nav .hint{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="menu-btn hidden" id="menuBtn" aria-label="Menu des leçons">☰</button>
    <div class="brand" id="homeLink">☕ <div>Bootcamp <span>Fullstack Java</span></div></div>
  </div>
  <div class="right">
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
    </div>
    <div class="global-progress"><span id="progressLabel">0 %</span><div class="bar"><i id="progressBar"></i></div></div>
  </div>
</div>

<!-- ================= HOME ================= -->
<div id="home">
  <div class="wrap">
    <section class="hero">
      <div class="kicker" data-i18n="kicker"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="heroP"></p>
      <div class="chips" id="techChips"></div>
      <button class="cta" id="startBtn"></button>
    </section>

    <section class="section">
      <h2 data-i18n="methodH"></h2>
      <p class="sub" data-i18n="methodSub"></p>
      <div class="method">
<div data-i18n="m1"></div><div data-i18n="m2"></div><div data-i18n="m3"></div>
      </div>
    </section>

    <section class="section">
      <h2 data-i18n="progH"></h2>
      <p class="sub" data-i18n="progSub"></p>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="section">
      <h2 data-i18n="projectH"></h2>
      <div class="project" id="projectBox"></div>
    </section>

    <section class="section">
      <h2 data-i18n="prereqH"></h2>
      <p class="sub" data-i18n="prereqSub"></p>
<ul data-i18n="prereqList"></ul>
    </section>
  </div>
  <footer data-i18n="footer"></footer>
</div>

<!-- ================= PLAYER ================= -->
<div id="player" class="player hidden">
  <aside class="side" id="side"></aside>
  <main class="stage">
    <div class="crumb" id="crumb"></div>
    <h2 id="lessonTitle"></h2>
    <div class="dots" id="dots"></div>
    <div class="slide" id="slide"></div>
    <div class="nav">
      <button id="prevBtn"></button>
      <span class="hint" data-i18n="hint"></span>
      <button id="nextBtn" class="primary"></button>
    </div>
  </main>
</div>

<script>
const COURSE = {"fr": {"modules": [{"id": "m1", "weeks": "Semaines 1 & 2", "title": "Les bases de l'informatique", "icon": "🖥️", "color": "#7CFC00", "summary": "Comprendre ce qui se passe derrière une application web : le serveur, Git et le langage Java.", "deliverable": "Un dépôt GitHub public contenant un petit programme Java en ligne de commande (gestion d'une liste de produits en mémoire), avec au moins 5 commits propres.", "lessons": [{"title": "Le fonctionnement d'un serveur", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Expliquer le modèle client / serveur<\/li><li>Comprendre une requête et une réponse HTTP<\/li><li>Connaître le rôle du DNS, de l'IP et des ports<\/li><li>Utiliser les commandes de base du terminal<\/li><\/ul>"}, {"type": "text", "title": "Client et serveur", "html": "\n<p>Quand tu ouvres un site web, deux programmes discutent :<\/p>\n<div class=\"flow\"><span>🧑‍💻 Client<br><small>navigateur, appli mobile<\/small><\/span><span class=\"arrow\">→ requête →<\/span><span>🖥️ Serveur<br><small>programme qui écoute<\/small><\/span><\/div>\n<div class=\"flow\"><span>🧑‍💻 Client<\/span><span class=\"arrow\">← réponse ←<\/span><span>🖥️ Serveur<\/span><\/div>\n<p>Un <b>serveur<\/b> n'est pas forcément une machine spéciale : c'est d'abord un <b>programme<\/b> qui attend des requêtes\nsur un <b>port<\/b> et renvoie des réponses. Ce programme tourne sur un ordinateur (physique ou dans le cloud).<\/p>\n<p>Dans notre projet : le navigateur affiche l'interface <b>React<\/b> (client), qui appelle l'API <b>Spring Boot<\/b> (serveur), qui lit et écrit dans <b>MySQL<\/b> (serveur de base de données).<\/p>\n"}, {"type": "text", "title": "Le voyage d'une requête", "html": "\n<ol class=\"steps\">\n<li><b>Tu tapes<\/b> <code>https://librastock.com/produits<\/code>.<\/li>\n<li><b>DNS<\/b> : l'annuaire d'Internet traduit <code>librastock.com<\/code> en adresse <b>IP<\/b> (ex. <code>51.15.20.4<\/code>).<\/li>\n<li><b>Connexion<\/b> : le navigateur contacte cette IP sur le <b>port 443<\/b> (HTTPS). Le port 80 = HTTP, 3306 = MySQL, 8080 = souvent Spring Boot en local.<\/li>\n<li><b>Requête HTTP<\/b> : <code>GET /produits<\/code>.<\/li>\n<li><b>Traitement<\/b> : le serveur exécute du code, interroge la base de données.<\/li>\n<li><b>Réponse HTTP<\/b> : un <b>code statut<\/b> (200, 404…) et un contenu (HTML, JSON…).<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Anatomie d'une requête et d'une réponse HTTP", "lang": "http", "code": "GET /api/produits/12 HTTP/1.1\nHost: librastock.com\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{ \"id\": 12, \"nom\": \"Cahier A4 96 pages\", \"prix\": 2.50, \"stock\": 140 }", "note": "Les verbes HTTP à connaître : <b>GET<\/b> (lire), <b>POST<\/b> (créer), <b>PUT<\/b> (modifier), <b>DELETE<\/b> (supprimer). Codes : <b>2xx<\/b> succès, <b>4xx<\/b> erreur du client, <b>5xx<\/b> erreur du serveur."}, {"type": "code", "title": "Le terminal : tes premières commandes", "lang": "bash", "code": "pwd                 # où suis-je ?\nls -la              # lister les fichiers (même cachés)\ncd projets          # entrer dans un dossier\ncd ..               # remonter d'un niveau\nmkdir librastock    # créer un dossier\ntouch notes.txt     # créer un fichier vide\ncat notes.txt       # afficher un fichier\nrm notes.txt        # supprimer un fichier (attention, pas de corbeille !)\ncurl https://api.github.com   # envoyer une requête HTTP depuis le terminal", "note": "Un développeur passe beaucoup de temps dans le terminal. Sur Mac : application <b>Terminal<\/b>. Sur Windows : <b>Git Bash<\/b> ou <b>WSL<\/b>."}, {"type": "quiz", "title": "Quiz", "question": "Que signifie un code de réponse HTTP 404 ?", "options": ["Le serveur a planté", "La ressource demandée n'existe pas", "La requête a réussi", "Il faut se connecter"], "answer": 1, "explain": "404 = <i>Not Found<\/i>. Une erreur 5xx indique un problème côté serveur, 401/403 un problème d'authentification ou de droits."}, {"type": "quiz", "title": "Quiz", "question": "Quel est le rôle du DNS ?", "options": ["Chiffrer la connexion", "Stocker les pages web", "Traduire un nom de domaine en adresse IP", "Exécuter le code Java"], "answer": 2, "explain": "Le DNS est l'annuaire d'Internet : il transforme <code>librastock.com<\/code> en une adresse IP."}, {"type": "exercise", "title": "Exercice : observe une vraie requête", "task": "\n<ol><li>Ouvre ton navigateur, puis les outils de développement (<kbd>F12<\/kbd> ou <kbd>Cmd+Option+I<\/kbd>), onglet <b>Réseau / Network<\/b>.<\/li>\n<li>Recharge une page web au choix.<\/li>\n<li>Clique sur la première requête et note : la méthode, le code statut, le <code>Content-Type<\/code> de la réponse.<\/li>\n<li>Dans le terminal, lance <code>curl -i https://api.github.com/users/octocat<\/code> et repère les mêmes informations.<\/li><\/ol>\n", "solution": "Méthode : GET\nCode statut : 200 OK\nContent-Type : text/html (page web) ou application/json (API)\nAvec curl -i, les en-têtes (headers) s'affichent avant le corps JSON.", "lang": "text"}]}, {"title": "C'est quoi Git ?", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre pourquoi on versionne son code<\/li><li>Maîtriser le cycle add → commit → push<\/li><li>Travailler avec des branches<\/li><li>Publier un projet sur GitHub<\/li><\/ul>"}, {"type": "text", "title": "Pourquoi Git ?", "html": "\n<p><b>Git<\/b> est un logiciel de <b>gestion de versions<\/b>. Il enregistre l'historique de ton code sous forme de\n<b>commits<\/b> (des « photos » de ton projet à un instant donné).<\/p>\n<ul>\n<li>Revenir en arrière si tu casses quelque chose.<\/li>\n<li>Travailler à plusieurs sans écraser le travail des autres.<\/li>\n<li>Tester une idée dans une <b>branche<\/b> sans toucher à la version stable.<\/li>\n<\/ul>\n<p><b>GitHub<\/b> n'est pas Git : c'est un <b>site<\/b> qui héberge des dépôts Git en ligne (et qui propose aussi GitHub Actions, que tu verras en semaine 13).<\/p>\n"}, {"type": "text", "title": "Les 3 zones de Git", "html": "\n<div class=\"flow\"><span>📁 Dossier de travail<br><small>tes fichiers modifiés<\/small><\/span><span class=\"arrow\">git add →<\/span><span>📋 Zone de préparation<br><small>staging<\/small><\/span><span class=\"arrow\">git commit →<\/span><span>🗄️ Dépôt local<br><small>historique<\/small><\/span><\/div>\n<div class=\"flow\"><span>🗄️ Dépôt local<\/span><span class=\"arrow\">git push →<\/span><span>☁️ GitHub<br><small>dépôt distant<\/small><\/span><\/div>\n"}, {"type": "code", "title": "Le cycle de base", "lang": "bash", "code": "git config --global user.name \"Ton Nom\"\ngit config --global user.email \"toi@email.com\"\n\ngit init                     # transformer un dossier en dépôt Git\ngit status                   # voir ce qui a changé\ngit add Main.java            # préparer un fichier (ou: git add .)\ngit commit -m \"Ajoute la classe Main\"\ngit log --oneline            # voir l'historique\n\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main      # envoyer sur GitHub\ngit pull                     # récupérer les changements distants", "note": ""}, {"type": "code", "title": "Les branches", "lang": "bash", "code": "git switch -c feature/alertes-stock   # créer une branche et y aller\n# ... modifier du code, add, commit ...\ngit switch main                       # revenir sur main\ngit merge feature/alertes-stock       # fusionner la branche\ngit branch -d feature/alertes-stock   # supprimer la branche fusionnée", "note": "Bonne pratique : <b>une branche par fonctionnalité<\/b>, et des messages de commit clairs à l'impératif : « Ajoute… », « Corrige… »."}, {"type": "code", "title": "Le fichier .gitignore", "lang": "text", "code": "# Ne jamais versionner :\ntarget/          # fichiers compilés Java (Maven)\nnode_modules/    # dépendances JavaScript\n.env             # mots de passe et secrets !\n.idea/\n.DS_Store", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Quelle commande envoie tes commits locaux vers GitHub ?", "options": ["git commit", "git add", "git push", "git pull"], "answer": 2, "explain": "<code>git commit<\/code> enregistre localement, <code>git push<\/code> envoie vers le dépôt distant."}, {"type": "quiz", "title": "Quiz", "question": "À quoi sert une branche ?", "options": ["À supprimer l'historique", "À développer une fonctionnalité sans toucher à la version principale", "À compiler le code", "À se connecter à GitHub"], "answer": 1, "explain": "Une branche est une ligne de développement parallèle. On la fusionne (merge) quand le travail est prêt."}, {"type": "exercise", "title": "Exercice : ton premier dépôt", "task": "\n<ol><li>Crée un dossier <code>librastock<\/code> et initialise un dépôt Git.<\/li>\n<li>Crée un fichier <code>README.md<\/code> avec le titre du projet et fais un commit.<\/li>\n<li>Crée une branche <code>docs/description<\/code>, ajoute une description du projet dans le README, commit.<\/li>\n<li>Fusionne la branche dans <code>main<\/code>, puis publie le dépôt sur GitHub.<\/li><\/ol>\n", "solution": "mkdir librastock && cd librastock\ngit init\necho \"# LibraStock\" > README.md\ngit add README.md\ngit commit -m \"Ajoute le README\"\ngit switch -c docs/description\necho \"Application de gestion de stock pour une librairie-papeterie.\" >> README.md\ngit commit -am \"Décrit le projet\"\ngit switch main\ngit merge docs/description\ngit remote add origin https://github.com/TON-COMPTE/librastock.git\ngit push -u origin main", "lang": "bash"}]}, {"title": "C'est quoi Java ?", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre JDK, JVM et compilation<\/li><li>Écrire variables, conditions, boucles et méthodes<\/li><li>Exécuter un premier programme Java<\/li><\/ul>"}, {"type": "text", "title": "Java en une slide", "html": "\n<p><b>Java<\/b> est un langage <b>orienté objet<\/b>, <b>typé<\/b> et très utilisé en entreprise (banques, assurances, administrations…). Spring Boot, le framework que tu utiliseras en semaine 5, est écrit en Java.<\/p>\n<div class=\"flow\"><span>📄 Main.java<br><small>code source<\/small><\/span><span class=\"arrow\">javac →<\/span><span>⚙️ Main.class<br><small>bytecode<\/small><\/span><span class=\"arrow\">java →<\/span><span>☕ JVM<br><small>exécute partout<\/small><\/span><\/div>\n<ul>\n<li><b>JDK<\/b> : le kit pour développer (compilateur + outils). Installe une version LTS : <b>Java 21<\/b>.<\/li>\n<li><b>JVM<\/b> : la machine virtuelle qui exécute le bytecode, sur Windows, Mac ou Linux.<\/li>\n<li><b>IDE<\/b> conseillé : IntelliJ IDEA Community (gratuit) ou VS Code + extension Java.<\/li>\n<\/ul>\n"}, {"type": "code", "title": "Variables et types", "lang": "java", "code": "public class Main {\n    public static void main(String[] args) {\n        String nom = \"Cahier A4\";      // texte\n        int stock = 140;               // nombre entier\n        double prix = 2.50;            // nombre décimal\n        boolean disponible = stock > 0; // vrai / faux\n\n        System.out.println(nom + \" coûte \" + prix + \" €\");\n        System.out.println(\"Disponible : \" + disponible);\n    }\n}", "note": ""}, {"type": "code", "title": "Conditions et boucles", "lang": "java", "code": "int stock = 8;\nint seuilMinimum = 10;\n\nif (stock == 0) {\n    System.out.println(\"Rupture de stock !\");\n} else if (stock < seuilMinimum) {\n    System.out.println(\"Stock faible, commander bientôt.\");\n} else {\n    System.out.println(\"Stock OK\");\n}\n\n// Boucle for : afficher 5 étiquettes\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(\"Étiquette n°\" + i);\n}\n\n// Boucle while : vendre jusqu'à épuisement\nwhile (stock > 0) {\n    stock--;\n}", "note": ""}, {"type": "code", "title": "Méthodes", "lang": "java", "code": "public class Caisse {\n\n    // Une méthode reçoit des paramètres et renvoie un résultat\n    static double calculerTotal(double prixUnitaire, int quantite) {\n        return prixUnitaire * quantite;\n    }\n\n    static double appliquerRemise(double total, double pourcentage) {\n        return total - total * pourcentage / 100;\n    }\n\n    public static void main(String[] args) {\n        double total = calculerTotal(2.50, 12);\n        double aPayer = appliquerRemise(total, 10);\n        System.out.println(\"À payer : \" + aPayer + \" €\"); // 27.0 €\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Que fait la JVM ?", "options": ["Elle compile le code source", "Elle exécute le bytecode Java", "Elle héberge le code sur Internet", "Elle gère la base de données"], "answer": 1, "explain": "<code>javac<\/code> compile en bytecode, la <b>JVM<\/b> exécute ce bytecode sur n'importe quel système."}, {"type": "quiz", "title": "Quiz", "question": "Quel type utiliser pour stocker un prix comme 2.50 ?", "options": ["int", "boolean", "String", "double"], "answer": 3, "explain": "<code>double<\/code> stocke les nombres décimaux. En production, on utilise plutôt <code>BigDecimal<\/code> pour l'argent afin d'éviter les erreurs d'arrondi."}, {"type": "exercise", "title": "Exercice : calculateur de réapprovisionnement", "task": "\n<p>Écris une méthode <code>quantiteACommander(int stock, int seuil, int stockCible)<\/code> qui renvoie\nla quantité à commander : 0 si le stock est supérieur ou égal au seuil, sinon <code>stockCible - stock<\/code>.\nTeste-la avec (8, 10, 50) et (25, 10, 50).<\/p>\n", "solution": "static int quantiteACommander(int stock, int seuil, int stockCible) {\n    if (stock >= seuil) {\n        return 0;\n    }\n    return stockCible - stock;\n}\n\n// quantiteACommander(8, 10, 50)  -> 42\n// quantiteACommander(25, 10, 50) -> 0", "lang": "java"}]}, {"title": "Java orienté objet", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Créer des classes et des objets<\/li><li>Utiliser l'encapsulation (private + getters)<\/li><li>Manipuler des listes avec ArrayList<\/li><li>Livrer le programme du module 1<\/li><\/ul>"}, {"type": "text", "title": "Classe et objet", "html": "\n<p>Une <b>classe<\/b> est un plan (le moule). Un <b>objet<\/b> est une instance concrète créée à partir de ce plan.<\/p>\n<p>Classe <code>Produit<\/code> → objets : « Cahier A4 », « Stylo bleu », « Le Petit Prince »…<\/p>\n<p>Les 4 idées de la programmation orientée objet : <b>encapsulation<\/b> (protéger les données), <b>héritage<\/b>, <b>polymorphisme<\/b>, <b>abstraction<\/b>.\nPour Spring Boot, l'encapsulation et les interfaces sont les plus importantes.<\/p>\n"}, {"type": "code", "title": "La classe Produit", "lang": "java", "code": "public class Produit {\n    private String nom;     // private = protégé, accessible seulement ici\n    private double prix;\n    private int stock;\n\n    public Produit(String nom, double prix, int stock) {  // constructeur\n        this.nom = nom;\n        this.prix = prix;\n        this.stock = stock;\n    }\n\n    public void vendre(int quantite) {\n        if (quantite > stock) {\n            throw new IllegalArgumentException(\"Stock insuffisant pour \" + nom);\n        }\n        stock -= quantite;\n    }\n\n    public void reapprovisionner(int quantite) { stock += quantite; }\n\n    public String getNom() { return nom; }\n    public double getPrix() { return prix; }\n    public int getStock() { return stock; }\n}", "note": ""}, {"type": "code", "title": "Des listes d'objets", "lang": "java", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Produit> catalogue = new ArrayList<>();\n        catalogue.add(new Produit(\"Cahier A4\", 2.50, 140));\n        catalogue.add(new Produit(\"Stylo bleu\", 0.80, 6));\n\n        catalogue.get(0).vendre(10);\n\n        for (Produit p : catalogue) {\n            if (p.getStock() < 10) {\n                System.out.println(\"⚠ Stock faible : \" + p.getNom());\n            }\n        }\n\n        // Version moderne avec les streams\n        catalogue.stream()\n                 .filter(p -> p.getStock() < 10)\n                 .forEach(p -> System.out.println(p.getNom()));\n    }\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Pourquoi déclarer les attributs en private ?", "options": ["Pour que le programme soit plus rapide", "Pour empêcher qu'on modifie l'état de l'objet n'importe comment", "Parce que Java l'impose", "Pour les cacher sur GitHub"], "answer": 1, "explain": "C'est l'<b>encapsulation<\/b> : on passe par des méthodes (comme <code>vendre()<\/code>) qui contrôlent les règles, par ex. ne pas vendre plus que le stock."}, {"type": "exercise", "title": "🎯 Livrable du module 1", "task": "\n<p>Crée un programme Java en ligne de commande <b>LibraStock v0<\/b> :<\/p>\n<ul><li>une classe <code>Produit<\/code> (nom, prix, stock, seuil minimum) ;<\/li>\n<li>une classe <code>Inventaire<\/code> avec une <code>List&lt;Produit&gt;<\/code> et les méthodes\n<code>ajouter<\/code>, <code>vendre(nom, quantite)<\/code>, <code>produitsEnAlerte()<\/code>, <code>valeurTotaleDuStock()<\/code> ;<\/li>\n<li>un <code>main<\/code> qui démontre toutes les méthodes.<\/li><\/ul>\n<p>Publie-le sur GitHub avec au moins 5 commits clairs.<\/p>\n", "solution": "public class Inventaire {\n    private final List<Produit> produits = new ArrayList<>();\n\n    public void ajouter(Produit p) { produits.add(p); }\n\n    public void vendre(String nom, int quantite) {\n        trouver(nom).vendre(quantite);\n    }\n\n    public List<Produit> produitsEnAlerte() {\n        return produits.stream()\n                .filter(p -> p.getStock() < p.getSeuilMinimum())\n                .toList();\n    }\n\n    public double valeurTotaleDuStock() {\n        return produits.stream()\n                .mapToDouble(p -> p.getPrix() * p.getStock())\n                .sum();\n    }\n\n    private Produit trouver(String nom) {\n        return produits.stream()\n                .filter(p -> p.getNom().equalsIgnoreCase(nom))\n                .findFirst()\n                .orElseThrow(() -> new IllegalArgumentException(\"Produit inconnu : \" + nom));\n    }\n}", "lang": "java"}]}]}, {"id": "m2", "weeks": "Semaines 3 & 4", "title": "Les bases de données", "icon": "🗄️", "color": "#00D1FF", "summary": "Stocker les données de façon durable avec SQL et MySQL.", "deliverable": "Un script <code>schema.sql<\/code> et un script <code>data.sql<\/code> qui créent et remplissent la base LibraStock (catégories, produits, mouvements), plus un fichier <code>requetes.sql<\/code> avec 10 requêtes utiles.", "lessons": [{"title": "Les bases de données relationnelles", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre tables, lignes et colonnes<\/li><li>Connaître clé primaire et clé étrangère<\/li><li>Modéliser les données de LibraStock<\/li><\/ul>"}, {"type": "text", "title": "Pourquoi une base de données ?", "html": "\n<p>Dans le module 1, les produits disparaissent quand le programme s'arrête : ils sont seulement en mémoire.\nUne <b>base de données<\/b> stocke les données <b>durablement<\/b>, permet de les chercher rapidement et de les partager entre plusieurs utilisateurs.<\/p>\n<p>Une base <b>relationnelle<\/b> (MySQL, PostgreSQL…) organise les données en <b>tables<\/b> reliées entre elles. On l'interroge avec le langage <b>SQL<\/b>.<\/p>\n<table class=\"tbl\"><tr><th>id<\/th><th>nom<\/th><th>prix<\/th><th>stock<\/th><th>categorie_id<\/th><\/tr>\n<tr><td>1<\/td><td>Cahier A4<\/td><td>2.50<\/td><td>140<\/td><td>2<\/td><\/tr>\n<tr><td>2<\/td><td>Le Petit Prince<\/td><td>7.90<\/td><td>12<\/td><td>1<\/td><\/tr><\/table>\n<p><small>Une table = un type d'objet · une ligne = un enregistrement · une colonne = un attribut<\/small><\/p>\n"}, {"type": "text", "title": "Clés et relations", "html": "\n<ul>\n<li><b>Clé primaire (PRIMARY KEY)<\/b> : identifiant unique de chaque ligne, souvent <code>id<\/code> auto-incrémenté.<\/li>\n<li><b>Clé étrangère (FOREIGN KEY)<\/b> : colonne qui pointe vers la clé primaire d'une autre table.<\/li>\n<\/ul>\n<p><b>Relations dans LibraStock :<\/b><\/p>\n<div class=\"flow\"><span>categorie<\/span><span class=\"arrow\">1 ── N<\/span><span>produit<\/span><span class=\"arrow\">1 ── N<\/span><span>mouvement_stock<\/span><\/div>\n<p>Une catégorie contient plusieurs produits ; un produit a plusieurs mouvements (entrées / sorties).\nC'est ce qu'on dessine dans un <b>MCD<\/b> ou un schéma entité-relation.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "À quoi sert une clé étrangère ?", "options": ["À chiffrer les données", "À relier une ligne à une ligne d'une autre table", "À trier les résultats", "À accélérer le serveur web"], "answer": 1, "explain": "La clé étrangère <code>categorie_id<\/code> dans <code>produit<\/code> indique à quelle catégorie appartient chaque produit."}, {"type": "exercise", "title": "Exercice : dessine ton modèle", "task": "\n<p>Sur papier ou avec <a href=\"https://dbdiagram.io\" target=\"_blank\" rel=\"noopener\">dbdiagram.io<\/a>, dessine les tables\n<code>categorie<\/code>, <code>produit<\/code>, <code>mouvement_stock<\/code> et <code>utilisateur<\/code> avec leurs colonnes, clés primaires et clés étrangères.<\/p>\n", "solution": "categorie(id PK, nom)\nproduit(id PK, nom, prix, stock, seuil_minimum, categorie_id FK -> categorie.id)\nmouvement_stock(id PK, produit_id FK -> produit.id, type ENTREE/SORTIE, quantite, date_mouvement)\nutilisateur(id PK, email UNIQUE, mot_de_passe_hash, role VENDEUR/ADMIN)", "lang": "text"}]}, {"title": "SQL : créer et manipuler les données", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Créer des tables avec CREATE TABLE<\/li><li>Faire le CRUD : INSERT, SELECT, UPDATE, DELETE<\/li><li>Filtrer et trier avec WHERE et ORDER BY<\/li><\/ul>"}, {"type": "code", "title": "Créer les tables", "lang": "sql", "code": "CREATE DATABASE librastock;\nUSE librastock;\n\nCREATE TABLE categorie (\n    id  INT AUTO_INCREMENT PRIMARY KEY,\n    nom VARCHAR(100) NOT NULL UNIQUE\n);\n\nCREATE TABLE produit (\n    id            INT AUTO_INCREMENT PRIMARY KEY,\n    nom           VARCHAR(150) NOT NULL,\n    prix          DECIMAL(10,2) NOT NULL,\n    stock         INT NOT NULL DEFAULT 0,\n    seuil_minimum INT NOT NULL DEFAULT 5,\n    categorie_id  INT,\n    FOREIGN KEY (categorie_id) REFERENCES categorie(id)\n);", "note": ""}, {"type": "code", "title": "CRUD : Create, Read, Update, Delete", "lang": "sql", "code": "-- CREATE\nINSERT INTO categorie (nom) VALUES ('Livres'), ('Papeterie');\nINSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Cahier A4', 2.50, 140, 20, 2),\n       ('Stylo bleu', 0.80, 6, 30, 2),\n       ('Le Petit Prince', 7.90, 12, 5, 1);\n\n-- READ\nSELECT * FROM produit;\nSELECT nom, prix FROM produit WHERE prix < 5 ORDER BY prix DESC;\nSELECT nom FROM produit WHERE stock < seuil_minimum;   -- alertes !\n\n-- UPDATE (toujours avec un WHERE !)\nUPDATE produit SET stock = stock - 3 WHERE id = 1;\n\n-- DELETE (toujours avec un WHERE !)\nDELETE FROM produit WHERE id = 3;", "note": "⚠️ Un <code>UPDATE<\/code> ou <code>DELETE<\/code> sans <code>WHERE<\/code> modifie ou supprime <b>toutes<\/b> les lignes de la table."}, {"type": "quiz", "title": "Quiz", "question": "Quelle requête affiche les produits dont le stock est sous le seuil ?", "options": ["SELECT * FROM produit ORDER BY stock", "SELECT nom FROM produit WHERE stock < seuil_minimum", "UPDATE produit SET stock = 0", "DELETE FROM produit WHERE stock < 5"], "answer": 1, "explain": "<code>WHERE<\/code> filtre les lignes selon une condition."}, {"type": "exercise", "title": "Exercice : requêtes CRUD", "task": "\n<ol><li>Ajoute 3 produits de ton choix.<\/li>\n<li>Affiche tous les produits de la catégorie 2 triés par nom.<\/li>\n<li>Augmente de 10 % le prix des livres (catégorie 1).<\/li>\n<li>Affiche les 3 produits les plus chers (indice : <code>LIMIT<\/code>).<\/li><\/ol>\n", "solution": "INSERT INTO produit (nom, prix, stock, seuil_minimum, categorie_id)\nVALUES ('Gomme', 0.50, 80, 20, 2), ('Règle 30 cm', 1.20, 40, 10, 2), ('L''Étranger', 6.50, 9, 5, 1);\n\nSELECT * FROM produit WHERE categorie_id = 2 ORDER BY nom;\n\nUPDATE produit SET prix = prix * 1.10 WHERE categorie_id = 1;\n\nSELECT nom, prix FROM produit ORDER BY prix DESC LIMIT 3;", "lang": "sql"}]}, {"title": "MySQL en pratique : jointures et agrégats", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Installer et lancer MySQL<\/li><li>Combiner des tables avec JOIN<\/li><li>Calculer avec COUNT, SUM, GROUP BY<\/li><li>Livrer les scripts du module 2<\/li><\/ul>"}, {"type": "code", "title": "Lancer MySQL (avec Docker, recommandé)", "lang": "bash", "code": "docker run --name mysql-librastock \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  -e MYSQL_DATABASE=librastock \\\n  -p 3306:3306 -d mysql:8\n\n# Se connecter en ligne de commande\ndocker exec -it mysql-librastock mysql -u root -p", "note": "Sans Docker : installe MySQL Community Server + <b>MySQL Workbench<\/b> (interface graphique). Pour explorer la base, DBeaver est aussi un excellent outil gratuit."}, {"type": "code", "title": "JOIN : combiner plusieurs tables", "lang": "sql", "code": "-- Nom du produit + nom de sa catégorie\nSELECT p.nom AS produit, c.nom AS categorie, p.stock\nFROM produit p\nJOIN categorie c ON p.categorie_id = c.id;\n\n-- LEFT JOIN : garde aussi les catégories sans produit\nSELECT c.nom, p.nom\nFROM categorie c\nLEFT JOIN produit p ON p.categorie_id = c.id;", "note": ""}, {"type": "code", "title": "Agrégats : compter et additionner", "lang": "sql", "code": "-- Nombre de produits et valeur du stock par catégorie\nSELECT c.nom              AS categorie,\n       COUNT(p.id)        AS nb_produits,\n       SUM(p.prix * p.stock) AS valeur_stock\nFROM categorie c\nJOIN produit p ON p.categorie_id = c.id\nGROUP BY c.nom\nHAVING valeur_stock > 50\nORDER BY valeur_stock DESC;", "note": "<code>WHERE<\/code> filtre les lignes <i>avant<\/i> le regroupement, <code>HAVING<\/code> filtre les groupes <i>après<\/i>."}, {"type": "quiz", "title": "Quiz", "question": "Quelle clause regroupe les lignes pour calculer un total par catégorie ?", "options": ["ORDER BY", "GROUP BY", "LIMIT", "JOIN"], "answer": 1, "explain": "<code>GROUP BY<\/code> crée un groupe par valeur ; <code>SUM<\/code>, <code>COUNT<\/code>, <code>AVG<\/code> calculent sur chaque groupe."}, {"type": "exercise", "title": "🎯 Livrable du module 2", "task": "\n<p>Dans ton dépôt, crée un dossier <code>database/<\/code> avec :<\/p>\n<ul><li><code>schema.sql<\/code> : les 4 tables (categorie, produit, mouvement_stock, utilisateur) ;<\/li>\n<li><code>data.sql<\/code> : au moins 3 catégories, 15 produits et 20 mouvements ;<\/li>\n<li><code>requetes.sql<\/code> : 10 requêtes commentées (alertes, chiffre d'affaires par mois, top 5 des ventes…).<\/li><\/ul>\n", "solution": "CREATE TABLE mouvement_stock (\n    id             INT AUTO_INCREMENT PRIMARY KEY,\n    produit_id     INT NOT NULL,\n    type           ENUM('ENTREE','SORTIE') NOT NULL,\n    quantite       INT NOT NULL CHECK (quantite > 0),\n    date_mouvement DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (produit_id) REFERENCES produit(id)\n);\n\n-- Top 5 des produits les plus vendus\nSELECT p.nom, SUM(m.quantite) AS total_vendu\nFROM mouvement_stock m\nJOIN produit p ON p.id = m.produit_id\nWHERE m.type = 'SORTIE'\nGROUP BY p.nom\nORDER BY total_vendu DESC\nLIMIT 5;", "lang": "sql"}]}]}, {"id": "m3", "weeks": "Semaines 5 à 8", "title": "Les frameworks : Spring", "icon": "🌱", "color": "#6DB33F", "summary": "Construire une API REST professionnelle avec Spring Boot, reliée à MySQL et sécurisée.", "deliverable": "Une API REST Spring Boot fonctionnelle (CRUD produits, mouvements de stock, alertes) connectée à MySQL, avec validation, gestion d'erreurs, tests et authentification JWT.", "lessons": [{"title": "Introduction à Spring Boot", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre ce qu'est un framework<\/li><li>Comprendre l'injection de dépendances<\/li><li>Générer un projet avec Spring Initializr<\/li><\/ul>"}, {"type": "text", "title": "Framework : pourquoi ?", "html": "\n<p>Un <b>framework<\/b> est une structure prête à l'emploi : il gère la plomberie (serveur web, connexion à la base, sécurité…)\npour que tu te concentres sur la <b>logique métier<\/b>.<\/p>\n<p><b>Spring<\/b> est le framework Java le plus utilisé. <b>Spring Boot<\/b> le rend simple à démarrer : configuration automatique et serveur web (Tomcat) intégré.<\/p>\n<p><b>Injection de dépendances<\/b> : au lieu d'écrire <code>new ProduitService()<\/code> partout, Spring crée les objets (les <b>beans<\/b>) et te les « injecte » là où tu en as besoin.<\/p>\n"}, {"type": "text", "title": "Créer le projet", "html": "\n<ol class=\"steps\">\n<li>Va sur <a href=\"https://start.spring.io\" target=\"_blank\" rel=\"noopener\">start.spring.io<\/a>.<\/li>\n<li>Project : <b>Maven<\/b> · Language : <b>Java<\/b> · Spring Boot : dernière version stable · Java : <b>21<\/b>.<\/li>\n<li>Group : <code>com.librastock<\/code> · Artifact : <code>api<\/code>.<\/li>\n<li>Dépendances : <b>Spring Web<\/b>, <b>Spring Data JPA<\/b>, <b>MySQL Driver<\/b>, <b>Validation<\/b>, <b>Lombok<\/b> (optionnel).<\/li>\n<li>Clique sur <b>Generate<\/b>, dézippe, ouvre dans IntelliJ.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Structure du projet", "lang": "text", "code": "api/\n├── pom.xml                         ← dépendances Maven\n└── src/\n    ├── main/\n    │   ├── java/com/librastock/api/\n    │   │   ├── ApiApplication.java   ← point d'entrée\n    │   │   ├── controller/           ← reçoit les requêtes HTTP\n    │   │   ├── service/              ← logique métier\n    │   │   ├── repository/           ← accès à la base de données\n    │   │   ├── model/                ← entités (tables)\n    │   │   └── dto/                  ← objets échangés avec le client\n    │   └── resources/\n    │       └── application.properties\n    └── test/                         ← tests automatisés", "note": ""}, {"type": "code", "title": "Hello Spring", "lang": "java", "code": "@RestController\npublic class HelloController {\n\n    @GetMapping(\"/hello\")\n    public String hello() {\n        return \"LibraStock API est en ligne !\";\n    }\n}\n// Lance l'application puis ouvre http://localhost:8080/hello", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Que fait l'injection de dépendances ?", "options": ["Elle injecte du SQL dans la base", "Spring crée les objets et les fournit aux classes qui en ont besoin", "Elle installe les dépendances Maven", "Elle chiffre les mots de passe"], "answer": 1, "explain": "Spring gère le cycle de vie des <b>beans<\/b> (@Service, @Repository, @RestController…) et les injecte via le constructeur."}]}, {"title": "Construire une API REST", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre les principes REST<\/li><li>Créer un contrôleur CRUD<\/li><li>Utiliser les bons codes HTTP<\/li><li>Tester avec Postman ou curl<\/li><\/ul>"}, {"type": "text", "title": "Les routes de LibraStock", "html": "\n<table class=\"tbl\">\n<tr><th>Verbe<\/th><th>URL<\/th><th>Action<\/th><th>Réponse<\/th><\/tr>\n<tr><td>GET<\/td><td>/api/produits<\/td><td>Lister<\/td><td>200<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/{id}<\/td><td>Détail<\/td><td>200 / 404<\/td><\/tr>\n<tr><td>POST<\/td><td>/api/produits<\/td><td>Créer<\/td><td>201<\/td><\/tr>\n<tr><td>PUT<\/td><td>/api/produits/{id}<\/td><td>Modifier<\/td><td>200<\/td><\/tr>\n<tr><td>DELETE<\/td><td>/api/produits/{id}<\/td><td>Supprimer<\/td><td>204<\/td><\/tr>\n<tr><td>GET<\/td><td>/api/produits/alertes<\/td><td>Stock faible<\/td><td>200<\/td><\/tr>\n<\/table>\n<p>REST : des <b>ressources<\/b> (noms au pluriel) + des <b>verbes HTTP<\/b>. On échange du <b>JSON<\/b>.<\/p>\n"}, {"type": "code", "title": "Le contrôleur", "lang": "java", "code": "@RestController\n@RequestMapping(\"/api/produits\")\npublic class ProduitController {\n\n    private final ProduitService service;\n\n    public ProduitController(ProduitService service) { // injection par constructeur\n        this.service = service;\n    }\n\n    @GetMapping\n    public List<ProduitDto> lister() {\n        return service.lister();\n    }\n\n    @GetMapping(\"/{id}\")\n    public ProduitDto detail(@PathVariable Long id) {\n        return service.trouver(id);\n    }\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public ProduitDto creer(@Valid @RequestBody ProduitDto dto) {\n        return service.creer(dto);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    @ResponseStatus(HttpStatus.NO_CONTENT)\n    public void supprimer(@PathVariable Long id) {\n        service.supprimer(id);\n    }\n}", "note": ""}, {"type": "code", "title": "Un DTO avec validation", "lang": "java", "code": "public record ProduitDto(\n        Long id,\n        @NotBlank String nom,\n        @NotNull @Positive BigDecimal prix,\n        @PositiveOrZero int stock,\n        @PositiveOrZero int seuilMinimum,\n        Long categorieId\n) {}", "note": "Un <b>DTO<\/b> (Data Transfer Object) définit ce que l'API reçoit et renvoie. On n'expose pas directement les entités de la base."}, {"type": "code", "title": "Tester l'API", "lang": "bash", "code": "curl http://localhost:8080/api/produits\n\ncurl -X POST http://localhost:8080/api/produits \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"nom\":\"Classeur\",\"prix\":3.20,\"stock\":25,\"seuilMinimum\":5,\"categorieId\":2}'", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Quel code HTTP renvoyer après la création réussie d'un produit ?", "options": ["200 OK", "201 Created", "204 No Content", "404 Not Found"], "answer": 1, "explain": "<b>201 Created<\/b> indique qu'une nouvelle ressource a été créée."}]}, {"title": "Spring Data JPA et MySQL", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Configurer la connexion à MySQL<\/li><li>Transformer une classe en table avec @Entity<\/li><li>Utiliser un repository sans écrire de SQL<\/li><li>Gérer les relations entre entités<\/li><\/ul>"}, {"type": "code", "title": "application.properties", "lang": "properties", "code": "spring.datasource.url=jdbc:mysql://localhost:3306/librastock\nspring.datasource.username=root\nspring.datasource.password=${DB_PASSWORD}\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true", "note": "Ne mets jamais un vrai mot de passe dans le code : utilise une variable d'environnement (<code>${DB_PASSWORD}<\/code>)."}, {"type": "code", "title": "Une entité JPA", "lang": "java", "code": "@Entity\n@Table(name = \"produit\")\npublic class Produit {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false)\n    private String nom;\n\n    private BigDecimal prix;\n    private int stock;\n    private int seuilMinimum;\n\n    @ManyToOne\n    @JoinColumn(name = \"categorie_id\")\n    private Categorie categorie;\n\n    // constructeurs, getters, setters...\n}", "note": ""}, {"type": "code", "title": "Un repository", "lang": "java", "code": "public interface ProduitRepository extends JpaRepository<Produit, Long> {\n\n    // Spring génère le SQL à partir du nom de la méthode !\n    List<Produit> findByCategorieNom(String nom);\n\n    List<Produit> findByNomContainingIgnoreCase(String texte);\n\n    @Query(\"SELECT p FROM Produit p WHERE p.stock < p.seuilMinimum\")\n    List<Produit> findEnAlerte();\n}", "note": "<code>JpaRepository<\/code> fournit déjà <code>findAll()<\/code>, <code>findById()<\/code>, <code>save()<\/code>, <code>deleteById()<\/code>…"}, {"type": "code", "title": "Le service : la logique métier", "lang": "java", "code": "@Service\npublic class StockService {\n\n    private final ProduitRepository produits;\n    private final MouvementRepository mouvements;\n\n    public StockService(ProduitRepository produits, MouvementRepository mouvements) {\n        this.produits = produits;\n        this.mouvements = mouvements;\n    }\n\n    @Transactional\n    public void vendre(Long produitId, int quantite) {\n        Produit p = produits.findById(produitId)\n                .orElseThrow(() -> new RessourceIntrouvableException(\"Produit \" + produitId));\n        if (p.getStock() < quantite) {\n            throw new StockInsuffisantException(p.getNom());\n        }\n        p.setStock(p.getStock() - quantite);\n        mouvements.save(new MouvementStock(p, TypeMouvement.SORTIE, quantite));\n    }\n}", "note": "<code>@Transactional<\/code> : soit tout réussit (stock mis à jour + mouvement enregistré), soit rien n'est enregistré."}, {"type": "quiz", "title": "Quiz", "question": "Que fait spring.jpa.hibernate.ddl-auto=update ?", "options": ["Il supprime la base à chaque démarrage", "Il met à jour le schéma des tables selon les entités", "Il met à jour Spring Boot", "Il sauvegarde la base"], "answer": 1, "explain": "Pratique en développement. En production, on préfère des migrations versionnées avec <b>Flyway<\/b> ou <b>Liquibase<\/b>."}]}, {"title": "Qualité : erreurs, tests et sécurité", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Renvoyer des erreurs propres<\/li><li>Écrire des tests avec JUnit et MockMvc<\/li><li>Comprendre l'authentification par JWT et les rôles<\/li><li>Livrer l'API du module 3<\/li><\/ul>"}, {"type": "code", "title": "Gestion globale des erreurs", "lang": "java", "code": "@RestControllerAdvice\npublic class GestionErreurs {\n\n    @ExceptionHandler(RessourceIntrouvableException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public Map<String, String> introuvable(RessourceIntrouvableException e) {\n        return Map.of(\"erreur\", e.getMessage());\n    }\n\n    @ExceptionHandler(StockInsuffisantException.class)\n    @ResponseStatus(HttpStatus.CONFLICT)\n    public Map<String, String> stock(StockInsuffisantException e) {\n        return Map.of(\"erreur\", \"Stock insuffisant : \" + e.getMessage());\n    }\n}", "note": ""}, {"type": "code", "title": "Un test d'intégration", "lang": "java", "code": "@SpringBootTest\n@AutoConfigureMockMvc\nclass ProduitControllerTest {\n\n    @Autowired MockMvc mvc;\n\n    @Test\n    void produitInexistantRenvoie404() throws Exception {\n        mvc.perform(get(\"/api/produits/9999\"))\n           .andExpect(status().isNotFound());\n    }\n\n    @Test\n    void creationSansNomRenvoie400() throws Exception {\n        mvc.perform(post(\"/api/produits\")\n                .contentType(MediaType.APPLICATION_JSON)\n                .content(\"{\\\"prix\\\": 2.5}\"))\n           .andExpect(status().isBadRequest());\n    }\n}", "note": "Lance les tests avec <code>./mvnw test<\/code>. En semaine 13, GitHub Actions les lancera automatiquement à chaque push."}, {"type": "text", "title": "Sécurité : JWT et rôles", "html": "\n<ol class=\"steps\">\n<li>L'utilisateur envoie email + mot de passe à <code>POST /api/auth/login<\/code>.<\/li>\n<li>Le serveur vérifie le mot de passe (stocké <b>haché<\/b> avec BCrypt, jamais en clair).<\/li>\n<li>Il renvoie un <b>token JWT<\/b> signé, qui contient l'identifiant et le rôle.<\/li>\n<li>Le client envoie ce token dans chaque requête : <code>Authorization: Bearer &lt;token&gt;<\/code>.<\/li>\n<li><b>Spring Security<\/b> vérifie le token et les droits : un <code>VENDEUR<\/code> peut vendre, seul un <code>ADMIN<\/code> peut supprimer un produit.<\/li>\n<\/ol>\n"}, {"type": "code", "title": "Règles d'accès avec Spring Security", "lang": "java", "code": "@Bean\nSecurityFilterChain securite(HttpSecurity http, JwtFilter jwtFilter) throws Exception {\n    return http\n        .csrf(csrf -> csrf.disable())\n        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n        .authorizeHttpRequests(auth -> auth\n            .requestMatchers(\"/api/auth/**\").permitAll()\n            .requestMatchers(HttpMethod.DELETE, \"/api/**\").hasRole(\"ADMIN\")\n            .anyRequest().authenticated())\n        .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)\n        .build();\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Comment doit-on stocker les mots de passe ?", "options": ["En clair dans la base", "Chiffrés avec une clé dans le code", "Hachés avec un algorithme comme BCrypt", "Dans le token JWT"], "answer": 2, "explain": "Un hachage est irréversible : même en cas de fuite de la base, les mots de passe ne sont pas lisibles directement."}, {"type": "exercise", "title": "🎯 Livrable du module 3", "task": "\n<p>Une API Spring Boot <code>librastock-api<\/code> avec :<\/p>\n<ul><li>CRUD complet pour <b>produits<\/b> et <b>catégories<\/b> ;<\/li>\n<li><code>POST /api/stock/entree<\/code> et <code>POST /api/stock/sortie<\/code> (avec mouvement enregistré) ;<\/li>\n<li><code>GET /api/produits/alertes<\/code> ;<\/li>\n<li>validation + erreurs JSON propres (400, 404, 409) ;<\/li>\n<li>au moins 8 tests qui passent ;<\/li>\n<li>login JWT avec rôles VENDEUR / ADMIN ;<\/li>\n<li>un README qui explique comment lancer le projet.<\/li><\/ul>\n", "solution": "Checklist d'auto-évaluation :\n[ ] ./mvnw test → BUILD SUCCESS\n[ ] Toutes les routes testées dans Postman (collection exportée dans le dépôt)\n[ ] Aucun mot de passe ni secret dans le code (variables d'environnement)\n[ ] Un VENDEUR reçoit 403 sur DELETE /api/produits/{id}\n[ ] Vendre plus que le stock renvoie 409 et ne modifie rien", "lang": "text"}]}]}, {"id": "m4", "weeks": "Semaines 9 à 12", "title": "Le front-end", "icon": "🎨", "color": "#61DAFB", "summary": "Créer l'interface que les utilisateurs voient : HTML, CSS puis React connecté à ton API.", "deliverable": "Une application React LibraStock : connexion, liste des produits avec recherche, formulaire d'ajout, enregistrement d'une vente et tableau de bord des alertes, connectée à ton API Spring.", "lessons": [{"title": "HTML : la structure", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre le rôle de HTML<\/li><li>Utiliser les balises sémantiques<\/li><li>Créer des tableaux et des formulaires<\/li><\/ul>"}, {"type": "text", "title": "Le trio du web", "html": "\n<ul>\n<li><b>HTML<\/b> : la <b>structure<\/b> et le contenu (titres, textes, formulaires…).<\/li>\n<li><b>CSS<\/b> : la <b>présentation<\/b> (couleurs, mise en page, responsive).<\/li>\n<li><b>JavaScript<\/b> : le <b>comportement<\/b> (clics, appels à l'API…). React est une bibliothèque JavaScript.<\/li>\n<\/ul>\n<p>Un document HTML est un arbre de <b>balises<\/b> : <code>&lt;balise attribut=\"valeur\"&gt;contenu&lt;/balise&gt;<\/code>.<\/p>\n"}, {"type": "code", "title": "Une page sémantique", "lang": "html", "code": "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>LibraStock<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <header>\n    <h1>LibraStock<\/h1>\n    <nav><a href=\"#produits\">Produits<\/a> <a href=\"#alertes\">Alertes<\/a><\/nav>\n  <\/header>\n  <main>\n    <section id=\"produits\">\n      <h2>Produits<\/h2>\n      <table>\n        <thead><tr><th>Nom<\/th><th>Prix<\/th><th>Stock<\/th><\/tr><\/thead>\n        <tbody><tr><td>Cahier A4<\/td><td>2,50 €<\/td><td>140<\/td><\/tr><\/tbody>\n      <\/table>\n    <\/section>\n  <\/main>\n  <footer>© 2026 LibraStock<\/footer>\n<\/body>\n<\/html>", "note": ""}, {"type": "code", "title": "Un formulaire", "lang": "html", "code": "<form>\n  <label for=\"nom\">Nom du produit<\/label>\n  <input id=\"nom\" name=\"nom\" type=\"text\" required>\n\n  <label for=\"prix\">Prix (€)<\/label>\n  <input id=\"prix\" name=\"prix\" type=\"number\" step=\"0.01\" min=\"0\" required>\n\n  <label for=\"categorie\">Catégorie<\/label>\n  <select id=\"categorie\" name=\"categorie\">\n    <option value=\"1\">Livres<\/option>\n    <option value=\"2\">Papeterie<\/option>\n  <\/select>\n\n  <button type=\"submit\">Ajouter<\/button>\n<\/form>", "note": "Associe toujours un <code>&lt;label&gt;<\/code> à chaque champ : c'est indispensable pour l'accessibilité."}, {"type": "quiz", "title": "Quiz", "question": "Quelle balise utiliser pour le contenu principal d'une page ?", "options": ["<div>", "<main>", "<span>", "<b>"], "answer": 1, "explain": "<code>&lt;main&gt;<\/code> est une balise <b>sémantique<\/b> : elle donne du sens à la structure (utile pour l'accessibilité et le référencement)."}]}, {"title": "CSS : la mise en forme", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Cibler des éléments avec des sélecteurs<\/li><li>Comprendre le modèle de boîte<\/li><li>Mettre en page avec Flexbox et Grid<\/li><li>Rendre une page responsive<\/li><\/ul>"}, {"type": "code", "title": "Sélecteurs et modèle de boîte", "lang": "css", "code": "/* sélecteur de balise, de classe, d'id */\nbody { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; }\n.carte { background: white; border-radius: 12px; }\n#alertes { border-left: 4px solid crimson; }\n\n/* Modèle de boîte : contenu + padding + border + margin */\n.carte {\n  padding: 16px;          /* espace intérieur */\n  border: 1px solid #ddd; /* bordure */\n  margin: 8px;            /* espace extérieur */\n  box-sizing: border-box; /* width inclut padding et border */\n}", "note": ""}, {"type": "code", "title": "Flexbox et Grid", "lang": "css", "code": "/* Flexbox : aligner sur une ligne */\nheader {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 12px 24px;\n}\n\n/* Grid : une grille de cartes produits */\n.grille-produits {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 16px;\n}", "note": ""}, {"type": "code", "title": "Responsive", "lang": "css", "code": "/* Mobile d'abord, puis on adapte aux grands écrans */\nnav a { display: block; }\n\n@media (min-width: 768px) {\n  nav a { display: inline-block; margin-left: 16px; }\n}", "note": "Teste ton design dans les outils de développement du navigateur (mode appareil mobile)."}, {"type": "quiz", "title": "Quiz", "question": "Quelle propriété transforme un conteneur en grille ?", "options": ["display: flex", "display: grid", "position: absolute", "float: left"], "answer": 1, "explain": "<code>display: grid<\/code> + <code>grid-template-columns<\/code> définissent les colonnes."}, {"type": "exercise", "title": "Exercice : la page catalogue", "task": "\n<p>Crée une page HTML + CSS qui affiche 6 produits sous forme de cartes (nom, catégorie, prix, stock).\nLes cartes dont le stock est faible ont une bordure rouge (classe <code>.alerte<\/code>). Sur mobile : 1 colonne ; sur ordinateur : 3 colonnes.<\/p>\n", "solution": ".grille { display: grid; grid-template-columns: 1fr; gap: 16px; }\n@media (min-width: 900px) { .grille { grid-template-columns: repeat(3, 1fr); } }\n.carte { padding: 16px; border: 1px solid #ddd; border-radius: 12px; }\n.carte.alerte { border: 2px solid crimson; }", "lang": "css"}]}, {"title": "React : les bases", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Créer un projet React avec Vite<\/li><li>Écrire des composants et utiliser JSX<\/li><li>Passer des données avec les props<\/li><li>Gérer l'état avec useState<\/li><\/ul>"}, {"type": "code", "title": "Créer le projet", "lang": "bash", "code": "npm create vite@latest librastock-web -- --template react\ncd librastock-web\nnpm install\nnpm run dev        # ouvre http://localhost:5173", "note": "Prérequis : <b>Node.js LTS<\/b> installé. Vite est l'outil de démarrage recommandé aujourd'hui."}, {"type": "text", "title": "Composants et JSX", "html": "\n<p>Avec React, l'interface est découpée en <b>composants<\/b> : des fonctions qui renvoient du <b>JSX<\/b> (du HTML dans du JavaScript).<\/p>\n<div class=\"flow\"><span>App<\/span><span class=\"arrow\">→<\/span><span>BarreRecherche<\/span><span class=\"arrow\">+<\/span><span>ListeProduits<\/span><span class=\"arrow\">→<\/span><span>CarteProduit ×N<\/span><\/div>\n<p>Les données descendent du parent vers l'enfant via les <b>props<\/b>. Chaque composant peut avoir son propre <b>état<\/b> (<code>useState<\/code>) : quand l'état change, React met l'affichage à jour automatiquement.<\/p>\n"}, {"type": "code", "title": "Props et listes", "lang": "jsx", "code": "function CarteProduit({ produit }) {\n  const enAlerte = produit.stock < produit.seuilMinimum;\n  return (\n    <div className={enAlerte ? \"carte alerte\" : \"carte\"}>\n      <h3>{produit.nom}<\/h3>\n      <p>{produit.prix.toFixed(2)} € · stock : {produit.stock}<\/p>\n      {enAlerte && <strong>⚠ À commander<\/strong>}\n    <\/div>\n  );\n}\n\nfunction ListeProduits({ produits }) {\n  return (\n    <div className=\"grille\">\n      {produits.map(p => <CarteProduit key={p.id} produit={p} />)}\n    <\/div>\n  );\n}", "note": ""}, {"type": "code", "title": "L'état avec useState", "lang": "jsx", "code": "import { useState } from \"react\";\n\nfunction Recherche({ produits }) {\n  const [texte, setTexte] = useState(\"\");\n\n  const filtres = produits.filter(p =>\n    p.nom.toLowerCase().includes(texte.toLowerCase())\n  );\n\n  return (\n    <>\n      <input\n        placeholder=\"Rechercher un produit…\"\n        value={texte}\n        onChange={e => setTexte(e.target.value)}\n      />\n      <ListeProduits produits={filtres} />\n    <\/>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Que se passe-t-il quand on appelle setTexte(...) ?", "options": ["Rien, il faut recharger la page", "React met à jour l'état et ré-affiche le composant", "La valeur est envoyée au serveur", "Le composant est supprimé"], "answer": 1, "explain": "Changer l'état déclenche un nouveau rendu du composant."}]}, {"title": "React connecté à l'API", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Charger des données avec useEffect et fetch<\/li><li>Envoyer un formulaire à l'API<\/li><li>Naviguer entre les pages avec React Router<\/li><li>Livrer le front-end du module 4<\/li><\/ul>"}, {"type": "code", "title": "Charger les produits", "lang": "jsx", "code": "import { useEffect, useState } from \"react\";\n\nconst API = import.meta.env.VITE_API_URL; // ex. http://localhost:8080\n\nexport default function PageProduits() {\n  const [produits, setProduits] = useState([]);\n  const [chargement, setChargement] = useState(true);\n  const [erreur, setErreur] = useState(null);\n\n  useEffect(() => {\n    fetch(`${API}/api/produits`, {\n      headers: { Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n    })\n      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })\n      .then(setProduits)\n      .catch(e => setErreur(e.message))\n      .finally(() => setChargement(false));\n  }, []); // [] = une seule fois, au premier affichage\n\n  if (chargement) return <p>Chargement…<\/p>;\n  if (erreur) return <p>Erreur : {erreur}<\/p>;\n  return <ListeProduits produits={produits} />;\n}", "note": ""}, {"type": "code", "title": "Envoyer un formulaire", "lang": "jsx", "code": "function FormulaireVente({ produitId, onSucces }) {\n  const [quantite, setQuantite] = useState(1);\n\n  async function envoyer(e) {\n    e.preventDefault();\n    const r = await fetch(`${API}/api/stock/sortie`, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\",\n                 Authorization: `Bearer ${localStorage.getItem(\"token\")}` },\n      body: JSON.stringify({ produitId, quantite }),\n    });\n    if (r.status === 409) return alert(\"Stock insuffisant\");\n    onSucces();\n  }\n\n  return (\n    <form onSubmit={envoyer}>\n      <input type=\"number\" min=\"1\" value={quantite}\n             onChange={e => setQuantite(Number(e.target.value))} />\n      <button>Enregistrer la vente<\/button>\n    <\/form>\n  );\n}", "note": "Côté Spring, autorise l'origine du front (CORS) : <code>@CrossOrigin(\"http://localhost:5173\")<\/code> ou une configuration globale."}, {"type": "code", "title": "Plusieurs pages avec React Router", "lang": "jsx", "code": "// npm install react-router-dom\nimport { BrowserRouter, Routes, Route, Link } from \"react-router-dom\";\n\nexport default function App() {\n  return (\n    <BrowserRouter>\n      <nav>\n        <Link to=\"/\">Produits<\/Link> · <Link to=\"/alertes\">Alertes<\/Link>\n      <\/nav>\n      <Routes>\n        <Route path=\"/\" element={<PageProduits />} />\n        <Route path=\"/alertes\" element={<PageAlertes />} />\n        <Route path=\"/login\" element={<PageLogin />} />\n      <\/Routes>\n    <\/BrowserRouter>\n  );\n}", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Pourquoi passer [] comme second argument de useEffect ?", "options": ["Pour ne jamais exécuter l'effet", "Pour exécuter l'effet une seule fois au premier affichage", "Pour vider l'état", "Pour annuler fetch"], "answer": 1, "explain": "Le tableau de dépendances vide signifie : exécuter l'effet après le premier rendu uniquement."}, {"type": "exercise", "title": "🎯 Livrable du module 4", "task": "\n<p>L'application <code>librastock-web<\/code> doit avoir :<\/p>\n<ul><li>une page <b>Connexion<\/b> qui stocke le token JWT ;<\/li>\n<li>une page <b>Produits<\/b> avec recherche et ajout (ADMIN) ;<\/li>\n<li>l'enregistrement d'une <b>vente<\/b> et d'une <b>entrée<\/b> de stock ;<\/li>\n<li>une page <b>Alertes<\/b> ;<\/li>\n<li>un affichage propre sur mobile ;<\/li>\n<li>la gestion du chargement et des erreurs.<\/li><\/ul>\n", "solution": "Checklist d'auto-évaluation :\n[ ] npm run build fonctionne sans erreur\n[ ] L'URL de l'API vient d'une variable d'environnement (VITE_API_URL)\n[ ] Un utilisateur non connecté est redirigé vers /login\n[ ] Après une vente, la liste se met à jour sans recharger la page\n[ ] Testé sur un écran de téléphone", "lang": "text"}]}]}, {"id": "m5", "weeks": "Semaines 13 à 16", "title": "L'automatisation", "icon": "⚙️", "color": "#2088FF", "summary": "Automatiser les tests, le build et le déploiement avec GitHub Actions, puis livrer le projet final.", "deliverable": "Une pipeline GitHub Actions qui teste et construit l'API et le front à chaque push, une application déployée en ligne et un dépôt portfolio soigné (README, captures, schéma d'architecture).", "lessons": [{"title": "CI/CD et GitHub Actions", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Comprendre l'intégration et le déploiement continus<\/li><li>Connaître le vocabulaire : workflow, job, step, runner<\/li><li>Écrire un premier workflow<\/li><\/ul>"}, {"type": "text", "title": "Pourquoi automatiser ?", "html": "\n<ul>\n<li><b>CI – Intégration continue<\/b> : à chaque <code>push<\/code> ou <i>pull request<\/i>, le code est automatiquement compilé et testé. Un bug est détecté en quelques minutes, pas en production.<\/li>\n<li><b>CD – Déploiement continu<\/b> : si tout est vert, l'application est automatiquement construite et mise en ligne.<\/li>\n<\/ul>\n<div class=\"flow\"><span>git push<\/span><span class=\"arrow\">→<\/span><span>✅ Tests<\/span><span class=\"arrow\">→<\/span><span>📦 Build<\/span><span class=\"arrow\">→<\/span><span>🚀 Déploiement<\/span><\/div>\n"}, {"type": "text", "title": "Le vocabulaire GitHub Actions", "html": "\n<table class=\"tbl\">\n<tr><th>Terme<\/th><th>Signification<\/th><\/tr>\n<tr><td><b>Workflow<\/b><\/td><td>Un fichier YAML dans <code>.github/workflows/<\/code><\/td><\/tr>\n<tr><td><b>Event<\/b> (<code>on<\/code>)<\/td><td>Ce qui déclenche le workflow : push, pull_request, horaire…<\/td><\/tr>\n<tr><td><b>Job<\/b><\/td><td>Un groupe d'étapes exécuté sur une machine<\/td><\/tr>\n<tr><td><b>Runner<\/b><\/td><td>La machine virtuelle (ex. <code>ubuntu-latest<\/code>)<\/td><\/tr>\n<tr><td><b>Step<\/b><\/td><td>Une commande (<code>run<\/code>) ou une action réutilisable (<code>uses<\/code>)<\/td><\/tr>\n<\/table>\n"}, {"type": "code", "title": ".github/workflows/hello.yml", "lang": "yaml", "code": "name: Hello CI\n\non:\n  push:\n    branches: [main]\n\njobs:\n  bonjour:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Dire bonjour\n        run: echo \"Bonjour depuis GitHub Actions 👋\"\n      - name: Lister les fichiers\n        run: ls -la", "note": ""}, {"type": "quiz", "title": "Quiz", "question": "Où doit se trouver un fichier de workflow GitHub Actions ?", "options": [".github/workflows/", "src/main/resources/", "workflows/ à la racine", "node_modules/"], "answer": 0, "explain": "GitHub détecte automatiquement les fichiers YAML placés dans <code>.github/workflows/<\/code>."}]}, {"title": "Pipeline pour Java et React", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Tester et construire l'API Spring automatiquement<\/li><li>Construire le front React automatiquement<\/li><li>Utiliser une base MySQL dans la CI<\/li><li>Gérer les secrets<\/li><\/ul>"}, {"type": "code", "title": ".github/workflows/ci.yml", "lang": "yaml", "code": "name: CI LibraStock\n\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  api:\n    runs-on: ubuntu-latest\n    services:\n      mysql:\n        image: mysql:8\n        env:\n          MYSQL_ROOT_PASSWORD: test\n          MYSQL_DATABASE: librastock\n        ports: [\"3306:3306\"]\n        options: --health-cmd=\"mysqladmin ping\" --health-interval=10s --health-retries=5\n    defaults:\n      run:\n        working-directory: api\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: \"21\"\n          cache: maven\n      - name: Tests et build\n        run: ./mvnw -B verify\n        env:\n          DB_PASSWORD: test\n\n  web:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: web\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: web/package-lock.json\n      - run: npm ci\n      - run: npm run build", "note": ""}, {"type": "text", "title": "Les secrets", "html": "\n<p>Un mot de passe, une clé de signature JWT ou un token de déploiement ne doivent <b>jamais<\/b> être écrits dans le code.<\/p>\n<ol class=\"steps\">\n<li>Sur GitHub : <b>Settings → Secrets and variables → Actions → New repository secret<\/b>.<\/li>\n<li>Crée par ex. <code>JWT_SECRET<\/code> ou <code>DEPLOY_TOKEN<\/code>.<\/li>\n<li>Utilise-le dans un workflow : <code>${{ secrets.JWT_SECRET }}<\/code>. GitHub le masque dans les logs.<\/li>\n<\/ol>\n<p>Bonus : active la <b>protection de la branche main<\/b> pour interdire un merge tant que la CI n'est pas verte.<\/p>\n"}, {"type": "quiz", "title": "Quiz", "question": "Comment utiliser un secret nommé DEPLOY_TOKEN dans un workflow ?", "options": ["$DEPLOY_TOKEN", "${{ secrets.DEPLOY_TOKEN }}", "{{ DEPLOY_TOKEN }}", "process.env.DEPLOY_TOKEN"], "answer": 1, "explain": "La syntaxe des expressions GitHub Actions est <code>${{ ... }}<\/code>, et les secrets sont dans le contexte <code>secrets<\/code>."}, {"type": "exercise", "title": "Exercice : casse la CI exprès", "task": "\n<ol><li>Ajoute le workflow <code>ci.yml<\/code> à ton projet et pousse sur main : vérifie que tout est vert dans l'onglet <b>Actions<\/b>.<\/li>\n<li>Crée une branche, modifie un test pour qu'il échoue, ouvre une <i>pull request<\/i>.<\/li>\n<li>Observe le ❌ rouge sur la PR, lis les logs pour trouver le test en échec.<\/li>\n<li>Corrige, pousse à nouveau, constate le ✅.<\/li><\/ol>\n", "solution": "Ce que tu dois retenir :\n- Chaque push sur la PR relance la CI automatiquement.\n- Les logs de l'étape \"Tests et build\" indiquent le nom du test et la ligne en échec.\n- Avec la protection de branche, le bouton \"Merge\" reste bloqué tant que la CI est rouge.", "lang": "text"}]}, {"title": "Déploiement et projet final", "slides": [{"type": "text", "title": "Objectifs de la leçon", "html": "<ul class='goals'><li>Conteneuriser l'application avec Docker<\/li><li>Déployer automatiquement<\/li><li>Préparer ton portfolio et ton CV<\/li><li>Livrer le projet final<\/li><\/ul>"}, {"type": "code", "title": "Dockerfile de l'API", "lang": "dockerfile", "code": "# Étape 1 : construire le .jar\nFROM maven:3.9-eclipse-temurin-21 AS build\nWORKDIR /app\nCOPY . .\nRUN mvn -B package -DskipTests\n\n# Étape 2 : image légère pour l'exécution\nFROM eclipse-temurin:21-jre\nWORKDIR /app\nCOPY --from=build /app/target/*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]", "note": ""}, {"type": "code", "title": "docker-compose.yml : tout lancer en une commande", "lang": "yaml", "code": "services:\n  db:\n    image: mysql:8\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: librastock\n    volumes: [db-data:/var/lib/mysql]\n  api:\n    build: ./api\n    environment:\n      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/librastock\n      DB_PASSWORD: ${DB_PASSWORD}\n      JWT_SECRET: ${JWT_SECRET}\n    ports: [\"8080:8080\"]\n    depends_on: [db]\nvolumes:\n  db-data:", "note": "<code>docker compose up -d<\/code> démarre la base et l'API. Le front React construit (<code>npm run build<\/code>) peut être servi par <b>Nginx<\/b> ou hébergé sur un service statique."}, {"type": "text", "title": "Où déployer ?", "html": "\n<table class=\"tbl\">\n<tr><th>Partie<\/th><th>Options simples pour débuter<\/th><\/tr>\n<tr><td>Front React<\/td><td>GitHub Pages, Netlify, Vercel<\/td><\/tr>\n<tr><td>API Spring (Docker)<\/td><td>Render, Railway, Fly.io, ou un petit serveur VPS avec Nginx<\/td><\/tr>\n<tr><td>MySQL<\/td><td>Base managée du même hébergeur, ou conteneur sur le VPS<\/td><\/tr>\n<\/table>\n<p>Les offres gratuites changent souvent : vérifie les conditions actuelles avant de choisir.\nLa plupart de ces services peuvent déployer automatiquement à chaque push sur <code>main<\/code>, ou via une étape de déploiement dans ton workflow.<\/p>\n"}, {"type": "text", "title": "Ton portfolio", "html": "\n<p>Un recruteur passe environ une minute sur ton dépôt. Rends-la efficace :<\/p>\n<ul>\n<li><b>README<\/b> : une phrase qui explique le projet, une capture d'écran, le lien vers la démo en ligne.<\/li>\n<li><b>Schéma d'architecture<\/b> : React → API Spring → MySQL, avec la pipeline CI/CD.<\/li>\n<li><b>Stack technique<\/b> et <b>comment lancer le projet<\/b> en 3 commandes.<\/li>\n<li>Un <b>badge CI<\/b> vert en haut du README.<\/li>\n<li>Sur ton CV : « Développement d'une application fullstack (Java 21, Spring Boot, MySQL, React, Docker, GitHub Actions) » + lien.<\/li>\n<\/ul>\n"}, {"type": "quiz", "title": "Quiz", "question": "Quel est l'intérêt d'un Dockerfile en deux étapes (multi-stage) ?", "options": ["Compiler deux fois pour être sûr", "Obtenir une image finale plus légère, sans les outils de build", "Lancer deux applications", "Remplacer GitHub Actions"], "answer": 1, "explain": "La première étape contient Maven pour compiler, la seconde seulement le JRE et le .jar : l'image est plus petite et plus sûre."}, {"type": "exercise", "title": "🏁 Projet final", "task": "\n<p>Ton dépôt <code>librastock<\/code> contient :<\/p>\n<ul><li><code>api/<\/code> (Spring Boot), <code>web/<\/code> (React), <code>database/<\/code> (scripts SQL) ;<\/li>\n<li><code>docker-compose.yml<\/code> pour tout lancer en local ;<\/li>\n<li>une pipeline CI verte (tests + build) et un déploiement en ligne ;<\/li>\n<li>un README de portfolio avec capture, schéma et lien de démo.<\/li><\/ul>\n<p>Présente ton projet en 3 minutes comme dans un entretien : le problème, ta solution, la stack, une difficulté rencontrée et comment tu l'as résolue.<\/p>\n", "solution": "Checklist finale :\n[ ] git clone + docker compose up → l'application fonctionne\n[ ] Badge CI vert dans le README\n[ ] Démo en ligne accessible\n[ ] Aucun secret dans l'historique Git\n[ ] Tu sais expliquer chaque couche : React → REST/JSON → Spring → JPA → MySQL\n[ ] Tu sais expliquer la pipeline : push → tests → build → déploiement", "lang": "text"}]}]}], "project": "\n<p>Tout au long du bootcamp, tu construis <b>une seule application<\/b>, de bout en bout :\n<b>LibraStock<\/b>, une application de gestion de stock pour une librairie-papeterie.<\/p>\n<ul>\n<li><b>Produits<\/b> : livres, cahiers, stylos… avec prix, quantité en stock et catégorie.<\/li>\n<li><b>Mouvements de stock<\/b> : entrées (livraison fournisseur) et sorties (vente).<\/li>\n<li><b>Alertes<\/b> : liste des produits sous le seuil minimum.<\/li>\n<li><b>Utilisateurs<\/b> : rôle <code>VENDEUR<\/code> et rôle <code>ADMIN<\/code>.<\/li>\n<\/ul>\n<p>Chaque module ajoute une brique : la base de données, puis l'API Java/Spring, puis l'interface React,\npuis la pipeline automatique. À la fin, tu as un vrai projet à montrer dans ton portfolio.<\/p>\n"}, "en": {"modules": [{"id": "m1", "weeks": "Weeks 1 & 2", "title": "Computer science basics", "icon": "🖥️", "color": "#7CFC00", "summary": "Understand what happens behind a web application: the server, Git and the Java language.", "deliverable": "A public GitHub repository containing a small command-line Java program (managing an in-memory product list), with at least 5 clean commits.", "lessons": [{"title": "How a server works", "slides": [{"type": "text", "title": "Lesson goals", "html": "<ul class='goals'><li>Explain the client / server model<\/li><li>Understand an HTTP request and response<\/li><li>Know the role of DNS, IP addresses and ports<\/li><li>Use basic terminal commands<\/li><\/ul>"}, {"type": "text", "title": "Client
